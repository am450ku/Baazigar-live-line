<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover">

<title>BAAZIGAR LIVE LINE</title>

<style>
/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  background:#0d0f12;
  color:#f2f4ee;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
              Roboto,Arial,sans-serif;
}

body{
  min-height:100vh;
  background:#0d0f12;
  overflow-x:hidden;
}

button,
input,
select{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   VARIABLES
========================================================= */

:root{
  --bg:#0d0f12;
  --panel:#181b20;
  --panel2:#20242a;
  --border:#30343b;
  --text:#f2f4ee;
  --muted:#aeb3a5;
  --lime:#b7ff00;
  --lime-dark:#182400;
  --danger:#ff9292;
}


/* =========================================================
   HEADER
========================================================= */

.header{
  height:68px;
  width:100%;
  position:sticky;
  top:0;
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    0 max(12px,env(safe-area-inset-left))
    0 max(12px,env(safe-area-inset-right));

  background:rgba(13,15,18,.97);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(14px);
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
}

.menu-btn{
  width:40px;
  height:40px;
  flex:0 0 40px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid var(--border);
  border-radius:11px;

  background:#181b20;
  color:#fff;

  font-size:21px;
  cursor:pointer;
}

.menu-btn:active{
  transform:scale(.96);
}

.logo{
  font-size:18px;
  line-height:1;
  font-weight:900;
  letter-spacing:-.7px;
  white-space:nowrap;
}

.logo span{
  color:var(--lime);
}

.header-right{
  display:flex;
  align-items:center;
  gap:9px;
  flex-shrink:0;
}

.api-status{
  height:38px;

  display:flex;
  align-items:center;
  gap:7px;

  padding:0 11px;

  border:1px solid #587800;
  border-radius:11px;

  color:var(--lime);
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
}

.api-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--lime);
  box-shadow:0 0 9px var(--lime);
}

.avatar{
  width:40px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:var(--lime);
  color:#111600;

  font-size:17px;
  font-weight:900;
}


/* =========================================================
   SIDEBAR
========================================================= */

.overlay{
  position:fixed;
  inset:0;
  z-index:150;

  background:rgba(0,0,0,.66);

  opacity:0;
  visibility:hidden;
  pointer-events:none;

  transition:.22s ease;
}

.overlay.show{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

.sidebar{
  position:fixed;

  top:0;
  left:0;
  bottom:0;

  width:min(300px,86vw);

  z-index:200;

  display:flex;
  flex-direction:column;

  background:#090b0d;
  border-right:1px solid var(--border);

  transform:translateX(-101%);
  transition:transform .25s ease;

  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

.sidebar.open{
  transform:translateX(0);
}

.sidebar-head{
  padding:26px 20px 14px;
}

.sidebar-logo{
  font-size:27px;
  line-height:1.02;
  font-weight:900;
}

.sidebar-logo span{
  color:var(--lime);
}

.sidebar-sub{
  margin-top:15px;

  color:#8f958b;

  font-size:10px;
  letter-spacing:4px;
  line-height:1.8;
}

.new-match-side{
  width:calc(100% - 40px);
  height:56px;

  margin:18px 20px;

  border:0;
  border-radius:15px;

  background:var(--lime);
  color:#111500;

  font-size:17px;
  font-weight:900;

  cursor:pointer;
}

.nav{
  padding:0 10px 12px;
}

.nav-item{
  min-height:52px;

  display:flex;
  align-items:center;
  gap:14px;

  margin:3px 0;
  padding:0 14px;

  border-radius:9px;

  color:#aeb3a8;
  font-size:15px;
  font-weight:600;

  cursor:pointer;
}

.nav-item.active{
  color:var(--lime);
  background:#172106;
  border-left:3px solid var(--lime);
  padding-left:11px;
}

.nav-item:active{
  transform:scale(.99);
}

.nav-icon{
  width:27px;
  flex:0 0 27px;
  text-align:center;
  font-size:19px;
}

.sidebar-bottom{
  margin-top:auto;

  padding:10px;

  border-top:1px solid var(--border);
}

.logout{
  color:#ff9a9a;
}


/* =========================================================
   MAIN
========================================================= */

main{
  width:100%;
}

.container{
  width:100%;
  max-width:1180px;

  margin:0 auto;

  padding:
    25px
    20px
    calc(60px + env(safe-area-inset-bottom));
}


/* =========================================================
   PAGE HEADER
========================================================= */

.page-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;

  margin-bottom:26px;
}

.page-title{
  font-size:clamp(32px,5vw,48px);
  line-height:1;
  font-weight:900;
  letter-spacing:-1.8px;
}

.page-desc{
  margin-top:10px;

  color:var(--muted);

  font-size:15px;
  line-height:1.5;
}

.updated{
  flex-shrink:0;

  color:#bdc2b5;

  font-size:11px;
  line-height:1.55;
  text-align:right;
}


/* =========================================================
   STATS
========================================================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.stat-card{
  min-height:145px;

  padding:19px;

  background:var(--panel);

  border:1px solid var(--border);
  border-radius:15px;
}

.stat-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.stat-label{
  color:#c0c5b8;

  font-size:12px;
  font-weight:900;
}

.stat-icon{
  color:var(--lime);
  font-size:20px;
}

.stat-number{
  margin-top:25px;

  font-size:40px;
  line-height:1;
  font-weight:900;
}


/* =========================================================
   SECTIONS
========================================================= */

.section{
  margin-top:29px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  margin-bottom:14px;
}

.section-title{
  font-size:21px;
  font-weight:900;
}


/* =========================================================
   BUTTONS
========================================================= */

.btn{
  min-height:40px;

  padding:9px 14px;

  border:1px solid var(--border);
  border-radius:10px;

  background:var(--panel);
  color:#fff;

  font-size:13px;
  font-weight:800;

  cursor:pointer;
}

.btn:hover{
  border-color:var(--lime);
  color:var(--lime);
}

.btn:active{
  transform:scale(.97);
}

.btn-primary{
  background:var(--lime);
  color:#101400;
  border-color:var(--lime);
}

.btn-primary:hover{
  color:#101400;
}

.btn-danger{
  color:var(--danger);
}


/* =========================================================
   MATCH LIST
========================================================= */

.match-list{
  display:grid;
  gap:12px;
}

.match-card{
  padding:17px;

  background:var(--panel);

  border:1px solid var(--border);
  border-radius:14px;
}

.match-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;

  gap:15px;
}

.match-name{
  font-size:18px;
  font-weight:900;
}

.match-meta{
  margin-top:6px;

  color:var(--muted);

  font-size:12px;
  line-height:1.45;
}

.badge{
  flex-shrink:0;

  padding:5px 9px;

  border-radius:30px;

  font-size:9px;
  font-weight:900;
}

.badge-live{
  color:var(--lime);
  background:#182400;
  border:1px solid #587800;
}

.badge-upcoming{
  color:#d8dbd3;
  background:#24282e;
}

.badge-ended{
  color:#999;
  background:#1a1c20;
}

.match-score{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;

  margin:20px 0;

  text-align:center;
}

.team{
  font-size:16px;
  font-weight:800;

  overflow:hidden;
  text-overflow:ellipsis;
}

.score{
  padding:0 13px;

  font-size:27px;
  font-weight:900;
}

.vs{
  color:#747a73;

  padding:0 5px;

  font-size:10px;
}

.match-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{
  padding:38px 20px;

  text-align:center;

  background:var(--panel);

  border:1px dashed #343941;
  border-radius:15px;
}

.empty-icon{
  margin-bottom:10px;

  font-size:34px;
}

.empty h3{
  font-size:18px;
}

.empty p{
  margin-top:7px;

  color:var(--muted);

  font-size:13px;
  line-height:1.5;
}


/* =========================================================
   DATA CARDS
========================================================= */

.data-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.data-card{
  padding:18px;

  background:var(--panel);

  border:1px solid var(--border);
  border-radius:14px;
}

.data-card h3{
  margin-bottom:8px;

  font-size:16px;
}

.data-card p{
  color:var(--muted);

  font-size:13px;
  line-height:1.55;
}


/* =========================================================
   MODAL
========================================================= */

.modal-backdrop{
  position:fixed;
  inset:0;

  z-index:300;

  display:none;
  align-items:center;
  justify-content:center;

  padding:15px;

  background:rgba(0,0,0,.75);
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:520px;
  max-height:90vh;

  overflow-y:auto;

  padding:20px;

  background:#15181c;

  border:1px solid var(--border);
  border-radius:17px;

  box-shadow:0 25px 80px rgba(0,0,0,.55);
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:19px;
}

.modal-title{
  font-size:21px;
  font-weight:900;
}

.close{
  width:36px;
  height:36px;

  border:1px solid var(--border);
  border-radius:9px;

  background:var(--panel);
  color:#fff;

  font-size:21px;

  cursor:pointer;
}

.form{
  display:grid;
  gap:13px;
}

.field{
  display:grid;
  gap:7px;
}

.field label{
  color:#bec3b7;

  font-size:11px;
  font-weight:800;
}

.field input,
.field select{
  width:100%;
  height:45px;

  padding:0 12px;

  background:#0e1013;

  border:1px solid var(--border);
  border-radius:9px;

  color:#fff;

  outline:none;

  font-size:14px;
}

.field input:focus,
.field select:focus{
  border-color:var(--lime);
}

.form-actions{
  display:flex;
  gap:10px;

  margin-top:5px;
}

.form-actions .btn{
  flex:1;
  height:45px;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;

  left:50%;
  bottom:22px;

  z-index:500;

  padding:11px 16px;

  border-radius:10px;

  background:#eef2e8;
  color:#10120e;

  font-size:13px;
  font-weight:800;

  opacity:0;
  pointer-events:none;

  transform:translate(-50%,20px);

  transition:.2s ease;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  .header{
    height:66px;
  }

  .logo{
    font-size:16px;
  }

  .api-status{
    height:35px;
    padding:0 9px;
    font-size:9px;
  }

  .avatar{
    width:37px;
    height:37px;
    font-size:16px;
  }

  .container{
    padding:
      24px
      14px
      calc(50px + env(safe-area-inset-bottom));
  }

  .page-head{
    display:block;
    margin-bottom:21px;
  }

  .page-title{
    font-size:34px;
  }

  .page-desc{
    margin-top:9px;
    font-size:14px;
  }

  .updated{
    margin-top:12px;
    text-align:left;
    font-size:10px;
  }

  .stats{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .stat-card{
    min-height:120px;
    padding:14px;
    border-radius:13px;
  }

  .stat-label{
    font-size:10px;
  }

  .stat-icon{
    font-size:17px;
  }

  .stat-number{
    margin-top:21px;
    font-size:32px;
  }

  .section{
    margin-top:23px;
  }

  .section-title{
    font-size:18px;
  }

  .section-head{
    margin-bottom:12px;
  }

  .btn{
    min-height:38px;
    padding:8px 11px;
    font-size:11px;
  }

  .match-card{
    padding:14px;
  }

  .match-name{
    font-size:15px;
  }

  .match-meta{
    font-size:11px;
  }

  .team{
    font-size:13px;
  }

  .score{
    font-size:23px;
    padding:0 7px;
  }

  .vs{
    padding:0 3px;
  }

  .data-grid{
    grid-template-columns:1fr;
    gap:10px;
  }

  .data-card{
    padding:15px;
  }

  .sidebar{
    width:min(310px,87vw);
  }

  .modal{
    max-height:88vh;
    padding:16px;
    border-radius:15px;
  }

  .modal-title{
    font-size:19px;
  }
}


/* =========================================================
   SMALL IPHONES
========================================================= */

@media(max-width:390px){

  .api-status{
    display:none;
  }

  .logo{
    font-size:16px;
  }

  .menu-btn{
    width:38px;
    height:38px;
    flex-basis:38px;
  }

  .stats{
    gap:8px;
  }

  .stat-card{
    padding:12px;
  }

  .stat-number{
    font-size:30px;
  }

  .section-head .btn{
    padding-left:9px;
    padding-right:9px;
  }
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:1000px){

  .container{
    padding-left:28px;
    padding-right:28px;
  }
}
</style>
</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header class="header">

  <div class="brand">

    <button
      class="menu-btn"
      id="menuBtn"
      aria-label="Open menu">
      ☰
    </button>

    <div class="logo">
      BAAZIGAR <span>LIVE LINE</span>
    </div>

  </div>


  <div class="header-right">

    <div class="api-status">
      <span class="api-dot"></span>
      API ACTIVE
    </div>

    <div class="avatar">
      A
    </div>

  </div>

</header>


<!-- =======================================================
     OVERLAY
======================================================= -->

<div
  class="overlay"
  id="overlay">
</div>


<!-- =======================================================
     SIDEBAR
======================================================= -->

<aside
  class="sidebar"
  id="sidebar">

  <div class="sidebar-head">

    <div class="sidebar-logo">
      BAAZIGAR <span>LIVE LINE</span>
    </div>

    <div class="sidebar-sub">
      ADMIN CONTROL PANEL
    </div>

  </div>


  <button
    class="new-match-side"
    id="sideNewMatch">
    ＋ New Match
  </button>


  <nav class="nav">

    <div
      class="nav-item active"
      data-page="dashboard">

      <span class="nav-icon">▦</span>

      <span>Dashboard</span>

    </div>


    <div
      class="nav-item"
      data-page="matches">

      <span class="nav-icon">⚔</span>

      <span>Match Management</span>

    </div>


    <div
      class="nav-item"
      data-page="series">

      <span class="nav-icon">▣</span>

      <span>Series</span>

    </div>


    <div
      class="nav-item"
      data-page="teams">

      <span class="nav-icon">♟</span>

      <span>Teams</span>

    </div>


    <div
      class="nav-item"
      data-page="players">

      <span class="nav-icon">♙</span>

      <span>Players</span>

    </div>


    <div
      class="nav-item"
      data-page="api">

      <span class="nav-icon">◆</span>

      <span>API Settings</span>

    </div>


    <div
      class="nav-item"
      data-page="users">

      <span class="nav-icon">♙</span>

      <span>User Management</span>

    </div>

  </nav>


  <div class="sidebar-bottom">

    <div
      class="nav-item"
      data-page="settings">

      <span class="nav-icon">⚙</span>

      <span>Settings</span>

    </div>


    <div
      class="nav-item logout"
      id="logoutBtn">

      <span class="nav-icon">↪</span>

      <span>Logout</span>

    </div>

  </div>

</aside>


<!-- =======================================================
     MAIN
======================================================= -->

<main>

  <div
    class="container"
    id="app">
  </div>

</main>


<!-- =======================================================
     NEW MATCH MODAL
======================================================= -->

<div
  class="modal-backdrop"
  id="matchModal">

  <div class="modal">

    <div class="modal-head">

      <div class="modal-title">
        Create New Match
      </div>

      <button
        class="close"
        id="closeModal">
        ×
      </button>

    </div>


    <form
      class="form"
      id="matchForm">


      <div class="field">

        <label>
          Match Name
        </label>

        <input
          id="matchName"
          required
          placeholder="India vs Australia">

      </div>


      <div class="field">

        <label>
          Team 1
        </label>

        <input
          id="team1"
          required
          placeholder="India">

      </div>


      <div class="field">

        <label>
          Team 2
        </label>

        <input
          id="team2"
          required
          placeholder="Australia">

      </div>


      <div class="field">

        <label>
          Series
        </label>

        <input
          id="matchSeries"
          placeholder="ODI Series">

      </div>


      <div class="field">

        <label>
          Match Date
        </label>

        <input
          type="datetime-local"
          id="matchDate"
          required>

      </div>


      <div class="field">

        <label>
          Status
        </label>

        <select id="matchStatus">

          <option value="upcoming">
            Upcoming
          </option>

          <option value="live">
            Live
          </option>

        </select>

      </div>


      <div class="form-actions">

        <button
          type="button"
          class="btn"
          id="cancelModal">
          Cancel
        </button>

        <button
          type="submit"
          class="btn btn-primary">
          Create Match
        </button>

      </div>

    </form>

  </div>

</div>


<!-- =======================================================
     TOAST
======================================================= -->

<div
  class="toast"
  id="toast">
</div>


<script>

/* =========================================================
   STORAGE
========================================================= */

let matches = [];

try{

  matches = JSON.parse(
    localStorage.getItem("baazigar_matches") || "[]"
  );

  if(!Array.isArray(matches)){
    matches=[];
  }

}catch(error){

  matches=[];

}


let currentPage="dashboard";


/* =========================================================
   ELEMENTS
========================================================= */

const app =
  document.getElementById("app");

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

const menuBtn =
  document.getElementById("menuBtn");

const modal =
  document.getElementById("matchModal");

const matchForm =
  document.getElementById("matchForm");


/* =========================================================
   MENU
========================================================= */

function openMenu(){

  sidebar.classList.add("open");
  overlay.classList.add("show");

}

function closeMenu(){

  sidebar.classList.remove("open");
  overlay.classList.remove("show");

}

menuBtn.addEventListener(
  "click",
  openMenu
);

overlay.addEventListener(
  "click",
  closeMenu
);


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Escape"){

      closeMenu();

      closeMatchModal();

    }

  }
);


/* =========================================================
   SAVE
========================================================= */

function saveMatches(){

  localStorage.setItem(
    "baazigar_matches",
    JSON.stringify(matches)
  );

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function toast(message){

  const el =
    document.getElementById("toast");

  el.textContent=message;

  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(
    function(){

      el.classList.remove("show");

    },
    2200
  );

}


/* =========================================================
   MODAL
========================================================= */

function openMatchModal(){

  modal.classList.add("show");

  setTimeout(
    function(){

      document
        .getElementById("matchName")
        .focus();

    },
    50
  );

}

function closeMatchModal(){

  modal.classList.remove("show");

  matchForm.reset();

}


document
  .getElementById("sideNewMatch")
  .addEventListener(
    "click",
    function(){

      closeMenu();

      openMatchModal();

    }
  );


document
  .getElementById("closeModal")
  .addEventListener(
    "click",
    closeMatchModal
  );


document
  .getElementById("cancelModal")
  .addEventListener(
    "click",
    closeMatchModal
  );


modal.addEventListener(
  "click",
  function(e){

    if(e.target===modal){

      closeMatchModal();

    }

  }
);


/* =========================================================
   CREATE MATCH
========================================================= */

matchForm.addEventListener(
  "submit",
  function(e){

    e.preventDefault();


    const name =
      document
        .getElementById("matchName")
        .value
        .trim();


    const team1 =
      document
        .getElementById("team1")
        .value
        .trim();


    const team2 =
      document
        .getElementById("team2")
        .value
        .trim();


    const series =
      document
        .getElementById("matchSeries")
        .value
        .trim() || "General";


    const date =
      document
        .getElementById("matchDate")
        .value;


    const status =
      document
        .getElementById("matchStatus")
        .value;


    if(!name || !team1 || !team2 || !date){

      toast("Please fill all required fields");

      return;

    }


    const match={

      id:Date.now(),

      name:name,

      team1:team1,

      team2:team2,

      series:series,

      date:date,

      status:status,

      score1:0,

      score2:0

    };


    matches.unshift(match);

    saveMatches();

    closeMatchModal();


    currentPage="matches";

    setActiveNav("matches");

    render();


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });


    toast("Match created successfully");

  }
);


/* =========================================================
   DATE
========================================================= */

function formatDate(value){

  if(!value){
    return "Date not set";
  }

  const d=new Date(value);

  if(isNaN(d.getTime())){
    return value;
  }

  return d.toLocaleString(
    [],
    {
      day:"2-digit",
      month:"short",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

/* =========================================================
   MATCH LIST
========================================================= */

function renderMatchList(limit){

  let list=matches;

  if(limit){

    list=matches.slice(0,limit);

  }


  if(!list.length){

    return `

      <div class="empty">

        <div class="empty-icon">
          ⚔
        </div>

        <h3>
          No matches yet
        </h3>

        <p>
          Create your first match using
          the New Match button.
        </p>

      </div>

    `;

  }


  return `

    <div class="match-list">

      ${list.map(matchCard).join("")}

    </div>

  `;

}


/* =========================================================
   MATCH CARD
========================================================= */

function matchCard(m){

  const badgeClass =
    m.status==="live"
      ? "badge-live"
      : m.status==="ended"
      ? "badge-ended"
      : "badge-upcoming";


  const statusText =
    m.status==="live"
      ? "LIVE"
      : m.status==="ended"
      ? "ENDED"
      : "UPCOMING";


  return `

    <div class="match-card">


      <div class="match-top">

        <div>

          <div class="match-name">
            ${escapeHTML(m.name)}
          </div>

          <div class="match-meta">

            ${escapeHTML(m.series)}

            ·

            ${formatDate(m.date)}

          </div>

        </div>


        <span
          class="badge ${badgeClass}">

          ${statusText}

        </span>

      </div>


      <div class="match-score">

        <div class="team">
          ${escapeHTML(m.team1)}
        </div>


        <div class="score">

          ${m.score1}

          <span class="vs">
            VS
          </span>

          ${m.score2}

        </div>


        <div class="team">
          ${escapeHTML(m.team2)}
        </div>

      </div>


      <div class="match-actions">


        ${
          m.status!=="ended"
          ?

          `

            <button
              class="btn"
              onclick="changeStatus(${m.id})">

              ${
                m.status==="live"
                ? "End Match"
                : "Start Live"
              }

            </button>

          `

          : ""

        }


        ${
          m.status==="live"
          ?

          `

            <button
              class="btn"
              onclick="addScore(${m.id},1)">

              + ${escapeHTML(m.team1)}

            </button>


            <button
              class="btn"
              onclick="addScore(${m.id},2)">

              + ${escapeHTML(m.team2)}

            </button>

          `

          : ""

        }


        <button
          class="btn btn-danger"
          onclick="deleteMatch(${m.id})">

          Delete

        </button>


      </div>

    </div>

  `;

}


/* =========================================================
   STATUS
========================================================= */

function changeStatus(id){

  const match =
    matches.find(
      m=>m.id===id
    );


  if(!match){
    return;
  }


  if(match.status==="upcoming"){

    match.status="live";

    toast("Match is now LIVE");

  }

  else if(match.status==="live"){

    match.status="ended";

    toast("Match ended");

  }


  saveMatches();

  render();

}


/* =========================================================
   SCORE
========================================================= */

function addScore(id,team){

  const match =
    matches.find(
      m=>m.id===id
    );


  if(
    !match ||
    match.status!=="live"
  ){

    return;

  }


  if(team===1){

    match.score1++;

  }

  else{

    match.score2++;

  }


  saveMatches();

  render();

}


/* =========================================================
   DELETE
========================================================= */

function deleteMatch(id){

  const match =
    matches.find(
      m=>m.id===id
    );


  if(!match){
    return;
  }


  const confirmed =
    confirm(
      "Delete this match?"
    );


  if(!confirmed){
    return;
  }


  matches =
    matches.filter(
      m=>m.id!==id
    );


  saveMatches();

  render();

  toast("Match deleted");

}

/* =========================================================
   ACTIVE NAV
========================================================= */

function setActiveNav(page){

  document
    .querySelectorAll(
      ".nav-item[data-page]"
    )
    .forEach(
      item=>{

        item.classList.toggle(
          "active",
          item.dataset.page===page
        );

      }
    );

}


/* =========================================================
   NAVIGATION
========================================================= */

    item=>{

      item.addEventListener(
        "click",
        function(){

          currentPage=
            item.dataset.page;


          setActiveNav(
            currentPage
          );


          closeMenu();

          render();

        }
      );

    }
  );

/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}
