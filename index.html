/* =========================================
   HELPERS
========================================= */

function esc(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function dateFormat(value) {

  if (!value)
    return "Date not set";

  const d = new Date(value);

  if (isNaN(d.getTime()))
    return String(value);

  return d.toLocaleString([], {
    day: "2-digit",
    month: "short",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });
}


function el(id) {
  return document.getElementById(id);
}


/* =========================================
   TOAST
========================================= */

function showToast(text) {

  const toast = el("toast");

  if (!toast) {
    console.log(text);
    return;
  }

  toast.textContent = text;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {

    toast.classList.remove("show");

  }, 3000);
}


/* =========================================
   API STATUS
========================================= */

function setApiStatus(text) {

  const status = el("apiStatus");

  if (status)
    status.textContent = text;
}


/* =========================================
   TEAM NAME
========================================= */

function teamName(id) {

  const team = teamsCache.find(
    t => String(t.id) === String(id)
  );

  if (!team)
    return "Team #" + id;

  return (
    team.name ||
    team.team_name ||
    team.title ||
    "Team #" + id
  );
}


/* =========================================
   SERIES NAME
========================================= */

function seriesName(id) {

  if (!id)
    return "General";

  const series = seriesCache.find(
    s => String(s.id) === String(id)
  );

  if (!series)
    return "Series #" + id;

  return (
    series.name ||
    series.series_name ||
    series.title ||
    "Series #" + id
  );
}


/* =========================================
   LOAD REFERENCE DATA
========================================= */

async function loadReferenceData() {

  if (!sb) {
    setApiStatus("API ERROR");
    return;
  }

  try {

    const [
      teamsResult,
      seriesResult
    ] = await Promise.all([

      sb
        .from("teams")
        .select("*"),

      sb
        .from("series")
        .select("*")

    ]);


    if (teamsResult.error) {

      console.error(
        "Teams error:",
        teamsResult.error
      );

      teamsCache = [];

    } else {

      teamsCache =
        teamsResult.data || [];

    }


    if (seriesResult.error) {

      console.error(
        "Series error:",
        seriesResult.error
      );

      seriesCache = [];

    } else {

      seriesCache =
        seriesResult.data || [];

    }

  } catch (error) {

    console.error(
      "Reference data error:",
      error
    );

  }
}


/* =========================================
   LOAD MATCHES
========================================= */

async function loadMatches() {

  if (!sb) {

    setApiStatus("API ERROR");

    showToast(
      "Supabase connection unavailable"
    );

    return;

  }


  try {

    const {
      data,
      error
    } = await sb
      .from("matches")
      .select("*")
      .order(
        "start_time",
        {
          ascending: false
        }
      );


    if (error) {

      console.error(
        "Matches error:",
        error
      );

      setApiStatus("API ERROR");

      showToast(
        "Matches load failed: " +
        error.message
      );

      render();

      return;
    }


    matches =
      data || [];


    setApiStatus("API ACTIVE");

    render();


  } catch (error) {

    console.error(
      "Load matches error:",
      error
    );

    setApiStatus("API ERROR");

    showToast(
      "Supabase error"
    );

  }
}

/* =========================================
   MATCH LIST
========================================= */

function matchList(limit) {

  const list =
    limit
      ? matches.slice(0, limit)
      : matches;


  if (!list.length) {

    return `

      <div class="empty">

        <div class="empty-icon">
          ⚔
        </div>

        <h3>
          No matches yet
        </h3>

        <p>
          Create your first match.
        </p>

      </div>

    `;

  }


  return `

    <div class="match-list">

      ${list
        .map(matchCard)
        .join("")}

    </div>

  `;

}


/* =========================================
   MATCH CARD
========================================= */

function matchCard(match) {

  const status =
    match.status || "upcoming";


  const cls =
    status === "live"
      ? "live"
      : status === "ended"
      ? "ended"
      : "upcoming";


  const statusText =
    status === "live"
      ? "LIVE"
      : status === "ended"
      ? "ENDED"
      : "UPCOMING";


  const t1 =
    teamName(match.team1_id);


  const t2 =
    teamName(match.team2_id);


  const s1 =
    Number(match.team1_score || 0);


  const s2 =
    Number(match.team2_score || 0);


  return `

    <div class="match">

      <div class="match-top">

        <div>

          <div class="match-name">

            ${esc(t1)}
            vs
            ${esc(t2)}

          </div>


          <div class="meta">

            ${esc(
              seriesName(
                match.series_id
              )
            )}

            ·

            ${dateFormat(
              match.start_time
            )}

          </div>

        </div>


        <span class="badge ${cls}">

          ${statusText}

        </span>

      </div>


      <div class="score">

        <div class="team">

          ${esc(t1)}

        </div>


        <div class="score-num">

          ${s1}

          <span class="vs">
            VS
          </span>

          ${s2}

        </div>


        <div class="team">

          ${esc(t2)}

        </div>

      </div>


      <div class="actions">


        ${
          status !== "ended"

          ?

          `

          <button
            class="btn"
            onclick="changeStatus(
              ${JSON.stringify(match.id)},
              ${JSON.stringify(status)}
            )">

            ${
              status === "live"
                ? "End Match"
                : "Start Live"
            }

          </button>

          `

          : ""

        }


        ${
          status === "live"

          ?

          `

          <button
            class="btn"
            onclick="addScore(
              ${JSON.stringify(match.id)},
              1
            )">

            + ${esc(t1)}

          </button>


          <button
            class="btn"
            onclick="addScore(
              ${JSON.stringify(match.id)},
              2
            )">

            + ${esc(t2)}

          </button>

          `

          : ""

        }


        <button
          class="btn danger"
          onclick="deleteMatch(
            ${JSON.stringify(match.id)}
          )">

          Delete

        </button>

      </div>

    </div>

  `;

}


/* =========================================
   CHANGE STATUS
========================================= */

async function changeStatus(
  id,
  status
) {

  if (!sb)
    return;


  const next =
    status === "upcoming"
      ? "live"
      : "ended";


  const {
    error
  } = await sb
    .from("matches")
    .update({
      status: next
    })
    .eq("id", id);


  if (error) {

    console.error(error);

    showToast(
      "Status update failed: " +
      error.message
    );

    return;

  }


  showToast(
    next === "live"
      ? "Match is LIVE"
      : "Match ended"
  );


  await loadMatches();

}


window.changeStatus =
  changeStatus;


/* =========================================
   ADD SCORE
========================================= */

async function addScore(
  id,
  team
) {

  if (!sb)
    return;


  const match =
    matches.find(
      x =>
        String(x.id) ===
        String(id)
    );


  if (
    !match ||
    match.status !== "live"
  ) {

    showToast(
      "Match is not LIVE"
    );

    return;

  }


  const updateData =
    team === 1

      ?

      {
        team1_score:
          Number(
            match.team1_score || 0
          ) + 1
      }

      :

      {
        team2_score:
          Number(
            match.team2_score || 0
          ) + 1
      };


  const {
    error
  } = await sb
    .from("matches")
    .update(updateData)
    .eq("id", id);


  if (error) {

    console.error(error);

    showToast(
      "Score update failed: " +
      error.message
    );

    return;

  }


  await loadMatches();

}


window.addScore =
  addScore;


/* =========================================
   DELETE MATCH
========================================= */

async function deleteMatch(id) {

  if (!sb)
    return;


  if (
    !confirm(
      "Delete this match?"
    )
  )
    return;


  const {
    error
  } = await sb
    .from("matches")
    .delete()
    .eq("id", id);


  if (error) {

    console.error(error);

    showToast(
      "Delete failed: " +
      error.message
    );

    return;

  }


  showToast(
    "Match deleted"
  );


  await loadMatches();

}


window.deleteMatch =
  deleteMatch;

/* =========================================
   CREATE MATCH
========================================= */

if (form) {

  form.onsubmit =
    async function(e) {

      e.preventDefault();


      if (!sb) {

        showToast(
          "Supabase connection unavailable"
        );

        return;

      }


      const team1Input =
        el("team1");

      const team2Input =
        el("team2");

      const seriesInput =
        el("series");

      const statusInput =
        el("status");

      const dateInput =
        el("date");


      const team1 =
        team1Input
          ? team1Input.value.trim()
          : "";


      const team2 =
        team2Input
          ? team2Input.value.trim()
          : "";


      const series =
        seriesInput
          ? seriesInput.value.trim()
          : "";


      const status =
        statusInput
          ? statusInput.value
          : "upcoming";


      const date =
        dateInput
          ? dateInput.value
          : "";


      const t1 =
        teamsCache.find(
          team =>
            String(
              team.name ||
              team.team_name ||
              team.title ||
              ""
            )
            .toLowerCase()
            ===
            team1.toLowerCase()
        );


      const t2 =
        teamsCache.find(
          team =>
            String(
              team.name ||
              team.team_name ||
              team.title ||
              ""
            )
            .toLowerCase()
            ===
            team2.toLowerCase()
        );


      if (!t1 || !t2) {

        showToast(
          "Team name Supabase teams table se match nahi hua"
        );

        return;

      }


      let selectedSeries = null;


      if (series) {

        selectedSeries =
          seriesCache.find(
            item =>
              String(
                item.name ||
                item.series_name ||
                item.title ||
                ""
              )
              .toLowerCase()
              ===
              series.toLowerCase()
          );


        if (!selectedSeries) {

          showToast(
            "Series Supabase series table me nahi mili"
          );

          return;

        }

      }


      if (!date) {

        showToast(
          "Match date/time select karo"
        );

        return;

      }


      const payload = {

        series_id:
          selectedSeries
            ? selectedSeries.id
            : null,

        team1_id:
          t1.id,

        team2_id:
          t2.id,

        status:
          status,

        start_time:
          new Date(
            date
          ).toISOString(),

        team1_score: 0,
        team1_wickets: 0,
        team1_overs: 0,

        team2_score: 0,
        team2_wickets: 0,
        team2_overs: 0

      };


      const {
        error
      } = await sb
        .from("matches")
        .insert(payload);


      if (error) {

        console.error(
          "Create match error:",
          error
        );

        showToast(
          "Match create failed: " +
          error.message
        );

        return;

      }


      closeModal();


      currentPage =
        "matches";


      setActive(
        "matches"
      );


      showToast(
        "Match created in Supabase"
      );


      await loadMatches();

    };

}


/* =========================================
   SUPABASE REALTIME
========================================= */

async function startRealtime() {

  if (!sb)
    return;


  try {

    sb
      .channel(
        "matches-realtime"
      )
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "matches"
        },
        payload => {

          console.log(
            "Realtime match update:",
            payload
          );

          loadMatches();

        }
      )
      .subscribe();

  } catch (error) {

    console.error(
      "Realtime error:",
      error
    );

  }

}


/* =========================================
   START APPLICATION
========================================= */

(async function init() {

  try {

    render();

    setApiStatus(
      "CONNECTING..."
    );


    if (!sb) {

      setApiStatus(
        "API ERROR"
      );

      showToast(
        "Supabase initialize nahi hua"
      );

      return;

    }


    await loadReferenceData();

    await loadMatches();

    await startRealtime();


    setApiStatus(
      "API ACTIVE"
    );


    render();


  } catch (error) {

    console.error(
      "Application startup error:",
      error
    );

    setApiStatus(
      "API ERROR"
    );

    showToast(
      "Supabase connection error"
    );

    render();

  }

})();

</script>
