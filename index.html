<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>BAAZIGAR LIVE LINE — Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0d0f12;
  --panel:#181b20;
  --panel2:#20242a;
  --border:#30343b;
  --text:#f1f3ed;
  --muted:#aeb3a2;
  --lime:#b7ff00;
  --limeDark:#182304;
  --red:#ff8888;
}

html,body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100%;
}

body{overflow-x:hidden}

button,input,select{
  font:inherit;
}

button{cursor:pointer}

.header{
  height:68px;
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:rgba(13,15,18,.96);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.menu{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--panel);
  color:#fff;
  font-size:20px;
}

.logo{
  font-size:17px;
  font-weight:900;
  white-space:nowrap;
}

.logo span,.lime{color:var(--lime)}

.headerRight{
  display:flex;
  align-items:center;
  gap:8px;
}

.apiDot{
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 9px;
  border:1px solid #506d00;
  border-radius:8px;
  color:var(--lime);
  font-size:9px;
  font-weight:800;
}

.dot{
  width:7px;
  height:7px;
  background:var(--lime);
  border-radius:50%;
  box-shadow:0 0 9px var(--lime);
}

.avatar{
  width:37px;
  height:37px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--lime);
  color:#111;
  font-weight:900;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:150;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.overlay.show{
  opacity:1;
  pointer-events:auto;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:285px;
  z-index:200;
  background:#0a0c0e;
  border-right:1px solid var(--border);
  transform:translateX(-100%);
  transition:.25s;
  overflow-y:auto;
}

.sidebar.open{transform:translateX(0)}

.sideHead{
  padding:24px 20px 10px;
}

.sideLogo{
  font-size:25px;
  font-weight:900;
}

.sideLogo span{color:var(--lime)}

.sideSub{
  margin-top:10px;
  color:#8f9589;
  font-size:10px;
  letter-spacing:3px;
}

.newMatch{
  width:calc(100% - 40px);
  margin:20px;
  height:50px;
  border:0;
  border-radius:12px;
  background:var(--lime);
  color:#111600;
  font-weight:900;
}

.nav{padding:0 10px}

.navItem{
  height:49px;
  display:flex;
  align-items:center;
  gap:13px;
  padding:0 13px;
  margin:3px 0;
  border-radius:9px;
  color:#b4b8ad;
  font-size:14px;
}

.navItem:hover{
  color:var(--lime);
  background:#171b0d;
}

.navItem.active{
  color:var(--lime);
  background:#172107;
  border-left:3px solid var(--lime);
}

.navIcon{
  width:22px;
  text-align:center;
  font-size:17px;
}

.sideBottom{
  position:absolute;
  bottom:0;
  width:100%;
  padding:10px;
  border-top:1px solid var(--border);
  background:#0a0c0e;
}

.logout{color:#ff9d9d}

main{
  width:100%;
}

.container{
  width:100%;
  max-width:1180px;
  margin:auto;
  padding:22px 14px 80px;
}

.pageHead{
  margin-bottom:22px;
}

.pageTitle{
  font-size:34px;
  font-weight:900;
  letter-spacing:-1.4px;
}

.pageDesc{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
  margin-top:8px;
}

.updated{
  color:#aeb3a2;
  font-size:10px;
  margin-top:10px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.stat{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  min-height:115px;
}

.statLabel{
  color:#b9bdb2;
  font-size:10px;
  font-weight:800;
}

.statNum{
  margin-top:19px;
  font-size:32px;
  font-weight:900;
}

.section{
  margin-top:23px;
}

.sectionHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:13px;
}

.sectionTitle{
  font-size:18px;
  font-weight:900;
}

.btn{
  min-height:40px;
  padding:8px 12px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--panel);
  color:#fff;
  font-size:12px;
  font-weight:700;
}

.btn:hover{
  border-color:var(--lime);
  color:var(--lime);
}

.btnPrimary{
  background:var(--lime);
  color:#111600;
  border-color:var(--lime);
}

.btnDanger{
  color:#ffaaaa;
}

.btnFull{
  width:100%;
}

.matchList{
  display:grid;
  gap:11px;
}

.matchCard{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  padding:14px;
}

.matchTop{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.matchName{
  font-size:16px;
  font-weight:900;
}

.matchMeta{
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}

.badge{
  height:max-content;
  padding:5px 8px;
  border-radius:30px;
  font-size:9px;
  font-weight:900;
}

.live{
  color:var(--lime);
  background:var(--limeDark);
  border:1px solid #506d00;
}

.upcoming{
  color:#ddd;
  background:#24282e;
}

.ended{
  color:#999;
  background:#191b1e;
}

.score{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
  margin:18px 0;
  text-align:center;
}

.team{
  font-size:14px;
  font-weight:800;
  overflow-wrap:anywhere;
}

.scoreNum{
  font-size:24px;
  font-weight:900;
  white-space:nowrap;
}

.vs{
  color:#777;
  font-size:9px;
  padding:0 6px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.empty{
  text-align:center;
  padding:35px 15px;
  background:var(--panel);
  border:1px dashed var(--border);
  border-radius:13px;
}

.emptyIcon{
  font-size:30px;
  margin-bottom:8px;
}

.empty h3{font-size:16px}

.empty p{
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
}

.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:13px;
}

.card{
  background:#15181c;
  border:1px solid var(--border);
  border-radius:13px;
  padding:16px;
}

.card h3{
  font-size:16px;
  margin-bottom:8px;
}

.card p{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

.cardHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding-bottom:12px;
  margin-bottom:14px;
  border-bottom:1px solid var(--border);
}

.cardTitle{
  font-size:17px;
  font-weight:900;
}

.status{
  padding:5px 8px;
  border-radius:30px;
  color:var(--lime);
  background:var(--limeDark);
  border:1px solid #506d00;
  font-size:9px;
  font-weight:900;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  color:#bfc4b6;
  font-size:10px;
  font-weight:800;
  margin-bottom:6px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.input,.select{
  width:100%;
  height:43px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#0b0e12;
  color:#fff;
  padding:0 11px;
  outline:none;
  font-size:13px;
}

.input:focus,.select:focus{
  border-color:var(--lime);
}

.keyWrap{
  position:relative;
}

.keyWrap .input{
  padding-right:45px;
}

.eye{
  position:absolute;
  right:6px;
  top:4px;
  height:35px;
  width:35px;
  border:0;
  background:transparent;
  color:#999;
}

.apiActions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.rangeRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}

.rangeValue{
  color:var(--lime);
  font-weight:900;
}

.range{
  width:100%;
  accent-color:var(--lime);
}

.switchRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:9px;
}

.switch{
  width:44px;
  height:24px;
  position:relative;
}

.switch input{display:none}

.slider{
  position:absolute;
  inset:0;
  background:#333840;
  border-radius:30px;
}

.slider:before{
  content:"";
  position:absolute;
  width:18px;
  height:18px;
  left:3px;
  top:3px;
  background:#fff;
  border-radius:50%;
  transition:.2s;
}

.switch input:checked + .slider{
  background:var(--lime);
}

.switch input:checked + .slider:before{
  transform:translateX(20px);
}

.providerGrid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

.provider{
  padding:13px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel);
}

.provider.active{
  border-color:#506d00;
}

.providerTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.providerName{
  font-weight:900;
  font-size:14px;
}

.providerStatus{
  color:var(--lime);
  font-size:9px;
  margin-top:4px;
}

.radio{
  accent-color:var(--lime);
}

.corsList{
  display:grid;
  gap:7px;
  margin-bottom:10px;
}

.corsItem{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:9px;
  background:#0b0e12;
  border:1px solid var(--border);
  border-radius:7px;
}

.corsText{
  font-family:monospace;
  font-size:10px;
  overflow-wrap:anywhere;
}

.remove{
  border:0;
  background:transparent;
  color:var(--red);
  font-size:16px;
}

.inline{
  display:flex;
  gap:7px;
}

.inline .input{flex:1}

.note{
  margin-top:9px;
  color:#888f82;
  font-size:10px;
  line-height:1.5;
}

.modalBack{
  position:fixed;
  inset:0;
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(0,0,0,.75);
}

.modalBack.show{display:flex}

.modal{
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  padding:17px;
  background:#15181c;
  border:1px solid var(--border);
  border-radius:14px;
}

.modalHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:17px;
}

.modalTitle{
  font-size:19px;
  font-weight:900;
}

.close{
  width:34px;
  height:34px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--panel);
  color:#fff;
  font-size:20px;
}

.formActions{
  display:flex;
  gap:8px;
}

.formActions .btn{flex:1}

.toast{
  position:fixed;
  z-index:500;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  background:#eef2e8;
  color:#111;
  padding:11px 15px;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
  transition:.2s;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.bottomNav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:120;
  height:62px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:rgba(25,29,34,.97);
  border-top:1px solid var(--border);
  backdrop-filter:blur(10px);
}

.bottomItem{
  border:0;
  background:transparent;
  color:#8f9589;
  font-size:9px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}

.bottomItem b{
  font-size:17px;
}

.bottomItem.active{
  color:var(--lime);
}

@media(min-width:701px){

  .header{
    padding:0 25px;
  }

  .container{
    padding:30px 28px 60px;
  }

  .pageHead{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
  }

  .stats{
    grid-template-columns:repeat(4,1fr);
    gap:14px;
  }

  .grid.two{
    grid-template-columns:repeat(2,1fr);
  }

  .providerGrid{
    grid-template-columns:repeat(3,1fr);
  }

  .bottomNav{display:none}
}

@media(min-width:1000px){

  .menu{
    display:none;
  }

  .sidebar{
    transform:translateX(0);
  }

  main{
    margin-left:285px;
  }

  .header{
    margin-left:285px;
  }

  .grid.apiGrid{
    grid-template-columns:2fr 1fr;
  }
}

@media(max-width:380px){

  .apiDot{display:none}

  .logo{font-size:15px}

  .container{
    padding-left:11px;
    padding-right:11px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="brand">
    <button class="menu" id="menuBtn">☰</button>

    <div class="logo">
      BAAZIGAR <span>LIVE LINE</span>
    </div>
  </div>

  <div class="headerRight">
    <div class="apiDot">
      <span class="dot"></span>
      API ACTIVE
    </div>
    <div class="avatar">A</div>
  </div>

</header>

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">

  <div class="sideHead">
    <div class="sideLogo">
      BAAZIGAR <span>LIVE LINE</span>
    </div>

    <div class="sideSub">
      ADMIN CONTROL PANEL
    </div>
  </div>

  <button class="newMatch" id="sideNewMatch">
    ＋ New Match
  </button>

  <nav class="nav">

    <div class="navItem active" data-page="dashboard">
      <span class="navIcon">▦</span>
      Dashboard
    </div>

    <div class="navItem" data-page="matches">
      <span class="navIcon">⚔</span>
      Match Management
    </div>

    <div class="navItem" data-page="series">
      <span class="navIcon">▣</span>
      Series
    </div>

    <div class="navItem" data-page="teams">
      <span class="navIcon">♟</span>
      Teams
    </div>

    <div class="navItem" data-page="players">
      <span class="navIcon">♙</span>
      Players
    </div>

    <div class="navItem" data-page="commentary">
      <span class="navIcon">🎙</span>
      Live Commentary
    </div>

    <div class="navItem" data-page="api">
      <span class="navIcon">◆</span>
      API Settings
    </div>

    <div class="navItem" data-page="users">
      <span class="navIcon">♙</span>
      User Management
    </div>

    <div class="navItem" data-page="settings">
      <span class="navIcon">⚙</span>
      Settings
    </div>

  </nav>

  <div class="sideBottom">
    <div class="navItem logout" id="logoutBtn">
      <span class="navIcon">↪</span>
      Logout
    </div>
  </div>

</aside>

<main>
  <div class="container" id="app"></div>
</main>

<nav class="bottomNav">

  <button class="bottomItem active" data-page="dashboard">
    <b>▦</b>
    Dashboard
  </button>

  <button class="bottomItem" data-page="matches">
    <b>⚔</b>
    Matches
  </button>

  <button class="bottomItem" data-page="commentary">
    <b>🎙</b>
    Live
  </button>

  <button class="bottomItem" data-page="api">
    <b>◆</b>
    API
  </button>

</nav>

<!-- MATCH MODAL -->

<div class="modalBack" id="matchModal">

  <div class="modal">

    <div class="modalHead">
      <div class="modalTitle">Create New Match</div>

      <button class="close" id="closeModal">×</button>
    </div>

    <form id="matchForm">

      <div class="field">
        <label>Match Name</label>
        <input class="input" id="matchName" required
               placeholder="India vs Australia">
      </div>

      <div class="field">
        <label>Team 1</label>
        <input class="input" id="team1" required
               placeholder="India">
      </div>

      <div class="field">
        <label>Team 2</label>
        <input class="input" id="team2" required
               placeholder="Australia">
      </div>

      <div class="field">
        <label>Series</label>
        <input class="input" id="matchSeries"
               placeholder="ODI Series">
      </div>

      <div class="field">
        <label>Match Date</label>
        <input class="input" type="datetime-local"
               id="matchDate" required>
      </div>

      <div class="field">
        <label>Status</label>
        <select class="select" id="matchStatus">
          <option value="upcoming">Upcoming</option>
          <option value="live">Live</option>
        </select>
      </div>

      <div class="formActions">

        <button type="button" class="btn" id="cancelModal">
          Cancel
        </button>

        <button type="submit" class="btn btnPrimary">
          Create Match
        </button>

      </div>

    </form>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>

/* =========================================================
   STORAGE
========================================================= */

let matches = JSON.parse(
  localStorage.getItem("baazigar_matches") || "[]"
);

let apiSettings = JSON.parse(
  localStorage.getItem("baazigar_api") || "null"
) || {
  supabaseUrl:"",
  anonKey:"",
  polling:10,
  realtime:true,
  provider:"CricketData",
  providerKeys:{
    CricketData:"",
    Sportradar:""
  },
  cors:[
    "https://admin.baazigarlive.com",
    "https://api.baazigarlive.com"
  ],
  sessionTimeout:"30 Minutes"
};

let currentPage = "dashboard";

const app = document.getElementById("app");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const modal = document.getElementById("matchModal");
const matchForm = document.getElementById("matchForm");


/* =========================================================
   HELPERS
========================================================= */

function saveMatches(){
  localStorage.setItem(
    "baazigar_matches",
    JSON.stringify(matches)
  );
}

function saveApi(){
  localStorage.setItem(
    "baazigar_api",
    JSON.stringify(apiSettings)
  );
}

let toastTimer;

function toast(message){

  const el = document.getElementById("toast");

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(()=>{
    el.classList.remove("show");
  },2200);
}

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function formatDate(value){

  if(!value) return "Date not set";

  const d = new Date(value);

  if(isNaN(d.getTime())) return value;

  return d.toLocaleString([],{
    day:"2-digit",
    month:"short",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}


/* =========================================================
   MENU
========================================================= */

function openMenu(){
  sidebar.classList.add("open");
  overlay.classList.add("show");
}

function closeMenu(){
  sidebar.classList.remove("open");
  overlay.classList.remove("show");
}

document.getElementById("menuBtn")
  .addEventListener("click",openMenu);

overlay.addEventListener("click",closeMenu);


/* =========================================================
   MODAL
========================================================= */

function openMatchModal(){
  modal.classList.add("show");
  setTimeout(()=>{
    document.getElementById("matchName").focus();
  },100);
}

function closeMatchModal(){
  modal.classList.remove("show");
  matchForm.reset();
}

document.getElementById("sideNewMatch")
  .addEventListener("click",()=>{
    closeMenu();
    openMatchModal();
  });

document.getElementById("closeModal")
  .addEventListener("click",closeMatchModal);

document.getElementById("cancelModal")
  .addEventListener("click",closeMatchModal);

modal.addEventListener("click",e=>{
  if(e.target===modal) closeMatchModal();
});


/* =========================================================

/* =========================================================

========================================================= */

function matchCard(m){

  const badge =
    m.status==="live"
      ? "live"
      : m.status==="ended"
      ? "ended"
      : "upcoming";

  const statusText =
    m.status==="live"
      ? "LIVE"
      : m.status==="ended"
      ? "ENDED"
      : "UPCOMING";

  return `

    <div class="matchCard">

      <div class="matchTop">

        <div>

          <div class="matchName">
            ${escapeHTML(m.name)}
          </div>

          <div class="matchMeta">
            ${escapeHTML(m.series)}
            ·
            ${formatDate(m.date)}
          </div>

        </div>

        <span class="badge ${badge}">
          ${statusText}
        </span>

      </div>

      <div class="score">

        <div class="team">
          ${escapeHTML(m.team1)}
        </div>

        <div class="scoreNum">
          ${Number(m.score1)||0}
          <span class="vs">VS</span>
          ${Number(m.score2)||0}
        </div>

        <div class="team">
          ${escapeHTML(m.team2)}
        </div>

      </div>

      <div class="actions">

        ${
          m.status!=="ended"
          ? `
          <button class="btn"
            onclick="changeStatus(${m.id})">
            ${m.status==="live" ? "End Match" : "Start Live"}
          </button>
          `
          : ""
        }

        ${
          m.status==="live"
          ? `
          <button class="btn"
            onclick="addScore(${m.id},1)">
            + ${escapeHTML(m.team1)}
          </button>

          <button class="btn"
            onclick="addScore(${m.id},2)">
            + ${escapeHTML(m.team2)}
          </button>
          `
          : ""
        }

        <button class="btn btnDanger"
          onclick="deleteMatch(${m.id})">
          Delete
        </button>

      </div>

    </div>
  `;
}


function renderMatchList(limit){

  let list = limit
    ? matches.slice(0,limit)
    : matches;

  if(!list.length){

    return `
      <div class="empty">
        <div class="emptyIcon">⚔</div>
        <h3>No matches yet</h3>
        <p>Create your first match using New Match.</p>
      </div>
    `;
  }

  return `
    <div class="matchList">
      ${list.map(matchCard).join("")}
    </div>
  `;
}


/* =========================================================
   MATCH ACTIONS
========================================================= */

function changeStatus(id){

  const m = matches.find(x=>x.id===id);

  if(!m) return;

  if(m.status==="upcoming"){
    m.status="live";
    toast("Match is now LIVE");
  }
  else if(m.status==="live"){
    m.status="ended";
    toast("Match ended");
  }

  saveMatches();
  render();
}

function addScore(id,team){

  const m = matches.find(x=>x.id===id);

  if(!m || m.status!=="live") return;

  if(team===1) m.score1++;
  else m.score2++;

  saveMatches();
  render();
}

function deleteMatch(id){

  if(!confirm("Delete this match?")) return;

  matches=matches.filter(x=>x.id!==id);

  saveMatches();
  render();

  toast("Match deleted");
}

/* =========================================================
   API FUNCTIONS
========================================================= */

function toggleKey(id,button){

  const input=document.getElementById(id);

  if(!input) return;

  if(input.type==="password"){
    input.type="text";
    button.textContent="🙈";
  }else{
    input.type="password";
    button.textContent="👁";
  }
}

function saveSupabase(){

  const url=document.getElementById("supabaseUrl")
    .value.trim();

  const key=document.getElementById("anonKey")
    .value.trim();

  if(url && !/^https:\/\/.+\.supabase\.co/i.test(url)){
    toast("Enter a valid Supabase Project URL");
    return;
  }

  apiSettings.supabaseUrl=url;
  apiSettings.anonKey=key;

  saveApi();

  const status=document.getElementById("supabaseStatus");

  if(status){
    status.textContent=url ? "CONFIGURED" : "NOT SET";
  }

  toast("Supabase settings saved");
}

async function testSupabase(){

  const url=document.getElementById("supabaseUrl")
    ?.value.trim();

  const key=document.getElementById("anonKey")
    ?.value.trim();

  if(!url || !key){
    toast("Enter Project URL and Anon Key first");
    return;
  }

  if(!/^https:\/\/.+\.supabase\.co/i.test(url)){
    toast("Invalid Supabase Project URL");
    return;
  }

  toast("Testing Supabase connection...");

  try{

    const response=await fetch(
      url.replace(/\/$/,"") + "/rest/v1/",
      {
        method:"GET",
        headers:{
          "apikey":key,
          "Authorization":"Bearer "+key
        }
      }
    );

    if(response.ok){

      toast("✓ Supabase connection successful");

      apiSettings.supabaseUrl=url;
      apiSettings.anonKey=key;
      saveApi();

    }else{

      toast(
        "Connection failed · HTTP "+response.status
      );

    }

  }catch(error){

    toast(
      "Connection failed · check URL, key or CORS"
    );

  }
}

function updatePolling(value){

  apiSettings.polling=Number(value);

  const el=document.getElementById("pollValue");

  if(el) el.textContent=value+"s";

  saveApi();
}

function saveRealtime(value){

  apiSettings.realtime=value;

  saveApi();

  toast(
    value
      ? "Realtime Sync enabled"
      : "Realtime Sync disabled"
  );
}

function selectProvider(value){

  apiSettings.provider=value;

  saveApi();

  render();

  toast(value+" selected");
}

function saveProviders(){

  const cricket=document.getElementById("cricketKey");
  const sport=document.getElementById("sportKey");

  if(cricket){
    apiSettings.providerKeys.CricketData=
      cricket.value.trim();
  }

  if(sport){
    apiSettings.providerKeys.Sportradar=
      sport.value.trim();
  }

  saveApi();

  toast("Provider settings saved");
}

function renderCors(){

  if(!apiSettings.cors.length){

    return `
      <div class="note">
        No CORS origins added.
      </div>
    `;
  }

  return apiSettings.cors.map((origin,index)=>`

    <div class="corsItem">

      <span class="corsText">
        ${escapeHTML(origin)}
      </span>

      <button
        class="remove"
        onclick="removeCors(${index})">
        ×
      </button>

    </div>

  `).join("");
}

function addCors(){

  const input=document.getElementById("newCors");

  if(!input) return;

  const origin=input.value.trim();

  if(!origin){
    toast("Enter an origin first");
    return;
  }

  try{
    new URL(origin);
  }catch{
    toast("Enter a valid URL");
    return;
  }

  if(apiSettings.cors.includes(origin)){
    toast("Origin already exists");
    return;
  }

  apiSettings.cors.push(origin);

  saveApi();
  render();

  toast("CORS origin added");
}

function removeCors(index){

  apiSettings.cors.splice(index,1);

  saveApi();
  render();

  toast("CORS origin removed");
}

function saveSessionTimeout(value){

  apiSettings.sessionTimeout=value;

  saveApi();

  toast("Session timeout saved");
}

function rotateKeys(){

  if(!confirm(
    "Key rotation should be performed by your secure backend. Continue with demo action?"
  )) return;

  toast(
    "Backend key rotation is required for production"
  );
}
