<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>BAAZIGAR LIVE — Admin Dashboard</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f12;
  --panel:#181b20;
  --panel2:#20242a;
  --border:#30343b;
  --text:#f1f3ed;
  --muted:#aeb3a2;
  --lime:#b7ff00;
  --red:#ff7777;
}
html,body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
body{min-height:100vh;overflow-x:hidden}
button,input,select{font:inherit}

.header{
  height:68px;
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:rgba(13,15,18,.97);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px}
.menu{
  width:38px;height:38px;border-radius:9px;
  border:1px solid var(--border);
  background:var(--panel);color:white;
  font-size:20px;cursor:pointer
}
.logo{font-size:17px;font-weight:900;white-space:nowrap}
.logo span{color:var(--lime)}
.status{
  display:flex;align-items:center;gap:6px;
  color:var(--lime);font-size:9px;font-weight:bold;
  border:1px solid #4c6900;border-radius:8px;padding:7px 9px
}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--lime);box-shadow:0 0 8px var(--lime)
}
.avatar{
  width:37px;height:37px;border-radius:50%;
  background:var(--lime);color:#111;
  display:flex;align-items:center;justify-content:center;
  font-weight:900
}
.head-right{display:flex;align-items:center;gap:8px}

.overlay{
  position:fixed;inset:0;background:#000a;
  z-index:150;display:none
}
.overlay.show{display:block}

.sidebar{
  position:fixed;left:0;top:0;bottom:0;
  width:285px;background:#090b0d;
  border-right:1px solid var(--border);
  z-index:200;
  transform:translateX(-100%);
  transition:.22s;
  overflow:auto;
  padding:22px 10px
}
.sidebar.open{transform:translateX(0)}
.side-logo{
  padding:0 10px 22px;
  font-size:25px;font-weight:900
}
.side-logo span{color:var(--lime)}
.sub{
  color:#858b7e;font-size:10px;
  letter-spacing:3px;margin-top:8px
}
.new{
  width:100%;height:48px;border:0;
  border-radius:10px;background:var(--lime);
  color:#101400;font-weight:900;
  margin-bottom:15px;cursor:pointer
}
.nav-item{
  height:46px;border-radius:9px;
  display:flex;align-items:center;gap:12px;
  padding:0 13px;color:#adb2a5;
  cursor:pointer;font-size:14px;margin:3px 0
}
.nav-item.active{
  color:var(--lime);
  background:#182204;
  border-left:3px solid var(--lime)
}
.nav-item:hover{color:var(--lime);background:#161c0b}
.bottom{
  margin-top:25px;padding-top:10px;
  border-top:1px solid var(--border)
}

main{width:100%}
.container{
  width:100%;max-width:1180px;
  margin:auto;padding:22px 14px 70px
}
.page-head{
  display:flex;justify-content:space-between;
  align-items:flex-end;gap:15px;margin-bottom:22px
}
.title{
  font-size:34px;line-height:1;
  font-weight:900;letter-spacing:-1px
}
.desc{
  color:var(--muted);font-size:14px;
  margin-top:9px;line-height:1.5
}
.updated{font-size:11px;color:#bfc4b5;text-align:right}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px
}
.stat{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  min-height:112px;padding:14px
}
.stat-top{
  display:flex;justify-content:space-between;
  color:#b8bdaf;font-size:10px;font-weight:800
}
.stat-icon{color:var(--lime);font-size:16px}
.num{
  font-size:31px;font-weight:900;
  margin-top:20px
}

.section{margin-top:22px}
.section-head{
  display:flex;justify-content:space-between;
  align-items:center;gap:10px;margin-bottom:12px
}
.section-title{font-size:17px;font-weight:900}

.btn{
  border:1px solid var(--border);
  background:var(--panel);
  color:white;border-radius:8px;
  padding:9px 11px;
  cursor:pointer;font-size:12px;font-weight:700
}
.btn:hover{border-color:var(--lime);color:var(--lime)}
.primary{
  background:var(--lime);
  color:#101400;border-color:var(--lime)
}
.danger{color:#ff9999}

.match-list{display:grid;gap:10px}
.match{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;padding:14px
}
.match-top{
  display:flex;justify-content:space-between;
  gap:10px;align-items:flex-start
}
.match-name{font-size:16px;font-weight:900}
.meta{color:var(--muted);font-size:11px;margin-top:5px}
.badge{
  padding:5px 8px;border-radius:30px;
  font-size:9px;font-weight:900;white-space:nowrap
}
.live{color:var(--lime);background:#192400;border:1px solid #4b6800}
.upcoming{color:#ddd;background:#25282d}
.ended{color:#999;background:#1b1d20}

.score{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  text-align:center;
  margin:18px 0
}
.team{font-size:14px;font-weight:800}
.score-num{font-size:23px;font-weight:900}
.vs{font-size:10px;color:#777;padding:0 8px}
.actions{display:flex;flex-wrap:wrap;gap:7px}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;padding:16px
}
.card h3{font-size:15px;margin-bottom:7px}
.card p{font-size:12px;color:var(--muted);line-height:1.5}

.empty{
  text-align:center;padding:35px 15px;
  border:1px dashed var(--border);
  border-radius:12px;background:var(--panel)
}
.empty-icon{font-size:30px;margin-bottom:8px}
.empty h3{font-size:16px}
.empty p{font-size:12px;color:var(--muted);margin-top:5px}

.modal-bg{
  position:fixed;inset:0;z-index:300;
  background:#000b;display:none;
  align-items:center;justify-content:center;padding:14px
}
.modal-bg.show{display:flex}
.modal{
  width:100%;max-width:500px;
  max-height:90vh;overflow:auto;
  background:#15181c;
  border:1px solid var(--border);
  border-radius:14px;padding:17px
}
.modal-head{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:18px
}
.modal-title{font-size:20px;font-weight:900}
.close{
  width:34px;height:34px;
  background:var(--panel);color:white;
  border:1px solid var(--border);
  border-radius:8px;cursor:pointer;font-size:20px
}
.form{display:grid;gap:12px}
.field{display:grid;gap:6px}
.field label{
  font-size:11px;color:#bfc4b6;font-weight:700
}
.field input,.field select{
  width:100%;height:44px;
  background:#0e1013;color:white;
  border:1px solid var(--border);
  border-radius:8px;padding:0 11px;
  outline:none;font-size:13px
}
.field input:focus,.field select:focus{
  border-color:var(--lime)
}
.form-actions{display:flex;gap:8px;margin-top:4px}
.form-actions .btn{flex:1;height:44px}

.toast{
  position:fixed;z-index:500;
  left:50%;bottom:22px;
  transform:translate(-50%,20px);
  opacity:0;pointer-events:none;
  background:#eef2e8;color:#111;
  padding:11px 15px;border-radius:9px;
  font-size:12px;font-weight:700;
  transition:.2s
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(min-width:900px){
  .container{padding:30px 28px 60px}
  .title{font-size:45px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .stat{min-height:135px;padding:18px}
  .num{font-size:38px}
  .sidebar{transform:none}
  .overlay{display:none!important}
  main{margin-left:285px}
  .menu{display:none}
  .header{padding-left:305px}
}
@media(max-width:380px){
  .status{display:none}
  .logo{font-size:15px}
}
</style>
</head>

<body>

<header class="header">
  <div class="brand">
    <button class="menu" id="menuBtn">☰</button>
    <div class="logo">BAAZIGAR <span>LIVE LINE</span></div>
  </div>

  <div class="head-right">
    <div class="status"><span class="dot"></span>API ACTIVE</div>
    <div class="avatar">A</div>
  </div>
</header>

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="side-logo">
    BAAZIGAR <span>LIVE LINE</span>
    <div class="sub">ADMIN CONTROL PANEL</div>
  </div>

  <button class="new" id="newMatch">＋ NEW MATCH</button>

  <div class="nav">
    <div class="nav-item active" data-page="dashboard">▦ Dashboard</div>
    <div class="nav-item" data-page="matches">⚔ Match Management</div>
    <div class="nav-item" data-page="series">▣ Series</div>
    <div class="nav-item" data-page="teams">♟ Teams</div>
    <div class="nav-item" data-page="players">♙ Players</div>
    <div class="nav-item" data-page="api">◆ API Settings</div>
    <div class="nav-item" data-page="users">♙ Users</div>
    <div class="nav-item" data-page="settings">⚙ Settings</div>
  </div>

  <div class="bottom">
    <div class="nav-item" id="logout">↪ Logout</div>
  </div>
</aside>

<main>
  <div class="container" id="app"></div>
</main>

<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">Create New Match</div>
      <button class="close" id="close">×</button>
    </div>

    <form class="form" id="form">

      <div class="field">
        <label>Match Name</label>
        <input id="name" required placeholder="India vs Australia">
      </div>

      <div class="field">
        <label>Team 1</label>
        <input id="team1" required placeholder="India">
      </div>

      <div class="field">
        <label>Team 2</label>
        <input id="team2" required placeholder="Australia">
      </div>

      <div class="field">
        <label>Series</label>
        <input id="series" placeholder="ODI Series">
      </div>

      <div class="field">
        <label>Date & Time</label>
        <input id="date" type="datetime-local" required>
      </div>

      <div class="field">
        <label>Status</label>
        <select id="status">
          <option value="upcoming">Upcoming</option>
          <option value="live">Live</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="button" class="btn" id="cancel">Cancel</button>
        <button class="btn primary" type="submit">Create Match</button>
      </div>

    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
"https://lzvwictzhtfbdbgvekuq.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6dndpY3R6aHRmYmRiZ3Zla3VxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNTkyNTcsImV4cCI6MjEwMzczNTI1N30.k1yRlaI6AzB9zZ_QUEQeOEHyYv0BMTI0-038cvfkGtw";


/* =========================================
   LOCAL DATABASE
   Works immediately in GitHub Pages.
========================================= */

let matches = JSON.parse(
  localStorage.getItem("baazigar_matches") || "[]"
);

let currentPage = "dashboard";


/* =========================================
   ELEMENTS
========================================= */

const app = document.getElementById("app");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const modal = document.getElementById("modal");
const form = document.getElementById("form");


/* =========================================
   STORAGE
========================================= */

function save(){
  localStorage.setItem(
    "baazigar_matches",
    JSON.stringify(matches)
  );
}


/* =========================================
   MENU
========================================= */

document.getElementById("menuBtn").onclick = ()=>{
  sidebar.classList.add("open");
  overlay.classList.add("show");
};

overlay.onclick = ()=>{
  sidebar.classList.remove("open");
  overlay.classList.remove("show");
};


/* =========================================
   MODAL
========================================= */

function openModal(){
  modal.classList.add("show");
}

function closeModal(){
  modal.classList.remove("show");
  form.reset();
}

document.getElementById("newMatch").onclick = ()=>{
  sidebar.classList.remove("open");
  overlay.classList.remove("show");
  openModal();
};

document.getElementById("close").onclick = closeModal;
document.getElementById("cancel").onclick = closeModal;

modal.onclick = e=>{
  if(e.target === modal) closeModal();
};


/* =========================================
   TOAST
========================================= */

let toastTimer;

function showToast(text){
  const t = document.getElementById("toast");

  t.textContent = text;
  t.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(()=>{
    t.classList.remove("show");
  },2200);
}


/* =========================================
   CREATE MATCH
========================================= */

form.onsubmit = e=>{
  e.preventDefault();

  const match = {
    id:Date.now(),
    name:document.getElementById("name").value.trim(),
    team1:document.getElementById("team1").value.trim(),
    team2:document.getElementById("team2").value.trim(),
    series:document.getElementById("series").value.trim() || "General",
    date:document.getElementById("date").value,
    status:document.getElementById("status").value,
    score1:0,
    score2:0
  };

  matches.unshift(match);
  save();

  closeModal();

  currentPage = "matches";
  setActive("matches");
  render();

  showToast("Match created successfully");
};


/* =========================================
   HELPERS
========================================= */

function esc(v){
  return String(v)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function dateFormat(v){
  if(!v) return "Date not set";

  const d = new Date(v);

  if(isNaN(d.getTime())) return v;

  return d.toLocaleString([],{
    day:"2-digit",
    month:"short",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}


/* =========================================
   DASHBOARD
========================================= */

function dashboard(){

  const live =
    matches.filter(m=>m.status==="live").length;

  const upcoming =
    matches.filter(m=>m.status==="upcoming").length;

  const series =
    new Set(matches.map(m=>m.series)).size;

  return `
    <div class="page-head">
      <div>
        <div class="title">Overview</div>
        <div class="desc">
          BAAZIGAR LIVE LINE control center
        </div>
      </div>

      <div class="updated">
        LAST UPDATED<br>
        ${new Date().toLocaleTimeString()}
      </div>
    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-top">
          TOTAL MATCHES <span class="stat-icon">⚔</span>
        </div>
        <div class="num">${matches.length}</div>
      </div>

      <div class="stat">
        <div class="stat-top">
          LIVE MATCHES <span class="stat-icon">●</span>
        </div>
        <div class="num">${live}</div>
      </div>

      <div class="stat">
        <div class="stat-top">
          UPCOMING <span class="stat-icon">▣</span>
        </div>
        <div class="num">${upcoming}</div>
      </div>

      <div class="stat">
        <div class="stat-top">
          ACTIVE SERIES <span class="stat-icon">▤</span>
        </div>
        <div class="num">${series}</div>
      </div>

    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-title">Recent Matches</div>
        <button class="btn primary" onclick="openModal()">
          + New Match
        </button>
      </div>

      ${matchList(3)}
    </div>
  `;
}


/* =========================================
   MATCHES
========================================= */

function matchesPage(){

  return `
    <div class="page-head">
      <div>
        <div class="title">Matches</div>
        <div class="desc">
          Create, manage and update live matches.
        </div>
      </div>

      <button class="btn primary" onclick="openModal()">
        + New Match
      </button>
    </div>

    <div class="section">
      ${matchList()}
    </div>
  `;
}


/* =========================================
   MATCH LIST
========================================= */

function matchList(limit){

  let list = limit
    ? matches.slice(0,limit)
    : matches;

  if(!list.length){

    return `
      <div class="empty">
        <div class="empty-icon">⚔</div>
        <h3>No matches yet</h3>
        <p>Create your first match.</p>
      </div>
    `;
  }

  return `
    <div class="match-list">
      ${list.map(matchCard).join("")}
    </div>
  `;
}


/* =========================================
   MATCH CARD
========================================= */

function matchCard(m){

  const cls =
    m.status==="live"
      ? "live"
      : m.status==="ended"
      ? "ended"
      : "upcoming";

  const text =
    m.status==="live"
      ? "LIVE"
      : m.status==="ended"
      ? "ENDED"
      : "UPCOMING";

  return `
    <div class="match">

      <div class="match-top">
        <div>
          <div class="match-name">${esc(m.name)}</div>
          <div class="meta">
            ${esc(m.series)} · ${dateFormat(m.date)}
          </div>
        </div>

        <span class="badge ${cls}">
          ${text}
        </span>
      </div>

      <div class="score">
        <div class="team">${esc(m.team1)}</div>

        <div class="score-num">
          ${m.score1}
          <span class="vs">VS</span>
          ${m.score2}
        </div>

        <div class="team">${esc(m.team2)}</div>
      </div>

      <div class="actions">

        ${
          m.status !== "ended"
          ? `
            <button class="btn"
              onclick="changeStatus(${m.id})">
              ${m.status==="live"
                ? "End Match"
                : "Start Live"}
            </button>
          `
          : ""
        }

        ${
          m.status==="live"
          ? `
            <button class="btn"
              onclick="addScore(${m.id},1)">
              + ${esc(m.team1)}
            </button>

            <button class="btn"
              onclick="addScore(${m.id},2)">
              + ${esc(m.team2)}
            </button>
          `
          : ""
        }

        <button class="btn danger"
          onclick="deleteMatch(${m.id})">
          Delete
        </button>

      </div>
    </div>
  `;
}


/* =========================================
   STATUS
========================================= */

function changeStatus(id){

  const m = matches.find(x=>x.id===id);

  if(!m) return;

  if(m.status==="upcoming"){
    m.status="live";
    showToast("Match is LIVE");
  }
  else if(m.status==="live"){
    m.status="ended";
    showToast("Match ended");
  }

  save();
  render();
}


/* =========================================
   SCORE
========================================= */

function addScore(id,team){

  const m = matches.find(x=>x.id===id);

  if(!m || m.status!=="live") return;

  if(team===1) m.score1++;
  if(team===2) m.score2++;

  save();
  render();
}


/* =========================================
   DELETE
========================================= */

function deleteMatch(id){

  if(!confirm("Delete this match?")) return;

  matches = matches.filter(x=>x.id!==id);

  save();
  render();

  showToast("Match deleted");
}


/* =========================================
   SIMPLE PAGES
========================================= */

function simple(title,desc,html){

  return `
    <div class="page-head">
      <div>
        <div class="title">${title}</div>
        <div class="desc">${desc}</div>
      </div>
    </div>

    <div class="grid">${html}</div>
  `;
}

function seriesPage(){

  const list =
    [...new Set(matches.map(m=>m.series))];

  return simple(
    "Series",
    "Manage cricket series.",
    list.length
    ? list.map(s=>`
        <div class="card">
          <h3>${esc(s)}</h3>
          <p>
            ${matches.filter(m=>m.series===s).length}
            match(es)
          </p>
        </div>
      `).join("")
    : `
      <div class="card">
        <h3>No Series</h3>
        <p>Create a match to add a series.</p>
      </div>
    `
  );
}

function teamsPage(){

  const teams =
    [...new Set(
      matches.flatMap(m=>[m.team1,m.team2])
    )];

  return simple(
    "Teams",
    "Manage participating teams.",
    teams.length
    ? teams.map(t=>`
        <div class="card">
          <h3>${esc(t)}</h3>
          <p>Active team.</p>
        </div>
      `).join("")
    : `
      <div class="card">
        <h3>No Teams</h3>
        <p>Create a match to add teams.</p>
      </div>
    `
  );
}

function playersPage(){

  return simple(
    "Players",
    "Manage player information.",
    `
      <div class="card">
        <h3>Player Database</h3>
        <p>Player management module ready.</p>
      </div>

      <div class="card">
        <h3>Statistics</h3>
        <p>Runs, wickets and player statistics.</p>
      </div>
    `
  );
}

function apiPage(){

  return simple(
    "API Settings",
    "Configure data providers.",
    `
      <div class="card">
        <h3>Supabase</h3>
        <p>
          ${SUPABASE_URL}
        </p>
      </div>

      <div class="card">
        <h3>Connection</h3>
        <p id="apiConnection">
          Checking configuration...
        </p>
      </div>

      <div class="card">
        <h3>Polling</h3>

    `
  );
}

/* =========================================
   NAVIGATION
========================================= */

function setActive(page){

  document
    .querySelectorAll(".nav-item[data-page]")
    .forEach(x=>{
      x.classList.toggle(
        "active",
        x.dataset.page===page
      );
    });
}

document
.querySelectorAll(".nav-item[data-page]")
.forEach(item=>{

  item.onclick = ()=>{

    currentPage=item.dataset.page;

    setActive(currentPage);

    sidebar.classList.remove("open");
    overlay.classList.remove("show");

    render();
  };
});


/* =========================================
   LOGOUT
========================================= */

document.getElementById("logout").onclick = ()=>{

  if(confirm("Are you sure you want to logout?")){
    showToast("Logout system ready");
  }

};


/* =========================================
   ROUTER
========================================= */

function render(){

  if(currentPage==="dashboard")
    app.innerHTML=dashboard();

  else if(currentPage==="matches")
    app.innerHTML=matchesPage();

  else if(currentPage==="series")
    app.innerHTML=seriesPage();

  else if(currentPage==="teams")
    app.innerHTML=teamsPage();

  else if(currentPage==="players")
    app.innerHTML=playersPage();

  else if(currentPage==="api")
    app.innerHTML=apiPage();

  else if(currentPage==="users")
    app.innerHTML=usersPage();

  else if(currentPage==="settings")
    app.innerHTML=settingsPage();
}


/* =========================================
   START
========================================= */

render();
</script>
