<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

<title>BAAZIGAR LIVE LINE — Admin Dashboard</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#0d0f12;
  --panel:#181b20;
  --panel2:#20242a;
  --border:#30343b;
  --text:#f1f3ed;
  --muted:#aeb3a2;
  --lime:#b7ff00;
  --lime-dark:#1b2707;
  --danger:#ff8e8e;
  --max:1180px;
}

html{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:var(--bg);
  overflow-x:hidden;
}

/* =========================
   HEADER
========================= */

.header{
  height:76px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(13,15,18,.96);
  backdrop-filter:blur(12px);
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
  min-width:0;
}

.menu-btn{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  background:var(--panel);
  color:white;
  border-radius:10px;
  font-size:22px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:-.7px;
  white-space:nowrap;
}

.logo span{
  color:var(--lime);
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.api-status{
  border:1px solid #547700;
  color:var(--lime);
  border-radius:9px;
  padding:8px 12px;
  font-size:11px;
  font-weight:700;
  line-height:1.25;
  display:flex;
  align-items:center;
  gap:7px;
}

.api-dot{
  width:8px;
  height:8px;
  background:var(--lime);
  border-radius:50%;
  box-shadow:0 0 10px var(--lime);
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--lime);
  color:#111;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

/* =========================
   SIDEBAR
========================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  z-index:150;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.overlay.show{
  opacity:1;
  pointer-events:auto;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:285px;
  background:#0a0c0e;
  border-right:1px solid var(--border);
  z-index:200;
  transform:translateX(-100%);
  transition:.25s ease;
  display:flex;
  flex-direction:column;
  overflow-y:auto;
}

.sidebar.open{
  transform:translateX(0);
}

.sidebar-head{
  padding:25px 20px 15px;
}

.sidebar-logo{
  font-size:27px;
  font-weight:900;
  line-height:1.05;
}

.sidebar-logo span{
  color:var(--lime);
}

.sidebar-sub{
  color:#999f92;
  font-size:11px;
  letter-spacing:4px;
  margin-top:14px;
}

.new-match-side{
  margin:20px;
  width:calc(100% - 40px);
  height:54px;
  border:0;
  border-radius:13px;
  background:var(--lime);
  color:#101400;
  font-weight:900;
  font-size:17px;
  cursor:pointer;
}

.nav{
  padding:0 10px;
}

.nav-item{
  height:52px;
  display:flex;
  align-items:center;
  gap:15px;
  padding:0 14px;
  border-radius:9px;
  color:#b5b9ad;
  cursor:pointer;
  font-size:15px;
  margin:3px 0;
}

.nav-item:hover{
  background:#171b0d;
  color:var(--lime);
}

.nav-item.active{
  background:#172107;
  color:var(--lime);
  border-left:3px solid var(--lime);
}

.nav-icon{
  width:25px;
  text-align:center;
  font-size:19px;
}

.sidebar-bottom{
  margin-top:auto;
  padding:10px;
  border-top:1px solid var(--border);
}

.logout{
  color:#ff9c9c;
}

/* =========================
   MAIN
========================= */

main{
  width:100%;
}

.container{
  width:100%;
  max-width:var(--max);
  margin:auto;
  padding:28px 20px 60px;
}

.page-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:28px;
}

.page-title{
  font-size:clamp(30px,6vw,48px);
  line-height:1;
  font-weight:900;
  letter-spacing:-1.5px;
}

.page-desc{
  color:var(--muted);
  font-size:15px;
  margin-top:10px;
}

.updated{
  color:#bfc5b2;
  font-size:12px;
  text-align:right;
}

/* =========================
   DASHBOARD CARDS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.stat-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  padding:20px;
  min-height:145px;
}

.stat-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.stat-label{
  color:#bdc3b3;
  font-size:13px;
  font-weight:800;
}

.stat-icon{
  color:var(--lime);
  font-size:20px;
}

.stat-number{
  font-size:40px;
  font-weight:900;
  margin-top:27px;
}

/* =========================
   SECTION
========================= */

.section{
  margin-top:28px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:14px;
}

.section-title{
  font-size:20px;
  font-weight:900;
}

.btn{
  border:1px solid var(--border);
  background:var(--panel);
  color:white;
  border-radius:9px;
  padding:10px 15px;
  cursor:pointer;
  font-weight:700;
}

.btn:hover{
  border-color:var(--lime);
  color:var(--lime);
}

.btn-primary{
  background:var(--lime);
  color:#101400;
  border-color:var(--lime);
}

.btn-danger{
  color:#ffaaaa;
}

/* =========================
   MATCH CARDS
========================= */

.match-list{
  display:grid;
  gap:12px;
}

.match-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
}

.match-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
}

.match-name{
  font-size:18px;
  font-weight:900;
}

.match-meta{
  color:var(--muted);
  font-size:13px;
  margin-top:6px;
}

.badge{
  border-radius:50px;
  padding:5px 9px;
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
}

.badge-live{
  color:var(--lime);
  background:#182304;
  border:1px solid #506d00;
}

.badge-upcoming{
  color:#d7d9d1;
  background:#24282e;
}

.badge-ended{
  color:#999;
  background:#191b1e;
}

.match-score{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  text-align:center;
  margin:20px 0;
}

.team{
  font-size:17px;
  font-weight:800;
}

.score{
  font-size:28px;
  font-weight:900;
}

.vs{
  color:#777;
  font-size:12px;
  padding:0 12px;
}

.match-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

/* =========================
   TABLE / DATA
========================= */

.data-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.data-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
}

.data-card h3{
  font-size:16px;
  margin-bottom:8px;
}

.data-card p{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

/* =========================
   MODAL
========================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:300;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:520px;
  max-height:90vh;
  overflow:auto;
  background:#15181c;
  border:1px solid var(--border);
  border-radius:17px;
  padding:20px;
  box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-title{
  font-size:22px;
  font-weight:900;
}

.close{
  width:36px;
  height:36px;
  border:1px solid var(--border);
  background:var(--panel);
  color:white;
  border-radius:8px;
  cursor:pointer;
  font-size:20px;
}

.form{
  display:grid;
  gap:14px;
}

.field{
  display:grid;
  gap:7px;
}

.field label{
  font-size:12px;
  color:#bfc4b6;
  font-weight:700;
}

.field input,
.field select{
  width:100%;
  height:46px;
  padding:0 12px;
  border-radius:9px;
  border:1px solid var(--border);
  background:#0e1013;
  color:white;
  outline:none;
  font-size:14px;
}

.field input:focus,
.field select:focus{
  border-color:var(--lime);
}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:5px;
}

.form-actions .btn{
  flex:1;
  height:46px;
}

/* =========================
   EMPTY STATE
========================= */

.empty{
  text-align:center;
  padding:38px 20px;
  border:1px dashed var(--border);
  border-radius:14px;
  background:var(--panel);
}

.empty-icon{
  font-size:34px;
  margin-bottom:10px;
}

.empty h3{
  font-size:17px;
}

.empty p{
  color:var(--muted);
  font-size:13px;
  margin-top:6px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translate(-50%,20px);
  background:#eef2e8;
  color:#111;
  padding:12px 17px;
  border-radius:10px;
  font-size:13px;
  font-weight:700;
  z-index:500;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .header{
    height:68px;
    padding:0 12px;
  }

  .menu-btn{
    width:38px;
    height:38px;
    font-size:20px;
  }

  .logo{
    font-size:17px;
  }

  .api-status{
    padding:6px 8px;
    font-size:9px;
  }

  .api-dot{
    width:6px;
    height:6px;
  }

  .avatar{
    width:37px;
    height:37px;
    font-size:16px;
  }

  .container{
    padding:22px 14px 45px;
  }

  .page-head{
    display:block;
    margin-bottom:22px;
  }

  .page-title{
    font-size:34px;
  }

  .page-desc{
    font-size:14px;
    line-height:1.5;
  }

  .updated{
    margin-top:12px;
    text-align:left;
    font-size:11px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .stat-card{
    min-height:120px;
    padding:14px;
    border-radius:12px;
  }

  .stat-label{
    font-size:10px;
  }

  .stat-number{
    font-size:32px;
    margin-top:20px;
  }

  .stat-icon{
    font-size:16px;
  }

  .section{
    margin-top:22px;
  }

  .section-title{
    font-size:17px;
  }

  .btn{
    padding:9px 11px;
    font-size:12px;
  }

  .match-card{
    padding:14px;
  }

  .match-name{
    font-size:16px;
  }

  .team{
    font-size:14px;
  }

  .score{
    font-size:24px;
  }

  .data-grid{
    grid-template-columns:1fr;
  }

  .sidebar{
    width:min(300px,86vw);
  }

  .modal{
    padding:16px;
    border-radius:14px;
  }

  .modal-title{
    font-size:19px;
  }
}

@media(max-width:380px){

  .api-status{
    display:none;
  }

  .logo{
    font-size:16px;
  }

  .stats{
    gap:8px;
  }

  .stat-card{
    padding:12px;
  }
}

/* desktop sidebar */
@media(min-width:1000px){
  .sidebar{
    width:280px;
  }

  .container{
    padding-left:28px;
    padding-right:28px;
  }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

  <div class="brand">

    <button class="menu-btn" id="menuBtn" aria-label="Menu">
      ☰
    </button>

    <div class="logo">
      BAAZIGAR <span>LIVE LINE</span>
    </div>

  </div>

  <div class="header-right">

    <div class="api-status">
      <span class="api-dot"></span>
      API ACTIVE
    </div>

    <div class="avatar">A</div>

  </div>

</header>


<!-- ================= SIDEBAR ================= -->

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">

  <div class="sidebar-head">

    <div class="sidebar-logo">
      BAAZIGAR <span>LIVE LINE</span>
    </div>

    <div class="sidebar-sub">
      ADMIN CONTROL PANEL
    </div>

  </div>

  <button class="new-match-side" id="sideNewMatch">
    ＋ New Match
  </button>

  <nav class="nav">

    <div class="nav-item active" data-page="dashboard">
      <span class="nav-icon">▦</span>
      Dashboard
    </div>

    <div class="nav-item" data-page="matches">
      <span class="nav-icon">⚔</span>
      Match Management
    </div>

    <div class="nav-item" data-page="series">
      <span class="nav-icon">▣</span>
      Series
    </div>

    <div class="nav-item" data-page="teams">
      <span class="nav-icon">♟</span>
      Teams
    </div>

    <div class="nav-item" data-page="players">
      <span class="nav-icon">♙</span>
      Players
    </div>

    <div class="nav-item" data-page="api">
      <span class="nav-icon">◆</span>
      API Settings
    </div>

    <div class="nav-item" data-page="users">
      <span class="nav-icon">♙</span>
      User Management
    </div>

  </nav>

  <div class="sidebar-bottom">

    <div class="nav-item" data-page="settings">
      <span class="nav-icon">⚙</span>
      Settings
    </div>

    <div class="nav-item logout" id="logoutBtn">
      <span class="nav-icon">↪</span>
      Logout
    </div>

  </div>

</aside>


<!-- ================= MAIN ================= -->

<main>
<div class="container" id="app"></div>
</main>


<!-- ================= NEW MATCH MODAL ================= -->

<div class="modal-backdrop" id="matchModal">

  <div class="modal">

    <div class="modal-head">

      <div class="modal-title">
        Create New Match
      </div>

      <button class="close" id="closeModal">
        ×
      </button>

    </div>

    <form class="form" id="matchForm">

      <div class="field">
        <label>Match Name</label>
        <input
          id="matchName"
          required
          placeholder="e.g. India vs Australia">
      </div>

      <div class="field">
        <label>Team 1</label>
        <input
          id="team1"
          required
          placeholder="e.g. India">
      </div>

      <div class="field">
        <label>Team 2</label>
        <input
          id="team2"
          required
          placeholder="e.g. Australia">
      </div>

      <div class="field">
        <label>Series</label>
        <input
          id="matchSeries"
          placeholder="e.g. ODI Series">
      </div>

      <div class="field">
        <label>Match Date</label>
        <input
          type="datetime-local"
          id="matchDate"
          required>
      </div>

      <div class="field">
        <label>Status</label>
        <select id="matchStatus">
          <option value="upcoming">Upcoming</option>
          <option value="live">Live</option>
        </select>
      </div>

      <div class="form-actions">

        <button type="button"
                class="btn"
                id="cancelModal">
          Cancel
        </button>

        <button type="submit"
                class="btn btn-primary">
          Create Match
        </button>

      </div>

    </form>

  </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* =====================================================
   DATA
===================================================== */

let matches = JSON.parse(
  localStorage.getItem("baazigar_matches") || "[]"
);

let currentPage = "dashboard";


/* =====================================================
   ELEMENTS
===================================================== */

const app = document.getElementById("app");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const menuBtn = document.getElementById("menuBtn");

const modal = document.getElementById("matchModal");
const matchForm = document.getElementById("matchForm");


/* =====================================================
   MENU
===================================================== */

function openMenu(){

  sidebar.classList.add("open");
  overlay.classList.add("show");

}

function closeMenu(){

  sidebar.classList.remove("open");
  overlay.classList.remove("show");

}

menuBtn.addEventListener("click",openMenu);
overlay.addEventListener("click",closeMenu);


/* =====================================================
   STORAGE
===================================================== */

function saveMatches(){

  localStorage.setItem(
    "baazigar_matches",
    JSON.stringify(matches)
  );

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function toast(message){

  const el = document.getElementById("toast");

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(()=>{
    el.classList.remove("show");
  },2200);

}


/* =====================================================
   MODAL
===================================================== */

function openMatchModal(){

  modal.classList.add("show");

  document.getElementById("matchName").focus();

}

function closeMatchModal(){

  modal.classList.remove("show");
  matchForm.reset();

}

document
  .getElementById("sideNewMatch")
  .addEventListener("click",()=>{
    closeMenu();
    openMatchModal();
  });

document
  .getElementById("closeModal")
  .addEventListener("click",closeMatchModal);

document
  .getElementById("cancelModal")
  .addEventListener("click",closeMatchModal);

modal.addEventListener("click",(e)=>{

  if(e.target === modal){
    closeMatchModal();
  }

});


/* =====================================================
   CREATE MATCH
===================================================== */

matchForm.addEventListener("submit",(e)=>{

  e.preventDefault();

  const match = {

    id:Date.now(),

    name:document.getElementById("matchName").value.trim(),

    team1:document.getElementById("team1").value.trim(),

    team2:document.getElementById("team2").value.trim(),

    series:document.getElementById("matchSeries").value.trim() || "General",

    date:document.getElementById("matchDate").value,

    status:document.getElementById("matchStatus").value,

    score1:0,

    score2:0

  };

  matches.unshift(match);

  saveMatches();

  closeMatchModal();

  currentPage="matches";

  render();

  toast("Match created successfully");

});


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

  if(!value) return "Date not set";

  const d = new Date(value);

  if(isNaN(d.getTime())) return value;

  return d.toLocaleString([],{
    day:"2-digit",
    month:"short",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });

}


/* =====================================================
   DASHBOARD
===================================================== */

function dashboardPage(){

  const live =
    matches.filter(m=>m.status==="live").length;

  const upcoming =
    matches.filter(m=>m.status==="upcoming").length;

  const ended =
    matches.filter(m=>m.status==="ended").length;

  const series =
    new Set(matches.map(m=>m.series)).size;

  return `

    <div class="page-head">

      <div>
        <div class="page-title">
          Overview
        </div>

        <div class="page-desc">
          BAAZIGAR LIVE LINE control center
        </div>
      </div>

      <div class="updated">
        LAST UPDATED<br>
        ${new Date().toLocaleTimeString()}
      </div>

    </div>


    <div class="stats">

      <div class="stat-card">

        <div class="stat-top">
          <div class="stat-label">TOTAL USERS</div>
          <div class="stat-icon">♟</div>
        </div>

        <div class="stat-number">1</div>

      </div>


      <div class="stat-card">

        <div class="stat-top">
          <div class="stat-label">LIVE MATCHES</div>
          <div class="stat-icon">⚔</div>
        </div>

        <div class="stat-number">${live}</div>

      </div>


      <div class="stat-card">

        <div class="stat-top">
          <div class="stat-label">UPCOMING</div>
          <div class="stat-icon">▣</div>
        </div>

        <div class="stat-number">${upcoming}</div>

      </div>


      <div class="stat-card">

        <div class="stat-top">
          <div class="stat-label">ACTIVE SERIES</div>
          <div class="stat-icon">▤</div>
        </div>

        <div class="stat-number">${series}</div>

      </div>

    </div>


    <div class="section">

      <div class="section-head">

        <div class="section-title">
          Recent Matches
        </div>

        <button
          class="btn btn-primary"
          onclick="openMatchModal()">
          + New Match
        </button>

      </div>

      ${renderMatchList(3)}

    </div>

  `;

}


/* =====================================================
   MATCH MANAGEMENT
===================================================== */

        <div class="page-title">

/* =====================================================
   MATCH LIST
===================================================== */

function renderMatchList(limit){

  let list = matches;

  if(limit){
    list = matches.slice(0,limit);
  }

  if(!list.length){

    return `

      <div class="empty">

        <div class="empty-icon">⚔</div>

        <h3>No matches yet</h3>

        <p>
          Create your first match using the New Match button.
        </p>

      </div>

    `;

  }

  return `

    <div class="match-list">

      ${list.map(m=>matchCard(m)).join("")}

    </div>

  `;

}


/* =====================================================
   MATCH CARD
===================================================== */

function matchCard(m){

  const badgeClass =
    m.status==="live"
      ? "badge-live"
      : m.status==="ended"
      ? "badge-ended"
      : "badge-upcoming";

  const statusText =
    m.status==="live"
      ? "LIVE"
      : m.status==="ended"
      ? "ENDED"
      : "UPCOMING";

  return `

    <div class="match-card">

      <div class="match-top">

        <div>

          <div class="match-name">
            ${escapeHTML(m.name)}
          </div>

          <div class="match-meta">
            ${escapeHTML(m.series)} · ${formatDate(m.date)}
          </div>

        </div>

        <span class="badge ${badgeClass}">
          ${statusText}
        </span>

      </div>


      <div class="match-score">

        <div class="team">
          ${escapeHTML(m.team1)}
        </div>

        <div class="score">
          ${m.score1}
          <span class="vs">VS</span>
          ${m.score2}
        </div>

        <div class="team">
          ${escapeHTML(m.team2)}
        </div>

      </div>


      <div class="match-actions">

        ${
          m.status!=="ended"
          ? `
            <button
              class="btn"
              onclick="changeStatus(${m.id})">
              ${
                m.status==="live"
                ? "End Match"
                : "Start Live"
              }
            </button>
          `
          : ""
        }

        ${
          m.status==="live"
          ? `
            <button
              class="btn"
              onclick="addScore(${m.id},1)">
              + ${escapeHTML(m.team1)}
            </button>

            <button
              class="btn"
              onclick="addScore(${m.id},2)">
              + ${escapeHTML(m.team2)}
            </button>
          `
          : ""
        }

        <button
          class="btn btn-danger"
          onclick="deleteMatch(${m.id})">
          Delete
        </button>

      </div>

    </div>

  `;

}


/* =====================================================
   STATUS
===================================================== */

function changeStatus(id){

  const m = matches.find(x=>x.id===id);

  if(!m) return;

  if(m.status==="upcoming"){
    m.status="live";
    toast("Match is now LIVE");
  }
  else if(m.status==="live"){
    m.status="ended";
    toast("Match ended");
  }

  saveMatches();
  render();

}


/* =====================================================
   SCORE
===================================================== */

function addScore(id,team){

  const m = matches.find(x=>x.id===id);

  if(!m || m.status!=="live") return;

  if(team===1){
    m.score1++;
  }else{
    m.score2++;
  }

  saveMatches();
  render();

}


/* =====================================================
   DELETE
===================================================== */

function deleteMatch(id){

  const ok = confirm(
    "Delete this match?"
  );

  if(!ok) return;

  matches =
    matches.filter(x=>x.id!==id);

  saveMatches();
  render();

  toast("Match deleted");

}

/* =====================================================

===================================================== */

function render(){

  if(currentPage==="dashboard"){
    app.innerHTML=dashboardPage();
  }

  else if(currentPage==="matches"){
    app.innerHTML=matchesPage();
  }

  else if(currentPage==="series"){
    app.innerHTML=seriesPage();
  }

  else if(currentPage==="teams"){
    app.innerHTML=teamsPage();
  }

  else if(currentPage==="players"){
    app.innerHTML=playersPage();
  }

  else if(currentPage==="api"){
    app.innerHTML=apiPage();
  }

  else if(currentPage==="users"){
    app.innerHTML=usersPage();
  }

  else if(currentPage==="settings"){
    app.innerHTML=settingsPage();
  }

}

/* =====================================================
   SECURITY / HTML
===================================================== */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   INITIAL RENDER
===================================================== */

render();
