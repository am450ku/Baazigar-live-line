<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BAAZIGAR LIVE LINE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0d0f12;
  color:#f5f5f5;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.layout{
  min-height:100vh;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:250px;
  background:#15181c;
  border-right:1px solid #292d33;
  padding:25px 18px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:50;
}

.logo{
  font-size:25px;
  font-weight:900;
  margin-bottom:35px;
}

.logo span{
  color:#b6ff00;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.nav button{
  width:100%;
  padding:14px 16px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#aaa;
  text-align:left;
}

.nav button:hover,
.nav button.active{
  background:#252a30;
  color:#b6ff00;
}

.close-menu{
  display:none;
}

/* MAIN */

.main{
  margin-left:250px;
  width:calc(100% - 250px);
}

.topbar{
  height:82px;
  border-bottom:1px solid #292d33;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  background:#101215;
  position:sticky;
  top:0;
  z-index:20;
}

.menu-mobile{
  display:none;
  background:none;
  color:white;
  border:0;
  font-size:28px;
}

.brand-mobile{
  font-weight:900;
  font-size:20px;
}

.api-status{
  border:1px solid #607e00;
  color:#b6ff00;
  padding:10px 16px;
  border-radius:10px;
  font-weight:bold;
}

.api-status.error{
  color:#ff5555;
  border-color:#7e2222;
}

.content{
  padding:30px;
  max-width:1400px;
  margin:auto;
}

/* HEAD */

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:25px;
}

.title{
  font-size:38px;
  font-weight:900;
}

.desc{
  color:#9ca3a8;
  margin-top:7px;
}

.updated{
  color:#8e969c;
  text-align:right;
  font-size:12px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:25px;
}

.stat{
  background:#171a1e;
  border:1px solid #292d33;
  border-radius:14px;
  padding:22px;
}

.stat-top{
  color:#aeb5ba;
  font-size:12px;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
}

.stat-icon{
  color:#b6ff00;
}

.num{
  font-size:38px;
  font-weight:900;
  margin-top:12px;
}

/* SECTION */

.section{
  background:#171a1e;
  border:1px solid #292d33;
  border-radius:14px;
  padding:22px;
  margin-bottom:25px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.section-title{
  font-size:21px;
  font-weight:800;
}

/* BUTTON */

.btn{
  border:1px solid #353a40;
  background:#20242a;
  color:white;
  padding:10px 15px;
  border-radius:9px;
}

.btn:hover{
  border-color:#b6ff00;
}

.btn.primary{
  background:#b6ff00;
  color:#080a0b;
  border-color:#b6ff00;
  font-weight:800;
}

.btn.danger{
  color:#ff6666;
  border-color:#652d2d;
}

/* MATCH */

.match-list{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.match{
  border:1px solid #30353b;
  background:#111418;
  border-radius:12px;
  padding:18px;
}

.match-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.match-name{
  font-size:18px;
  font-weight:800;
}

.meta{
  color:#858d94;
  margin-top:5px;
  font-size:13px;
}

.badge{
  height:max-content;
  padding:6px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.badge.live{
  color:#b6ff00;
  background:#233100;
}

.badge.upcoming{
  color:#ffd45c;
  background:#332a0d;
}

.badge.ended{
  color:#aaa;
  background:#282b30;
}

.score{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:20px;
  margin:22px 0;
}

.team{
  font-weight:bold;
}

.score-num{
  font-size:26px;
  font-weight:900;
  white-space:nowrap;
}

.vs{
  color:#727980;
  font-size:11px;
  margin:0 8px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.card{
  background:#171a1e;
  border:1px solid #292d33;
  border-radius:14px;
  padding:22px;
}

.card h3{
  margin-bottom:10px;
}

.card p{
  color:#969da2;
  line-height:1.5;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:50px 20px;
  color:#858c92;
}

.empty-icon{
  font-size:35px;
  margin-bottom:12px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:520px;
  background:#171a1e;
  border:1px solid #383d43;
  border-radius:16px;
  padding:25px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-head h2{
  font-size:24px;
}

.close{
  border:0;
  background:none;
  color:#aaa;
  font-size:28px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  color:#aeb5ba;
  font-size:13px;
  margin-bottom:7px;
}

.form-group input,
.form-group select{
  width:100%;
  padding:13px;
  background:#0e1013;
  color:white;
  border:1px solid #343941;
  border-radius:9px;
  outline:none;
}

.form-group input:focus,
.form-group select:focus{
  border-color:#b6ff00;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%) translateY(80px);
  background:#f0f0eb;
  color:#111;
  padding:14px 22px;
  border-radius:10px;
  font-weight:bold;
  opacity:0;
  transition:.25s;
  z-index:200;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* OVERLAY */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:40;
}

.overlay.show{
  display:block;
}

/* MOBILE */

@media(max-width:800px){

  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .close-menu{
    display:block;
    position:absolute;
    right:15px;
    top:15px;
    background:none;
    color:#aaa;
    border:0;
    font-size:25px;
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .topbar{
    padding:0 15px;
  }

  .menu-mobile{
    display:block;
  }

  .brand-mobile{
    font-size:17px;
  }

  .api-status{
    padding:8px 10px;
    font-size:11px;
  }

  .content{
    padding:20px 15px 100px;
  }

  .page-head{
    align-items:flex-start;
  }

  .title{
    font-size:30px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .grid{
    grid-template-columns:1fr;
  }

  .score{
    grid-template-columns:1fr;
    text-align:center;
    gap:8px;
  }

  .match-top{
    flex-direction:column;
  }

}

/* SMALL */

@media(max-width:450px){

  .stats{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat{
    padding:15px;
  }

  .num{
    font-size:28px;
  }

  .updated{
    display:none;
  }

}

</style>

</head>

<body>

<div

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://lzvwictzhtfbdbgvekuq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_6fB6vZhG9yFHmfGdCs5lcw_m9Z6xVP9";


const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   DATA
===================================================== */

let matches = [];
let teamsCache = [];
let seriesCache = [];

let currentPage =
"dashboard";


/* =====================================================
   ELEMENTS
===================================================== */

const app =
document.getElementById("app");

const sidebar =
document.getElementById("sidebar");

const overlay =
document.getElementById("overlay");

const modal =
document.getElementById("modal");

const form =
document.getElementById("form");

const apiStatus =
document.getElementById("apiStatus");

const toast =
document.getElementById("toast");


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(message){

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(()=>{

      toast.classList.remove(
        "show"
      );

    },3000);
}


/* =====================================================
   ESCAPE
===================================================== */

function esc(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );
}


/* =====================================================
   DATE
===================================================== */

function dateFormat(value){

  if(!value)
    return "Date not set";

  const d =
    new Date(value);

  if(
    Number.isNaN(
      d.getTime()
    )
  )
    return value;

  return d.toLocaleString(
    [],
    {
      day:"2-digit",
      month:"short",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


/* =====================================================
   API STATUS
===================================================== */

function setAPIStatus(
  text,
  error=false
){

  apiStatus.textContent =
    text;

  apiStatus.classList.toggle(
    "error",
    error
  );
}


/* =====================================================
   LOAD TEAMS
===================================================== */

async function loadTeams(){

  const result =
    await sb
      .from("teams")
      .select("*")
      .order("id");

  if(result.error){

    console.error(
      "TEAMS ERROR:",
      result.error
    );

    teamsCache = [];

    return;
  }

  teamsCache =
    result.data || [];
}


/* =====================================================
   LOAD SERIES
===================================================== */

async function loadSeries(){

  const result =
    await sb
      .from("series")
      .select("*")
      .order("id");

  if(result.error){

    console.error(
      "SERIES ERROR:",
      result.error
    );

    seriesCache = [];

    return;
  }

  seriesCache =
    result.data || [];
}


/* =====================================================
   LOAD MATCHES
===================================================== */

async function loadMatches(){

  const result =
    await sb
      .from("matches")
      .select("*")
      .order(
        "start_time",
        {
          ascending:false
        }
      );

  if(result.error){

    console.error(
      "MATCHES ERROR:",
      result.error
    );

    setAPIStatus(
      "API ERROR",
      true
    );

    showToast(
      "Matches error: " +
      result.error.message
    );

    matches = [];

    render();

    return;
  }

  matches =
    result.data || [];

  setAPIStatus(
    "API ACTIVE",
    false
  );

  render();
}


/* =====================================================
   CONNECTION TEST
===================================================== */

async function connectSupabase(){

  try{

    setAPIStatus(
      "CONNECTING..."
    );

    const result =
      await sb
        .from("matches")
        .select("id")
        .limit(1);

    if(result.error){

      console.error(
        "SUPABASE ERROR:",
        result.error
      );

      setAPIStatus(
        "API ERROR",
        true
      );

      showToast(
        "Supabase: " +
        result.error.message
      );

      render();

      return false;
    }

    setAPIStatus(
      "API ACTIVE"
    );

    return true;

  }catch(error){

    console.error(
      error
    );

    setAPIStatus(
      "API ERROR",
      true
    );

    showToast(
      "Supabase connection failed"
    );

    return false;
  }
}


/* =====================================================
   TEAM NAME
===================================================== */

function teamName(id){

  const team =
    teamsCache.find(
      t =>
        String(t.id) ===
        String(id)
    );

  if(!team)
    return "Team #" + id;

  return (
    team.name ||
    team.team_name ||
    team.title ||
    "Team #" + id
  );
}


/* =====================================================
   SERIES NAME
===================================================== */

function seriesName(id){

  if(!id)
    return "General";

  const series =
    seriesCache.find(
      s =>
        String(s.id) ===
        String(id)
    );

  if(!series)
    return "Series #" + id;

  return (
    series.name ||
    series.series_name ||
    series.title ||
    "Series #" + id
  );
}


/* =====================================================
   DASHBOARD
===================================================== */

function dashboard(){

  const live =
    matches.filter(
      m =>
        m.status === "live"
    ).length;

  const upcoming =
    matches.filter(
      m =>
        m.status === "upcoming"
    ).length;

  const activeSeries =
    new Set(
      matches
        .map(
          m => m.series_id
        )
        .filter(Boolean)
    ).size;

  return `

    <div class="page-head">

      <div>

        <div class="title">
          Overview
        </div>

        <div class="desc">
          BAAZIGAR LIVE LINE control center
        </div>

      </div>

      <div class="updated">

        LAST UPDATED<br>

        ${new Date()
          .toLocaleTimeString()}

      </div>

    </div>


    <div class="stats">

      <div class="stat">

        <div class="stat-top">
          TOTAL MATCHES
          <span class="stat-icon">
            ⚔
          </span>
        </div>

        <div class="num">
          ${matches.length}
        </div>

      </div>


      <div class="stat">

        <div class="stat-top">
          LIVE MATCHES
          <span class="stat-icon">
            ●
          </span>
        </div>

        <div class="num">
          ${live}
        </div>

      </div>


      <div class="stat">

        <div class="stat-top">
          UPCOMING
          <span class="stat-icon">
            ▣
          </span>
        </div>

        <div class="num">
          ${upcoming}
        </div>

      </div>


      <div class="stat">

        <div class="stat-top">
          ACTIVE SERIES
          <span class="stat-icon">
            ▤
          </span>
        </div>

        <div class="num">
          ${activeSeries}
        </div>

      </div>

    </div>


    <div class="section">

      <div class="section-head">

        <div class="section-title">
          Recent Matches
        </div>

        <button
          class="btn primary"
          onclick="openModal()">

          + New Match

        </button>

      </div>

      ${matchList(5)}

    </div>

  `;
}


/* =====================================================
   MATCHES PAGE
===================================================== */

function matchesPage(){

  return `

    <div class="page-head">

      <div>

        <div class="title">
          Matches
        </div>

        <div class="desc">
          Create, manage and update live matches.
        </div>

      </div>

      <button
        class="btn primary"
        onclick="openModal()">

        + New Match

      </button>

    </div>

    <div class="section">

      ${matchList()}

    </div>

  `;
}


/* =====================================================
   MATCH LIST
===================================================== */

function matchList(limit){

  const list =
    limit
      ? matches.slice(0,limit)
      : matches;

  if(!list.length){

    return `

      <div class="empty">

        <div class="empty-icon">
          ⚔
        </div>

        <h3>
          No matches yet
        </h3>

        <p>
          Create your first match.
        </p>

      </div>

    `;
  }

  return `

    <div class="match-list">

      ${list
        .map(matchCard)
        .join("")}

    </div>

  `;
}


/* =====================================================
   MATCH CARD
===================================================== */

function matchCard(m){

  const status =
    m.status || "upcoming";

  const cls =
    status === "live"
      ? "live"
      : status === "ended"
      ? "ended"
      : "upcoming";

  const statusText =
    status === "live"
      ? "LIVE"
      : status === "ended"
      ? "ENDED"
      : "UPCOMING";

  const t1 =
    teamName(
      m.team1_id
    );

  const t2 =
    teamName(
      m.team2_id
    );

  const s1 =
    Number(
      m.team1_score || 0
    );

  const s2 =
    Number(
      m.team2_score || 0
    );

  return `

    <div class="match">

      <div class="match-top">

        <div>

          <div class="match-name">

            ${esc(t1)}
            vs
            ${esc(t2)}

          </div>

          <div class="meta">

            ${esc(
              seriesName(
                m.series_id
              )
            )}

            ·

            ${dateFormat(
              m.start_time
            )}

          </div>

        </div>

        <span class="badge ${cls}">
          ${statusText}
        </span>

      </div>


      <div class="score">

        <div class="team">
          ${esc(t1)}
        </div>

        <div class="score-num">

          ${s1}

          <span class="vs">
            VS
          </span>

          ${s2}

        </div>

        <div class="team">
          ${esc(t2)}
        </div>

      </div>


      <div class="actions">

        ${
          status !== "ended"
          ?
          `
          <button
            class="btn"
            onclick="changeStatus(
              ${Number(m.id)},
              '${status}'
            )">

            ${
              status === "live"
              ? "End Match"
              : "Start Live"
            }

          </button>
          `
          :
          ""
        }


        ${
          status === "live"
          ?
          `

          <button
            class="btn"
            onclick="addScore(
              ${Number(m.id)},
              1
            )">

            + ${esc(t1)}

          </button>


          <button
            class="btn"
            onclick="addScore(
              ${Number(m.id)},
              2
            )">

            + ${esc(t2)}

          </button>

          `
          :
          ""
        }


        <button
          class="btn danger"
          onclick="deleteMatch(
            ${Number(m.id)}
          )">

          Delete

        </button>

      </div>

    </div>

  `;
}

/* =====================================================
   CHANGE STATUS
===================================================== */

async function changeStatus(
  id,
  currentStatus
){

  const next =
    currentStatus === "upcoming"
      ? "live"
      : "ended";

  const result =
    await sb
      .from("matches")
      .update({
        status:next
      })
      .eq("id",id);

  if(result.error){

    console.error(
      result.error
    );

    showToast(
      "Status update failed: " +
      result.error.message
    );

    return;
  }

  showToast(
    next === "live"
      ? "Match is LIVE"
      : "Match ended"
  );

  await loadMatches();
}


/* =====================================================
   ADD SCORE
===================================================== */

async function addScore(
  id,
  team
){

  const match =
    matches.find(
      m =>
        String(m.id) ===
        String(id)
    );

  if(
    !match ||
    match.status !== "live"
  )
    return;


  let updateData;


  if(team === 1){

    updateData = {

      team1_score:
        Number(
          match.team1_score || 0
        ) + 1

    };

  }else{

    updateData = {

      team2_score:
        Number(
          match.team2_score || 0
        ) + 1

    };

  }


  const result =
    await sb
      .from("matches")
      .update(
        updateData
      )
      .eq("id",id);


  if(result.error){

    console.error(
      result.error
    );

    showToast(
      "Score update failed: " +
      result.error.message
    );

    return;
  }

  await loadMatches();
}


/* =====================================================
   DELETE
===================================================== */

async function deleteMatch(id){

  if(
    !confirm(
      "Delete this match?"
    )
  )
    return;


  const result =
    await sb
      .from("matches")
      .delete()
      .eq("id",id);


  if(result.error){

    console.error(
      result.error
    );

    showToast(
      "Delete failed: " +
      result.error.message
    );

    return;
  }


  showToast(
    "Match deleted"
  );

  await loadMatches();
}


/* =====================================================
   CREATE MATCH
===================================================== */

form.onsubmit =
async function(e){

  e.preventDefault();


  const team1Name =
    document
      .getElementById("team1")
      .value
      .trim();


  const team2Name =
    document
      .getElementById("team2")
      .value
      .trim();


  const seriesNameInput =
    document
      .getElementById("series")
      .value
      .trim();


  const status =
    document
      .getElementById("status")
      .value;


  const date =
    document
      .getElementById("date")
      .value;


  const team1 =
    teamsCache.find(
      t =>
        String(
          t.name ||
          t.team_name ||
          t.title ||
          ""
        ).toLowerCase()
        ===
        team1Name.toLowerCase()
    );


  const team2 =
    teamsCache.find(
      t =>
        String(
          t.name ||
          t.team_name ||
          t.title ||
          ""
        ).toLowerCase()
        ===
        team2Name.toLowerCase()
    );


  if(!team1){

    showToast(
      "Team 1 Supabase me nahi mila"
    );

    return;
  }


  if(!team2){

    showToast(
      "Team 2 Supabase me nahi mila"
    );

    return;
  }


  let series = null;


  if(seriesNameInput){

    series =
      seriesCache.find(
        s =>
          String(
            s.name ||
            s.series_name ||
            s.title ||
            ""
          ).toLowerCase()
          ===
          seriesNameInput.toLowerCase()
      );


    if(!series){

      showToast(
        "Series Supabase me nahi mili"
      );

      return;
    }

  }


  const payload = {

    series_id:
      series
        ? series.id
        : null,

    team1_id:
      team1.id,

    team2_id:
      team2.id,

    status:
      status,

    start_time:
      new Date(
        date
      ).toISOString(),

    team1_score:0,

    team1_wickets:0,

    team1_overs:0,

    team2_score:0,

    team2_wickets:0,

    team2_overs:0

  };


  const result =
    await sb
      .from("matches")
      .insert(
        payload
      );


  if(result.error){

    console.error(
      "CREATE ERROR:",
      result.error
    );

    showToast(
      "Match create failed: " +
      result.error.message
    );

    return;
  }


  closeModal();


  currentPage =
    "matches";


  document
    .querySelectorAll(
      ".nav-item"
    )
    .forEach(x=>{

      x.classList.toggle(
        "active",
        x.dataset.page ===
        "matches"
      );

    });


  showToast(
    "Match created successfully"
  );


  await loadMatches();

};
