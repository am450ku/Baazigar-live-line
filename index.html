/* =========================================
   TOAST
========================================= */

function showToast(text) {

  const t = document.getElementById("toast");

  if (!t) {
    console.log(text);
    return;
  }

  t.textContent = text;
  t.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    t.classList.remove("show");
  }, 3000);
}


/* =========================================
   SAFE HTML
========================================= */

function esc(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================================
   DATE FORMAT
========================================= */

function dateFormat(value) {

  if (!value) {
    return "Date not set";
  }

  const d = new Date(value);

  if (isNaN(d.getTime())) {
    return String(value);
  }

  return d.toLocaleString([], {
    day: "2-digit",
    month: "short",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });
}

/* =========================================
   SUPABASE TEST
========================================= */

async function testSupabaseConnection() {

  try {

    const { error } = await sb
      .from("teams")
      .select("id")
      .limit(1);

    if (error) {

      console.error("Supabase connection error:", error);

      setAPIStatus("API ERROR");

      showToast(
        "Supabase error: " + error.message
      );

      return false;
    }

    setAPIStatus("API ACTIVE");

    return true;

  } catch (error) {

    console.error(error);

    setAPIStatus("API ERROR");

    showToast("Supabase connection failed");

    return false;
  }
}


/* =========================================
   LOAD TEAMS + SERIES
========================================= */

async function loadReferenceData() {

  const [
    teamsResult,
    seriesResult
  ] = await Promise.all([

    sb
      .from("teams")
      .select("*")
      .order("id", { ascending: true }),

    sb
      .from("series")
      .select("*")
      .order("id", { ascending: true })

  ]);


  /* TEAMS */

  if (teamsResult.error) {

    console.error(
      "Teams error:",
      teamsResult.error
    );

    teamsCache = [];

  } else {

    teamsCache =
      teamsResult.data || [];
  }


  /* SERIES */

  if (seriesResult.error) {

    console.error(
      "Series error:",
      seriesResult.error
    );

    seriesCache = [];

  } else {

    seriesCache =
      seriesResult.data || [];
  }
}


/* =========================================
   LOAD MATCHES
========================================= */

async function loadMatches() {

  try {

    const { data, error } = await sb
      .from("matches")
      .select("*")
      .order("start_time", {
        ascending: false
      });


    if (error) {

      console.error(
        "Matches error:",
        error
      );

      setAPIStatus("API ERROR");

      showToast(
        "Matches error: " + error.message
      );

      return;
    }


    matches = data || [];

    setAPIStatus("API ACTIVE");

    render();

  } catch (error) {

    console.error(error);

    setAPIStatus("API ERROR");

    showToast(
      "Supabase matches connection failed"
    );
  }
}


/* =========================================
   TEAM NAME
========================================= */

function teamName(id) {

  if (id === null || id === undefined) {
    return "Unknown Team";
  }

  const team = teamsCache.find(
    t => String(t.id) === String(id)
  );


  if (!team) {
    return "Team #" + id;
  }


  return (
    team.name ||
    team.team_name ||
    team.title ||
    "Team #" + id
  );
}


/* =========================================
   SERIES NAME
========================================= */

function seriesName(id) {

  if (!id) {
    return "General";
  }


  const series = seriesCache.find(
    s => String(s.id) === String(id)
  );


  if (!series) {
    return "Series #" + id;
  }


  return (
    series.name ||
    series.series_name ||
    series.title ||
    "Series #" + id
  );
}

/* =========================================
   MATCH LIST
========================================= */

function matchList(limit) {

  const list =
    limit
      ? matches.slice(0, limit)
      : matches;


  if (!list.length) {

    return `

      <div class="empty">

        <div class="empty-icon">
          ⚔
        </div>

        <h3>
          No matches yet
        </h3>

        <p>

  }


  return `

    <div class="match-list">

      ${list
        .map(matchCard)
        .join("")}

    </div>

  `;
}


/* =========================================
   MATCH CARD
========================================= */

function matchCard(m) {

  const status =
    String(m.status || "upcoming")
      .toLowerCase();


  const cls =
    status === "live"
      ? "live"
      : status === "ended"
      ? "ended"
      : "upcoming";


  const text =
    status === "live"
      ? "LIVE"
      : status === "ended"
      ? "ENDED"
      : "UPCOMING";


  const t1 =
    teamName(m.team1_id);


  const t2 =
    teamName(m.team2_id);


  const s1 =
    Number(m.team1_score ?? 0);


  const s2 =
    Number(m.team2_score ?? 0);


  return `

    <div class="match">

      <div class="match-top">

        <div>

          <div class="match-name">

            ${esc(t1)}
            vs
            ${esc(t2)}

          </div>


          <div class="meta">

            ${esc(
              seriesName(m.series_id)
            )}

            ·

            ${dateFormat(m.start_time)}

          </div>

        </div>


        <span class="badge ${cls}">

          ${text}

        </span>

      </div>


      <div class="score">

        <div class="team">
          ${esc(t1)}
        </div>


        <div class="score-num">

          ${s1}

          <span class="vs">
            VS
          </span>

          ${s2}

        </div>


        <div class="team">
          ${esc(t2)}
        </div>

      </div>


      <div class="actions">

        ${
          status !== "ended"
            ? `

              <button
                class="btn"
                onclick="changeStatus(
                  ${Number(m.id)},
                  '${esc(status)}'
                )">

                ${
                  status === "live"
                    ? "End Match"
                    : "Start Live"
                }

              </button>

            `
            : ""
        }


        ${
          status === "live"
            ? `

              <button
                class="btn"
                onclick="addScore(
                  ${Number(m.id)},
                  1
                )">

                + ${esc(t1)}

              </button>


              <button
                class="btn"
                onclick="addScore(
                  ${Number(m.id)},
                  2
                )">

                + ${esc(t2)}

              </button>

            `
            : ""
        }


        <button
          class="btn danger"
          onclick="deleteMatch(
            ${Number(m.id)}
          )">

          Delete

        </button>

      </div>

    </div>

  `;
}


/* =========================================
   CHANGE STATUS
========================================= */

async function changeStatus(id, status) {

  const next =
    status === "upcoming"
      ? "live"
      : "ended";


  const { error } =
    await sb
      .from("matches")
      .update({
        status: next
      })
      .eq("id", id);


  if (error) {

    console.error(
      "Status update error:",
      error
    );

    showToast(
      "Status update failed: " +
      error.message
    );

    return;
  }


  showToast(
    next === "live"
      ? "Match is LIVE"
      : "Match ended"
  );


  await loadMatches();
}


/* =========================================
   ADD SCORE
========================================= */

async function addScore(id, team) {

  const match =
    matches.find(
      x => String(x.id) === String(id)
    );


  if (
    !match ||
    String(match.status).toLowerCase() !== "live"
  ) {

    showToast(
      "Match is not live"
    );

    return;
  }


  const current1 =
    Number(match.team1_score || 0);


  const current2 =
    Number(match.team2_score || 0);


  const updateData =
    team === 1
      ? {
          team1_score:
            current1 + 1
        }
      : {
          team2_score:
            current2 + 1
        };


  const { error } =
    await sb
      .from("matches")
      .update(updateData)
      .eq("id", id);


  if (error) {

    console.error(
      "Score update error:",
      error
    );

    showToast(
      "Score update failed: " +
      error.message
    );

    return;
  }


  await loadMatches();
}


/* =========================================
   DELETE MATCH
========================================= */

async function deleteMatch(id) {

  if (
    !confirm(
      "Delete this match?"
    )
  ) {
    return;
  }


  const { error } =
    await sb
      .from("matches")
      .delete()
      .eq("id", id);


  if (error) {

    console.error(
      "Delete error:",
      error
    );

    showToast(
      "Delete failed: " +
      error.message
    );

    return;
  }


  showToast(
    "Match deleted"
  );


  await loadMatches();
}

/* =========================================
   CREATE MATCH
========================================= */

if (form) {

  form.onsubmit = async e => {

    e.preventDefault();


    const team1 =
      document
        .getElementById("team1")
        .value
        .trim();


    const team2 =
      document
        .getElementById("team2")
        .value
        .trim();


    const series =
      document
        .getElementById("series")
        .value
        .trim();


    const status =
      document
        .getElementById("status")
        .value;


    const date =
      document
        .getElementById("date")
        .value;


    /* FIND TEAM 1 */

    const t1 =
      teamsCache.find(
        t => {

          const name =
            t.name ||
            t.team_name ||
            t.title ||
            "";

          return (
            String(name)
              .toLowerCase()
              .trim()
            ===
            team1
              .toLowerCase()
              .trim()
          );

        }
      );


    /* FIND TEAM 2 */

    const t2 =
      teamsCache.find(
        t => {

          const name =
            t.name ||
            t.team_name ||
            t.title ||
            "";

          return (
            String(name)
              .toLowerCase()
              .trim()
            ===
            team2
              .toLowerCase()
              .trim()
          );

        }
      );


    if (!t1 || !t2) {

      showToast(
        "Team name Supabase teams table se match nahi hua"
      );

      return;
    }


    /* FIND SERIES */

    let s = null;


    if (series) {

      s =
        seriesCache.find(
          x => {

            const name =
              x.name ||
              x.series_name ||
              x.title ||
              "";

            return (
              String(name)
                .toLowerCase()
                .trim()
              ===
              series
                .toLowerCase()
                .trim()
            );

          }
        );


      if (!s) {

        showToast(
          "Series Supabase series table me nahi mili"
        );

        return;
      }

    }


    /* DATE */

    const startTime =
      date
        ? new Date(date).toISOString()
        : new Date().toISOString();


    /* PAYLOAD */

    const payload = {

      series_id:
        s ? s.id : null,

      team1_id:
        t1.id,

      team2_id:
        t2.id,

      status:
        status || "upcoming",

      start_time:
        startTime,

      team1_score:
        0,

      team1_wickets:
        0,

      team1_overs:
        0,

      team2_score:
        0,

      team2_wickets:
        0,

      team2_overs:
        0

    };


    /* INSERT */

    const { error } =
      await sb
        .from("matches")
        .insert(payload);


    if (error) {

      console.error(
        "Create match error:",
        error
      );

      showToast(
        "Match create failed: " +
        error.message
      );

      return;
    }


    closeModal();


    currentPage =
      "matches";


    setActive(
      "matches"
    );


    showToast(
      "Match created in Supabase"
    );


    await loadMatches();

  };

}


/* =========================================
   REALTIME
========================================= */

function setupRealtime() {

  try {

    sb
      .channel("baazigar-live-matches")

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "matches"
        },
        async payload => {

          console.log(
            "Realtime match update:",
            payload
          );

          await loadMatches();

        }
      )

      .subscribe(
        status => {

          console.log(
            "Realtime status:",
            status
          );

        }
      );

  } catch (error) {

    console.error(
      "Realtime setup error:",
      error
    );

  }

}


/* =========================================
   START APPLICATION
========================================= */

(async function startApp() {

  try {

    /* Initial UI */

    render();


    /* Test Supabase */

    const connected =
      await testSupabaseConnection();


    if (!connected) {
      return;
    }


    /* Load teams + series */

    await loadReferenceData();


    /* Load matches */

    await loadMatches();


    /* Realtime */

    setupRealtime();


    /* Final status */

    setAPIStatus(
      "API ACTIVE"
    );


    console.log(
      "BAAZIGAR LIVE LINE connected to Supabase"
    );


  } catch (error) {

    console.error(
      "Application startup error:",
      error
    );

    setAPIStatus(
      "API ERROR"
    );

    showToast(
      "Application connection error"
    );

  }

})();

</script>
