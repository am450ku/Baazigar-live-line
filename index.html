<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>BAAZIGAR LIVE LINE</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f12;
  --panel:#181b20;
  --panel2:#20242a;
  --border:#30343b;
  --text:#f1f3ed;
  --muted:#aeb3a2;
  --lime:#b7ff00;
  --red:#ff7777
}
html,body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100%
}
body{overflow-x:hidden}

button,input,select{font:inherit}

.header{
  height:70px;
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:rgba(13,15,18,.98);
  border-bottom:1px solid var(--border)
}

.brand{
  display:flex;
  align-items:center;
  gap:10px
}

.menu{
  width:40px;
  height:40px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--panel);
  color:white;
  font-size:21px;
  cursor:pointer
}

.logo{
  font-size:17px;
  font-weight:900;
  white-space:nowrap
}

.logo span{color:var(--lime)}

.status{
  color:var(--lime);
  font-size:10px;
  font-weight:900;
  border:1px solid #4c6900;
  border-radius:9px;
  padding:8px 10px
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:275px;
  background:#090b0d;
  border-right:1px solid var(--border);
  z-index:200;
  transform:translateX(-100%);
  transition:.2s;
  padding:22px 12px;
  overflow:auto
}

.sidebar.open{transform:translateX(0)}

.side-logo{
  font-size:24px;
  font-weight:900;
  padding:0 8px 22px
}

.side-logo span{color:var(--lime)}

.sub{
  color:#858b7e;
  font-size:10px;
  letter-spacing:2px;
  margin-top:7px
}

.new{
  width:100%;
  height:48px;
  border:0;
  border-radius:10px;
  background:var(--lime);
  color:#101400;
  font-weight:900;
  margin-bottom:15px;
  cursor:pointer
}

.nav-item{
  height:45px;
  border-radius:9px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 13px;
  color:#adb2a5;
  cursor:pointer;
  font-size:14px;
  margin:3px 0
}

.nav-item.active,
.nav-item:hover{
  color:var(--lime);
  background:#182204
}

.overlay{
  position:fixed;
  inset:0;
  background:#000a;
  z-index:150;
  display:none
}

.overlay.show{display:block}

main{
  width:100%
}

.container{
  width:100%;
  max-width:1180px;
  margin:auto;
  padding:22px 14px 80px
}

.page-head{
  margin-bottom:22px
}

.title{
  font-size:34px;
  font-weight:900
}

.desc{
  color:var(--muted);
  font-size:14px;
  margin-top:8px;
  line-height:1.5
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px
}

.stat{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  min-height:110px;
  padding:15px
}

.stat-top{
  color:#b8bdaf;
  font-size:10px;
  font-weight:900
}

.num{
  font-size:31px;
  font-weight:900;
  margin-top:20px
}

.section{
  margin-top:23px
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px
}

.section-title{
  font-size:18px;
  font-weight:900
}

.btn{
  border:1px solid var(--border);
  background:var(--panel);
  color:white;
  border-radius:8px;
  padding:9px 11px;
  cursor:pointer;
  font-size:12px;
  font-weight:800
}

.btn:hover{
  border-color:var(--lime);
  color:var(--lime)
}

.primary{
  background:var(--lime);
  color:#101400;
  border-color:var(--lime)
}

.danger{color:#ff9999}

.match-list{
  display:grid;
  gap:10px
}

.match{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  padding:14px
}

.match-top{
  display:flex;
  justify-content:space-between;
  gap:10px
}

.match-name{
  font-weight:900;
  font-size:16px
}

.meta{
  color:var(--muted);
  font-size:11px;
  margin-top:5px
}

.badge{
  padding:5px 8px;
  border-radius:30px;
  font-size:9px;
  font-weight:900;
  height:max-content
}

.live{
  color:var(--lime);
  background:#192400;
  border:1px solid #4b6800
}

.upcoming{
  background:#25282d
}

.ended{
  color:#999;
  background:#1b1d20
}

.score{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  text-align:center;
  margin:18px 0
}

.team{
  font-size:14px;
  font-weight:800
}

.score-num{
  font-size:23px;
  font-weight:900
}

.vs{
  font-size:10px;
  color:#777;
  padding:0 8px
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  padding:16px
}

.card h3{
  font-size:16px;
  margin-bottom:8px
}

.card p{
  color:var(--muted);
  font-size:12px;
  line-height:1.5
}

.empty{
  text-align:center;
  padding:35px 15px;
  border:1px dashed var(--border);
  border-radius:12px;
  background:var(--panel)
}

.empty h3{font-size:16px}
.empty p{
  color:var(--muted);
  font-size:12px;
  margin-top:6px
}

.modal-bg{
  position:fixed;
  inset:0;
  z-index:300;
  background:#000b;
  display:none;
  align-items:center;
  justify-content:center;
  padding:14px
}

.modal-bg.show{display:flex}

.modal{
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  background:#15181c;
  border:1px solid var(--border);
  border-radius:14px;
  padding:17px
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px
}

.modal-title{
  font-size:20px;
  font-weight:900
}

.close{
  width:34px;
  height:34px;
  background:var(--panel);
  color:white;
  border:1px solid var(--border);
  border-radius:8px;
  cursor:pointer;
  font-size:20px
}

.form{
  display:grid;
  gap:12px
}

.field{
  display:grid;
  gap:6px
}

.field label{
  font-size:11px;
  color:#bfc4b6;
  font-weight:700
}

.field input,
.field select{
  width:100%;
  height:44px;
  background:#0e1013;
  color:white;
  border:1px solid var(--border);
  border-radius:8px;
  padding:0 11px;
  outline:none;
  font-size:13px
}

.field input:focus,
.field select:focus{
  border-color:var(--lime)
}

.form-actions{
  display:flex;
  gap:8px;
  margin-top:4px
}

.form-actions .btn{
  flex:1;
  height:44px
}

.toast{
  position:fixed;
  z-index:500;
  left:50%;
  bottom:22px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  background:#eef2e8;
  color:#111;
  padding:11px 15px;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
  transition:.2s
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0)
}

@media(min-width:900px){
  .sidebar{transform:none}
  .overlay{display:none!important}
  .menu{display:none}
  .header{padding-left:305px}
  main{margin-left:275px}
  .container{padding:30px}
  .title{font-size:43px}
  .stats{grid-template-columns:repeat(4,1fr)}
}

@media(max-width:650px){
  .grid{grid-template-columns:1fr}
  .actions .btn{font-size:11px;padding:8px}
}

@media(max-width:380px){
  .logo{font-size:14px}
  .status{font-size:9px}
}
</style>
</head>

<body>

<header class="header">
  <div class="brand">
    <button class="menu" id="menuBtn">☰</button>
    <div class="logo">BAAZIGAR <span>LIVE LINE</span></div>
  </div>

  <div class="status" id="apiStatus">
    ● CONNECTING
  </div>
</header>

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">

  <div class="side-logo">
    BAAZIGAR <span>LIVE LINE</span>
    <div class="sub">ADMIN CONTROL PANEL</div>
  </div>

  <button class="new" id="newMatch">＋ NEW MATCH</button>

  <div class="nav">

    <div class="nav-item active" data-page="dashboard">
      ▦ Dashboard
    </div>

    <div class="nav-item" data-page="matches">
      ⚔ Match Management
    </div>

    <div class="nav-item" data-page="series">
      ▣ Series
    </div>

    <div class="nav-item" data-page="teams">
      ♟ Teams
    </div>

    <div class="nav-item" data-page="players">
      ♙ Players
    </div>

    <div class="nav-item" data-page="api">
      ◆ API Settings
    </div>

    <div class="nav-item" data-page="users">
      ♙ Users
    </div>

    <div class="nav-item" data-page="settings">
      ⚙ Settings
    </div>

  </div>
</aside>

<main>
  <div class="container" id="app"></div>
</main>

<div class="modal-bg" id="modal">

  <div class="modal">

    <div class="modal-head">
      <div class="modal-title">Create New Match</div>
      <button class="close" id="close">×</button>
    </div>

    <form class="form" id="form">

      <div class="field">
        <label>Team 1 ID</label>
        <input id="team1_id" type="number" required placeholder="Team ID">
      </div>

      <div class="field">
        <label>Team 2 ID</label>
        <input id="team2_id" type="number" required placeholder="Team ID">
      </div>

      <div class="field">
        <label>Series ID</label>
        <input id="series_id" type="number" placeholder="Series ID">
      </div>

      <div class="field">
        <label>Date & Time</label>
        <input id="date" type="datetime-local" required>
      </div>

      <div class="field">
        <label>Status</label>
        <select id="status">
          <option value="upcoming">Upcoming</option>
          <option value="live">Live</option>
        </select>
      </div>

      <div class="field">
        <label>Venue</label>
        <input id="venue" placeholder="Stadium">
      </div>

      <div class="field">
        <label>Target</label>
        <input id="target" type="number" placeholder="Optional">
      </div>

      <div class="form-actions">
        <button type="button" class="btn" id="cancel">
          Cancel
        </button>

        <button class="btn primary" type="submit">
          Create Match
        </button>
      </div>

    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
"https://lzvwictzhtfbdbgvekuq.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_6fB6vZhG9yFHmfGdCs5lcw_m9Z6xVP9";

const REST =
SUPABASE_URL + "/rest/v1";

const HEADERS = {
  "apikey": SUPABASE_ANON_KEY,
  "Authorization": "Bearer " + SUPABASE_ANON_KEY,
  "Content-Type": "application/json"
};


/* =========================
   GLOBALS
========================= */

let matches = [];
let teamsCache = [];
let seriesCache = [];
let currentPage = "dashboard";

const app = document.getElementById("app");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const modal = document.getElementById("modal");
const form = document.getElementById("form");
const apiStatus = document.getElementById("apiStatus");


/* =========================
   TOAST
========================= */

function showToast(text){

  const t = document.getElementById("toast");

  t.textContent = text;
  t.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(() => {
      t.classList.remove("show");
    }, 2800);
}


/* =========================
   SAFE HTML
========================= */

function esc(v){

  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================
   DATE
========================= */

function dateFormat(v){

  if(!v) return "Date not set";

  const d = new Date(v);

  if(isNaN(d.getTime()))
    return String(v);

  return d.toLocaleString([],{
    day:"2-digit",
    month:"short",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}


/* =========================
   SUPABASE REST
========================= */

async function sb(path, options = {}){

  const response = await fetch(
    REST + path,
    {
      ...options,
      headers:{
        ...HEADERS,
        ...(options.headers || {})
      }
    }
  );

  const text = await response.text();

  if(!response.ok){

    throw new Error(
      text || ("HTTP " + response.status)
    );
  }

  if(!text) return null;

  try{
    return JSON.parse(text);
  }catch{
    return text;
  }
}


/* =========================
   UI FIRST
========================= */

function renderLoading(){

  app.innerHTML = `
    <div class="page-head">
      <div class="title">Overview</div>
      <div class="desc">
        BAAZIGAR LIVE LINE control center
      </div>
    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-top">TOTAL MATCHES</div>
        <div class="num">—</div>
      </div>

      <div class="stat">
        <div class="stat-top">LIVE MATCHES</div>
        <div class="num">—</div>
      </div>

      <div class="stat">
        <div class="stat-top">UPCOMING</div>
        <div class="num">—</div>
      </div>

      <div class="stat">
        <div class="stat-top">ACTIVE SERIES</div>
        <div class="num">—</div>
      </div>

    </div>

    <div class="section">

      <div class="section-head">
        <div class="section-title">
          Recent Matches
        </div>

        <button
          class="btn primary"
          onclick="openModal()">
          + New Match
        </button>
      </div>

      <div class="empty">
        <h3>Connecting to Supabase...</h3>
        <p>Please wait.</p>
      </div>

    </div>
  `;
}


/* =========================
   LOAD REFERENCE DATA
========================= */

async function loadReferenceData(){

  try{

    teamsCache =
      await sb("/teams?select=*");

  }catch(e){

    teamsCache = [];

    console.warn("Teams table:",e);
  }

  try{

    seriesCache =
      await sb("/series?select=*");

  }catch(e){

    seriesCache = [];

    console.warn("Series table:",e);
  }
}


/* =========================
   LOAD MATCHES
========================= */

async function loadMatches(){

  apiStatus.textContent =
    "● CONNECTING";

  try{

    matches =
      await sb(
        "/matches?select=*&order=start_time.desc"
      );

    matches =
      Array.isArray(matches) ? matches : [];

    apiStatus.textContent =
      "● API ACTIVE";

    render();

  }catch(error){

    console.error(error);

    matches = [];

    apiStatus.textContent =
      "● API ERROR";

    render();

    showToast(
      "Supabase error: " +
      error.message
    );
  }
}


/* =========================
   TEAM NAME
========================= */

function teamName(id){

  const t =
    teamsCache.find(
      x => String(x.id) === String(id)
    );

  return (
    t?.name ||
    t?.team_name ||
    "Team #" + id
  );
}


/* =========================
   SERIES NAME
========================= */

function seriesName(id){

  if(!id)
    return "General";

  const s =
    seriesCache.find(
      x => String(x.id) === String(id)
    );

  return (
    s?.name ||
    s?.series_name ||
    "Series #" + id
  );
}


/* =========================
   MATCH CARD
========================= */

function matchCard(m){

  const status =
    m.status || "upcoming";

  const cls =
    status === "live"
      ? "live"
      : status === "ended"
      ? "ended"
      : "upcoming";

  const statusText =
    status === "live"
      ? "LIVE"
      : status === "ended"
      ? "ENDED"
      : "UPCOMING";

  const t1 = teamName(m.team1_id);
  const t2 = teamName(m.team2_id);

  const s1 =
    m.team1_score ?? 0;

  const s2 =
    m.team2_score ?? 0;

  return `

    <div class="match">

      <div class="match-top">

        <div>

          <div class="match-name">
            ${esc(t1)} vs ${esc(t2)}
          </div>

          <div class="meta">
            ${esc(seriesName(m.series_id))}
            ·
            ${dateFormat(m.start_time)}
          </div>

        </div>

        <span class="badge ${cls}">
          ${statusText}
        </span>

      </div>

      <div class="score">

        <div class="team">
          ${esc(t1)}
        </div>

        <div class="score-num">
          ${s1}
          <span class="vs">VS</span>
          ${s2}
        </div>

        <div class="team">
          ${esc(t2)}
        </div>

      </div>

      <div class="actions">

        ${
          status !== "ended"
          ?
          `<button
             class="btn"
             onclick="changeStatus(${m.id},'${status}')">
             ${status === "live"
               ? "End Match"
               : "Start Live"}
           </button>`
          : ""
        }

        ${
          status === "live"
          ?
          `
          <button
            class="btn"
            onclick="addScore(${m.id},1)">
            + ${esc(t1)}
          </button>

          <button
            class="btn"
            onclick="addScore(${m.id},2)">
            + ${esc(t2)}
          </button>
          `
          : ""
        }

        <button
          class="btn danger"
          onclick="deleteMatch(${m.id})">
          Delete
        </button>

      </div>

    </div>
  `;
}


/* =========================
   MATCH LIST
========================= */

function matchList(limit){

  const list =
    limit
    ? matches.slice(0,limit)
    : matches;

  if(!list.length){

    return `
      <div class="empty">

        <h3>No matches yet</h3>

        <p>
          Create your first match.
        </p>

      </div>
    `;
  }

  return `
    <div class="match-list">
      ${list.map(matchCard).join("")}
    </div>
  `;
}


/* =========================
   DASHBOARD
========================= */

function dashboard(){

  const live =
    matches.filter(
      m => m.status === "live"
    ).length;

  const upcoming =
    matches.filter(
      m => m.status === "upcoming"
    ).length;

  const series =
    new Set(
      matches
        .map(m => m.series_id)
        .filter(Boolean)
    ).size;

  return `

    <div class="page-head">

      <div class="title">
        Overview
      </div>

      <div class="desc">
        BAAZIGAR LIVE LINE control center
      </div>

    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-top">
          TOTAL MATCHES
        </div>
        <div class="num">
          ${matches.length}
        </div>
      </div>

      <div class="stat">
        <div class="stat-top">
          LIVE MATCHES
        </div>
        <div class="num">
          ${live}
        </div>
      </div>

      <div class="stat">
        <div class="stat-top">
          UPCOMING
        </div>
        <div class="num">
          ${upcoming}
        </div>
      </div>

      <div class="stat">
        <div class="stat-top">
          ACTIVE SERIES
        </div>
        <div class="num">
          ${series}
        </div>
      </div>

    </div>

    <div class="section">

      <div class="section-head">

        <div class="section-title">
          Recent Matches
        </div>

        <button
          class="btn primary"
          onclick="openModal()">
          + New Match
        </button>

      </div>

      ${matchList(5)}

    </div>
  `;
}


/* =========================
   MATCH PAGE
========================= */

function matchesPage(){

  return `

    <div class="page-head">

      <div class="title">
        Match Management
      </div>

      <div class="desc">
        Create, manage and update live matches.
      </div>

    </div>

    <div class="section">

      <div class="section-head">

        <div class="section-title">
          All Matches
        </div>

        <button
          class="btn primary"
          onclick="openModal()">
          + New Match
        </button>

      </div>

      ${matchList()}

    </div>
  `;
}


/* =========================
   SIMPLE PAGE
========================= */

function simplePage(title,desc,content){

  return `

    <div class="page-head">

      <div class="title">
        ${esc(title)}
      </div>

      <div class="desc">
        ${esc(desc)}
      </div>

    </div>

    <div class="grid">
      ${content}
    </div>
  `;
}


/* =========================
   API PAGE
========================= */

function apiPage(){

  return simplePage(
    "API Settings",
    "Supabase connection and API settings.",
    `

      <div class="card">

        <h3>Supabase</h3>

        <p>
          ${esc(SUPABASE_URL)}
        </p>

        <p style="margin-top:10px;color:var(--lime)">
          ${esc(apiStatus.textContent)}
        </p>

/* =========================
   CHANGE STATUS
========================= */

async function changeStatus(id,status){

  const next =
    status === "upcoming"
    ? "live"
    : "ended";

  try{

    await sb(
      "/matches?id=eq." + encodeURIComponent(id),
      {
        method:"PATCH",
        headers:{
          ...HEADERS,
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({
          status:next
        })
      }
    );

    showToast(
      next === "live"
      ? "Match is LIVE"
      : "Match ended"
    );

    await loadMatches();

  }catch(error){

    console.error(error);

    showToast(
      "Update failed: " +
      error.message
    );
  }
}


/* =========================
   SCORE
========================= */

async function addScore(id,team){

  const match =
    matches.find(
      x => String(x.id) === String(id)
    );

  if(!match || match.status !== "live")
    return;

  const patch =
    team === 1
    ?
    {
      team1_score:
        Number(match.team1_score || 0) + 1
    }
    :
    {
      team2_score:
        Number(match.team2_score || 0) + 1
    };

  try{

    await sb(
      "/matches?id=eq." +
      encodeURIComponent(id),
      {
        method:"PATCH",
        headers:{
          ...HEADERS,
          "Prefer":"return=minimal"
        },
        body:JSON.stringify(patch)
      }
    );

    await loadMatches();

  }catch(error){

    console.error(error);

    showToast(
      "Score update failed"
    );
  }
}


/* =========================
   DELETE
========================= */

async function deleteMatch(id){

  if(!confirm("Delete this match?"))
    return;

  try{

    await sb(
      "/matches?id=eq." +
      encodeURIComponent(id),
      {
        method:"DELETE",
        headers:HEADERS
      }
    );

    showToast("Match deleted");

    await loadMatches();

  }catch(error){

    console.error(error);

    showToast(
      "Delete failed"
    );
  }
}


/* =========================
   CREATE MATCH
========================= */

form.onsubmit = async e => {

  e.preventDefault();

  const team1_id =
    Number(
      document.getElementById(
        "team1_id"
      ).value
    );

  const team2_id =
    Number(
      document.getElementById(
        "team2_id"
      ).value
    );

  const seriesValue =
    document.getElementById(
      "series_id"
    ).value.trim();

  const dateValue =
    document.getElementById(
      "date"
    ).value;

  const venue =
    document.getElementById(
      "venue"
    ).value.trim();

  const targetValue =
    document.getElementById(
      "target"
    ).value.trim();

  const status =
    document.getElementById(
      "status"
    ).value;

  const payload = {

    team1_id:team1_id,

    team2_id:team2_id,

    series_id:
      seriesValue
      ? Number(seriesValue)
      : null,

    status:status,

    start_time:
      new Date(
        dateValue
      ).toISOString(),

    venue:
      venue || null,

    target:
      targetValue
      ? Number(targetValue)
      : null,

    team1_score:0,
    team1_wickets:0,
    team1_overs:0,

    team2_score:0,
    team2_wickets:0,
    team2_overs:0
  };

  try{

    await sb(
      "/matches",
      {
        method:"POST",
        headers:{
          ...HEADERS,
          "Prefer":"return=minimal"
        },
        body:JSON.stringify(payload)
      }
    );

    closeModal();

    currentPage =
      "matches";

    document
      .querySelectorAll(".nav-item")
      .forEach(x =>
        x.classList.remove("active")
      );

    document
      .querySelector(
        '.nav-item[data-page="matches"]'
      )
      ?.classList.add("active");

    showToast(
      "Match created in Supabase"
    );

    await loadMatches();

  }catch(error){

    console.error(error);

    showToast(
      "Match create failed: " +
      error.message
    );
  }

};
