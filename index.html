/* =========================================
   TOAST
========================================= */

let toastTimer;

function showToast(text){

  const t = document.getElementById("toast");

  t.textContent = text;
  t.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(()=>{
    t.classList.remove("show");
  },2500);
}


/* =========================================
   HELPERS
========================================= */

function esc(v){

  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function dateFormat(v){

  if(!v) return "Date not set";

  const d = new Date(v);

  if(isNaN(d.getTime()))
    return v;

  return d.toLocaleString([],{
    day:"2-digit",
    month:"short",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}


/* =========================================
   LOAD TEAMS + SERIES
========================================= */

async function loadReferenceData(){

  const [teamsResult,seriesResult] =
    await Promise.all([

      sb
        .from("teams")
        .select("*"),

      sb
        .from("series")
        .select("*")
    ]);


  if(teamsResult.error){

    console.error(
      "Teams error:",
      teamsResult.error
    );

    teamsCache = [];

  }else{

    teamsCache =
      teamsResult.data || [];
  }


  if(seriesResult.error){

    console.error(
      "Series error:",
      seriesResult.error
    );

    seriesCache = [];

  }else{

    seriesCache =
      seriesResult.data || [];
  }
}


/* =========================================
   LOAD MATCHES FROM SUPABASE
========================================= */

async function loadMatches(){

  const {data,error} = await sb
    .from("matches")
    .select("*")
    .order("start_time",{
      ascending:false
    });


  if(error){

    console.error(
      "Matches error:",
      error
    );

    document
      .getElementById("apiStatus")
      .textContent = "API ERROR";

    showToast(
      "Supabase matches error"
    );

    return;
  }


  matches = data || [];


  document
    .getElementById("apiStatus")
    .textContent = "API ACTIVE";


  render();
}


/* =========================================
   TEAM NAME
========================================= */

function teamName(id){

  const team =
    teamsCache.find(
      t => String(t.id) === String(id)
    );


  if(!team)
    return "Team #" + id;


  return (
    team.name ||
    team.team_name ||
    "Team #" + id
  );
}


/* =========================================
   SERIES NAME
========================================= */

function seriesName(id){

  if(!id)
    return "General";


  const series =
    seriesCache.find(
      s => String(s.id) === String(id)
    );


  if(!series)
    return "Series #" + id;


  return (
    series.name ||
    series.series_name ||
    "Series #" + id
  );
}

/* =========================================
   MATCH LIST
========================================= */

function matchList(limit){

  const list =
    limit
      ? matches.slice(0,limit)
      : matches;


  if(!list.length){

    return `

      <div class="empty">

        <div class="empty-icon">
          ⚔
        </div>

        <h3>
          No matches yet
        </h3>

        <p>
          Create your first match.
        </p>

      </div>

    `;
  }


  return `

    <div class="match-list">

      ${list
        .map(matchCard)
        .join("")}

    </div>

  `;
}


/* =========================================
   MATCH CARD
========================================= */

function matchCard(m){

  const cls =
    m.status === "live"
      ? "live"
      : m.status === "ended"
      ? "ended"
      : "upcoming";


  const text =
    m.status === "live"
      ? "LIVE"
      : m.status === "ended"
      ? "ENDED"
      : "UPCOMING";


  const t1 =
    teamName(m.team1_id);


  const t2 =
    teamName(m.team2_id);


  const s1 =
    m.team1_score ?? 0;


  const s2 =
    m.team2_score ?? 0;


  return `

    <div class="match">

      <div class="match-top">

        <div>

          <div class="match-name">

            ${esc(t1)}
            vs
            ${esc(t2)}

          </div>


          <div class="meta">

            ${esc(seriesName(m.series_id))}
            ·
            ${dateFormat(m.start_time)}

          </div>

        </div>


        <span class="badge ${cls}">

          ${text}

        </span>

      </div>


      <div class="score">

        <div class="team">

          ${esc(t1)}

        </div>


        <div class="score-num">

          ${s1}

          <span class="vs">
            VS
          </span>

          ${s2}

        </div>


        <div class="team">

          ${esc(t2)}

        </div>

      </div>


      <div class="actions">

        ${
          m.status !== "ended"
          ?

          `

          <button
            class="btn"
            onclick="changeStatus(
              ${m.id},
              '${m.status}'
            )">

            ${
              m.status === "live"
              ? "End Match"
              : "Start Live"
            }

          </button>

          `

          : ""
        }


        ${
          m.status === "live"
          ?

          `

          <button
            class="btn"
            onclick="addScore(
              ${m.id},
              1
            )">

            + ${esc(t1)}

          </button>


          <button
            class="btn"
            onclick="addScore(
              ${m.id},
              2
            )">

            + ${esc(t2)}

          </button>

          `

          : ""
        }


        <button
          class="btn danger"
          onclick="deleteMatch(${m.id})">

          Delete

        </button>

      </div>

    </div>

  `;
}


/* =========================================
   CHANGE STATUS
========================================= */

async function changeStatus(
  id,
  status
){

  const next =
    status === "upcoming"
      ? "live"
      : "ended";


  const {error} =
    await sb
      .from("matches")
      .update({
        status:next
      })
      .eq("id",id);


  if(error){

    console.error(error);

    showToast(
      "Status update failed"
    );

    return;
  }


  showToast(
    next === "live"
      ? "Match is LIVE"
      : "Match ended"
  );


  await loadMatches();
}


/* =========================================
   ADD SCORE
========================================= */

async function addScore(
  id,
  team
){

  const match =
    matches.find(
      x => String(x.id) === String(id)
    );


  if(
    !match ||
    match.status !== "live"
  )
    return;


  let updateData;


  if(team === 1){

    updateData = {

      team1_score:
        (match.team1_score || 0) + 1

    };

  }else{

    updateData = {

      team2_score:
        (match.team2_score || 0) + 1

    };

  }


  const {error} =
    await sb
      .from("matches")
      .update(updateData)
      .eq("id",id);


  if(error){

    console.error(error);

    showToast(
      "Score update failed"
    );

    return;
  }


  await loadMatches();
}


/* =========================================
   DELETE MATCH
========================================= */

async function deleteMatch(id){

  if(
    !confirm(
      "Delete this match?"
    )
  )
    return;


  const {error} =
    await sb
      .from("matches")
      .delete()
      .eq("id",id);


  if(error){

    console.error(error);

    showToast(
      "Delete failed"
    );

    return;
  }


  showToast(
    "Match deleted"
  );


  await loadMatches();
}

/* =========================================
   CREATE MATCH → SUPABASE
========================================= */

form.onsubmit = async e=>{

  e.preventDefault();


  const team1 =
    document
      .getElementById("team1")
      .value
      .trim();


  const team2 =
    document
      .getElementById("team2")
      .value
      .trim();


  const series =
    document
      .getElementById("series")
      .value
      .trim();


  const t1 =
    teamsCache.find(
      t =>
        String(
          t.name ||
          t.team_name ||
          ""
        ).toLowerCase()
        === team1.toLowerCase()
    );


  const t2 =
    teamsCache.find(
      t =>
        String(
          t.name ||
          t.team_name ||
          ""
        ).toLowerCase()
        === team2.toLowerCase()
    );


  if(!t1 || !t2){

    showToast(
      "Team name Supabase teams table se match nahi hua"
    );

    return;
  }


  let s = null;


  if(series){

    s =
      seriesCache.find(
        x =>
          String(
            x.name ||
            x.series_name ||
            ""
          ).toLowerCase()
          === series.toLowerCase()
      );


    if(!s){

      showToast(
        "Series Supabase series table me nahi mili"
      );

      return;
    }

  }


  const payload = {

    series_id:
      s ? s.id : null,

    team1_id:
      t1.id,

    team2_id:
      t2.id,

    status:
      document
        .getElementById("status")
        .value,

    start_time:
      new Date(
        document
          .getElementById("date")
          .value
      ).toISOString(),

    team1_score:0,
    team1_wickets:0,
    team1_overs:0,

    team2_score:0,
    team2_wickets:0,
    team2_overs:0

  };


  const {error} =
    await sb
      .from("matches")
      .insert(payload);


  if(error){

    console.error(error);

    showToast(
      "Match create failed: " +
      error.message
    );

    return;
  }


  closeModal();


  currentPage =
    "matches";


  setActive(
    "matches"
  );


  showToast(
    "Match created in Supabase"
  );


  await loadMatches();

};
