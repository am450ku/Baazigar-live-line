/* =========================================
   SUPABASE REQUEST
========================================= */

async function supabaseRequest(url, options = {}) {

  const response = await fetch(url, {
    ...options,
    headers: {
      ...HEADERS,
      ...(options.headers || {})
    }
  });

  const text = await response.text();

  let data = null;

  try {
    data = text ? JSON.parse(text) : null;
  } catch {
    data = text;
  }

  if (!response.ok) {
    throw new Error(
      data?.message ||
      data?.hint ||
      data?.error_description ||
      text ||
      "Supabase request failed"
    );
  }

  return data;
}


/* =========================================
   LOAD MATCHES
========================================= */

async function loadMatches() {

  try {

    matches = await supabaseRequest(
      API +
      "?select=*" +
      "&order=created_at.desc"
    );

      matches = [];
    }

    render();

    updateConnection("Connected ✓");

  } catch (error) {

    console.error("Supabase:", error);

    matches = [];

    render();

    updateConnection(
      "Connection failed: " + error.message
    );
  }
}

  toastTimer = setTimeout(() => {

}

  const status =
    document.getElementById("status").value;


  /*
     IMPORTANT:
     Your Supabase matches table uses:
     series_id
     team1_id
     team2_id

     Therefore the existing text names cannot
     directly be stored in those columns.

     For now we save the match only when the
     corresponding IDs are available.
  */

  const team1Id = prompt(
    "Enter Team 1 UUID (team1_id):"
  );

  if (!team1Id) {
    showToast("Team 1 ID required");
    return;
  }

  const team2Id = prompt(
    "Enter Team 2 UUID (team2_id):"
  );

  if (!team2Id) {
    showToast("Team 2 ID required");
    return;
  }

  let seriesId = null;

  if (series) {

    seriesId = prompt(
      "Enter Series UUID (series_id), or Cancel for none:"
    );

  }


  const payload = {

    team1_id: team1Id,
    team2_id: team2Id,

    series_id: seriesId || null,

    status: status,

    start_time: date
      ? new Date(date).toISOString()
      : new Date().toISOString(),

    venue: null,

    target: null,

    team1_score: 0,

    team1_wickets: 0,

    team1_overs: 0,

    team2_score: 0,

    team2_wickets: 0,

    team2_overs: 0

  };


  try {

    await supabaseRequest(API, {
      method: "POST",
      body: JSON.stringify(payload)
    });

    closeModal();

    currentPage = "matches";

    setActive("matches");

    await loadMatches();

    showToast(
      "Match saved to Supabase ✓"
    );

  } catch (error) {

    console.error(error);

    showToast(
      "Save failed: " + error.message
    );

  }

};


/* =========================================
   HELPERS
========================================= */

function esc(v) {

  return String(v ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

function dateFormat(v) {

  if (!v) return "Date not set";

  const d = new Date(v);

  if (isNaN(d.getTime())) {
    return v;
  }

  return d.toLocaleString([], {
    day: "2-digit",
    month: "short",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });

}

/* =========================================

========================================= */

function matchList(limit) {

  const list = limit
    ? matches.slice(0, limit)
    : matches;


  if (!list.length) {

    return `

      <div class="empty">

        <div class="empty-icon">
          ⚔
        </div>

        <h3>
          No matches yet

  }


  return `

    <div class="match-list">

      ${list.map(matchCard).join("")}

    </div>

  `;

}


/* =========================================

========================================= */

function matchCard(m) {

  const text =

      : "UPCOMING";


  return `

    <div class="match">

      <div class="match-top">

        <div>

          <div class="match-name">

            ${esc(
              "Team " +
              String(m.team1_id || "").slice(0, 8) +
              " vs " +
              String(m.team2_id || "").slice(0, 8)
            )}

          </div>

          <div class="meta">

            ${esc(m.venue || "Venue not set")}
            ·
            ${dateFormat(m.start_time)}

          </div>

        </div>


        <span class="badge ${cls}">
          ${text}
        </span>

      </div>


      <div class="score">

        <div class="team">
          Team 1
        </div>


        <div class="score-num">

          ${m.team1_score ?? 0}

          <span class="vs">
            VS
          </span>

          ${m.team2_score ?? 0}

        </div>


        <div class="team">
          Team 2
        </div>

      </div>


      <div class="actions">


        ${
          m.status !== "ended"
          ? `

            <button
              class="btn"
              onclick="changeStatus('${esc(m.id)}')">

              ${
                m.status === "live"
                  ? "End Match"
                  : "Start Live"
              }

            </button>

          `
          : ""
        }


        ${
          m.status === "live"
          ? `

            <button
              class="btn"
              onclick="addScore('${esc(m.id)}',1)">

              + Team 1

            </button>


            <button
              class="btn"
              onclick="addScore('${esc(m.id)}',2)">

              + Team 2

            </button>

          `
          : ""
        }


        <button
          class="btn danger"
          onclick="deleteMatch('${esc(m.id)}')">

          Delete

        </button>

      </div>

    </div>

  `;

}


/* =========================================
   UPDATE STATUS
========================================= */

async function changeStatus(id) {

  const m =
    matches.find(x => String(x.id) === String(id));

  if (!m) return;


  let newStatus;

  if (m.status === "upcoming") {
    newStatus = "live";
  }
  else if (m.status === "live") {
    newStatus = "ended";
  }
  else {
    return;
  }


  try {

    await supabaseRequest(
      API + "?id=eq." + encodeURIComponent(id),
      {
        method: "PATCH",
        body: JSON.stringify({
          status: newStatus
        })
      }
    );


    await loadMatches();

    showToast(
      newStatus === "live"
        ? "Match is LIVE ✓"
        : "Match ended ✓"
    );

  } catch (error) {

    showToast(
      "Update failed: " + error.message
    );

  }

}


/* =========================================
   SCORE UPDATE
========================================= */

async function addScore(id, team) {

  const m =
    matches.find(x => String(x.id) === String(id));

  if (!m || m.status !== "live") return;


  const field =
    team === 1
      ? "team1_score"
      : "team2_score";


  const current =
    Number(m[field] || 0);


  try {

    await supabaseRequest(
      API + "?id=eq." + encodeURIComponent(id),
      {
        method: "PATCH",
        body: JSON.stringify({
          [field]: current + 1
        })
      }
    );


    await loadMatches();

  } catch (error) {

    showToast(
      "Score update failed: " +
      error.message
    );

  }

}


/* =========================================
   DELETE
========================================= */

async function deleteMatch(id) {

  if (!confirm("Delete this match?")) {
    return;
  }


  try {

    await supabaseRequest(
      API + "?id=eq." + encodeURIComponent(id),
      {
        method: "DELETE"
      }
    );


    await loadMatches();

    showToast(
      "Match deleted ✓"
    );

  } catch (error) {

    showToast(
      "Delete failed: " +
      error.message
    );

  }

}
