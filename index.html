<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BAAZIGAR LIVE LINE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0d0f11;
  color:#f4f4f4;
  min-height:100vh;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

:root{
  --green:#b6ff00;
  --bg:#0d0f11;
  --card:#17191d;
  --border:#30343b;
  --muted:#9da1a8;
}

.header{
  height:88px;
  border-bottom:1px solid #292c31;
  display:flex;
  align-items:center;
  padding:0 25px;
  gap:20px;
  position:sticky;
  top:0;
  z-index:20;
  background:#0d0f11;
}

.logo{
  font-size:25px;
  font-weight:800;
}

.logo span{
  color:var(--green);
}

.menu-btn{
  width:50px;
  height:50px;
  border:1px solid #353a42;
  border-radius:14px;
  background:#171a1e;
  color:white;
  font-size:27px;
}

.status{
  margin-left:auto;
  border:1px solid #6b9400;
  color:var(--green);
  border-radius:12px;
  padding:13px 18px;
  font-weight:800;
}

.layout{
  display:flex;
}

.sidebar{
  position:fixed;
  top:88px;
  left:-290px;
  width:270px;
  height:calc(100vh - 88px);
  background:#15171a;
  border-right:1px solid #30343a;
  z-index:30;
  padding:25px 15px;
  transition:.25s;
}

.sidebar.open{
  left:0;
}

.overlay{
  position:fixed;
  inset:88px 0 0 0;
  background:rgba(0,0,0,.65);
  display:none;
  z-index:25;
}

.overlay.show{
  display:block;
}

.nav-item{
  width:100%;
  padding:15px;
  border-radius:10px;
  color:#aeb2b8;
  margin-bottom:8px;
  cursor:pointer;
  font-weight:700;
}

.nav-item:hover,
.nav-item.active{
  background:#22251d;
  color:var(--green);
}

.logout{
  color:#ff7070;
}

main{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:38px 25px 100px;
}

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  margin-bottom:30px;
}

.title{
  font-size:44px;
  font-weight:900;
}

.desc{
  color:#a5a9af;
  font-size:18px;
  margin-top:8px;
}

.updated{
  color:#92969d;
  font-size:12px;
  text-align:right;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:28px;
}

.stat,
.section,
.card,
.match{
  background:#17191d;
  border:1px solid var(--border);
  border-radius:18px;
}

.stat{
  padding:22px;
}

.stat-top{
  color:#a7abb0;
  font-size:13px;
  font-weight:800;
  display:flex;
  justify-content:space-between;
}

.stat-icon{
  color:var(--green);
}

.num{
  font-size:42px;
  font-weight:900;
  margin-top:12px;
}

.section{
  padding:22px;
  margin-bottom:20px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.section-title{
  font-size:24px;
  font-weight:800;
}

.btn{
  border:1px solid #3a3f46;
  background:#202328;
  color:white;
  padding:11px 16px;
  border-radius:10px;
  font-weight:700;
}

.btn:hover{
  border-color:var(--green);
}

.btn.primary{
  background:var(--green);
  color:#101300;
  border-color:var(--green);
}

.btn.danger{
  color:#ff7777;
}

.match-list{
  display:grid;
  gap:15px;
}

.match{
  padding:20px;
}

.match-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.match-name{
  font-size:20px;
  font-weight:800;
}

.meta{
  color:#9499a0;
  margin-top:7px;
  font-size:14px;
}

.badge{
  height:max-content;
  padding:7px 11px;
  border-radius:20px;
  font-size:12px;
  font-weight:900;
}

.badge.live{
  background:#243500;
  color:var(--green);
}

.badge.upcoming{
  background:#24272c;
  color:#d6d8dc;
}

.badge.ended{
  background:#321e1e;
  color:#ff8b8b;
}

.score{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:20px;
  padding:22px 0;
}

.team{
  font-size:18px;
  font-weight:800;
}

.team:last-child{
  text-align:right;
}

.score-num{
  font-size:28px;
  font-weight:900;
}

.vs{
  color:#777c83;
  font-size:11px;
  margin:0 8px;
}

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.empty{
  text-align:center;
  padding:55px 20px;
  color:#9da1a8;
}

.empty-icon{
  font-size:40px;
  margin-bottom:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.card{
  padding:24px;
}

.card h3{
  font-size:21px;
  margin-bottom:10px;
}

.card p{
  color:#a3a7ad;
  line-height:1.6;
  word-break:break-word;
}

.green{
  color:var(--green);
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(560px,100%);
  background:#181a1e;
  border:1px solid #383c43;
  border-radius:20px;
  padding:25px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-head h2{
  font-size:25px;
}

.close{
  background:none;
  border:0;
  color:#aaa;
  font-size:30px;
}

label{
  display:block;
  color:#b4b8bd;
  font-size:13px;
  font-weight:800;
  margin:15px 0 7px;
}

input,
select{
  width:100%;
  padding:14px;
  background:#0f1114;
  border:1px solid #393e45;
  color:white;
  border-radius:10px;
  outline:none;
}

input:focus,
select:focus{
  border-color:var(--green);
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:22px;
}

.modal-actions .btn{
  flex:1;
}

#toast{
  position:fixed;
  left:50%;
  bottom:30px;
  transform:translateX(-50%) translateY(20px);
  background:#f2f2f2;
  color:#111;
  padding:14px 20px;
  border-radius:12px;
  font-weight:800;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:200;
  max-width:90%;
  text-align:center;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.loading{
  padding:50px;
  text-align:center;
  color:#a3a7ad;
}

@media(max-width:800px){

  .header{
    padding:0 15px;
  }

  .logo{
    font-size:19px;
  }

  .status{
    padding:10px 12px;
    font-size:12px;
  }

  main{
    padding:28px 15px 100px;
  }

  .title{
    font-size:36px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .grid{
    grid-template-columns:1fr;
  }

  .score{
    grid-template-columns:1fr;
    text-align:center;
  }

  .team:last-child{
    text-align:center;
  }

  .updated{
    display:none;
  }
}

@media(max-width:500px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .stat{
    padding:16px;
  }

  .num{
    font-size:32px;
  }

  .page-head{
    display:block;
  }

  .page-head > button{
    margin-top:18px;
  }
}
</style>
</head>

<body>

<header class="header">

  <button class="menu-btn" id="menuBtn">
    ☰
  </button>

  <div class="logo">
    BAAZIGAR <span>LIVE LINE</span>
  </div>

  <div class="status" id="headerStatus">
    ● API CONNECTING
  </div>

</header>


<div class="overlay" id="overlay"></div>


<aside class="sidebar" id="sidebar">

  <div class="nav-item active" data-page="dashboard">
    ▦ &nbsp; Dashboard
  </div>

  <div class="nav-item" data-page="matches">
    ⚔ &nbsp; Matches
  </div>

  <div class="nav-item" data-page="series">
    ▤ &nbsp; Series
  </div>

  <div class="nav-item" data-page="teams">
    ◈ &nbsp; Teams
  </div>

  <div class="nav-item" data-page="players">
    ◎ &nbsp; Players
  </div>

  <div class="nav-item" data-page="api">
    ◆ &nbsp; API
  </div>

  <div class="nav-item" data-page="users">
    ◉ &nbsp; Users
  </div>

  <div class="nav-item" data-page="settings">
    ⚙ &nbsp; Settings
  </div>

  <div class="nav-item logout" id="logout">
    ⇥ &nbsp; Logout
  </div>

</aside>


<main id="app">
  <div class="loading">
    Connecting to Supabase...
  </div>
</main>


<!-- NEW MATCH MODAL -->

<div class="modal" id="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2>Create New Match</h2>

      <button class="close" id="close">
        ×
      </button>

    </div>


    <form id="form">

      <label for="team1">
        Team 1
      </label>

      <select id="team1" required>
        <option value="">
          Select Team 1
        </option>
      </select>


      <label for="team2">
        Team 2
      </label>

      <select id="team2" required>
        <option value="">
          Select Team 2
        </option>
      </select>


      <label for="series">
        Series
      </label>

      <select id="series">
        <option value="">
          General / No Series
        </option>
      </select>


      <label for="status">
        Status
      </label>

      <select id="status">
        <option value="upcoming">
          Upcoming
        </option>

        <option value="live">
          Live
        </option>

        <option value="ended">
          Ended
        </option>
      </select>


      <label for="date">
        Start Date & Time
      </label>

      <input
        id="date"
        type="datetime-local"
        required
      >


      <div class="modal-actions">

        <button
          type="button"
          class="btn"
          id="cancel">

          Cancel

        </button>

        <button
          type="submit"
          class="btn primary">

          Create Match

        </button>

      </div>

    </form>

  </div>

</div>


<div id="toast"></div>


<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://lzvwictzhtfbdbgvekuq.supabase.co";

/*
  Tumhari Supabase PUBLISHABLE KEY
*/
const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_6fB6vZhG9yFHmfGdCs5lcw_m9Z6xVP9";


const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   STATE
========================================================= */

let matches = [];
let teamsCache = [];
let seriesCache = [];

let currentPage = "dashboard";

let toastTimer;


/* =========================================================
   DOM
========================================================= */

const app =
  document.getElementById("app");

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

const modal =
  document.getElementById("modal");

const form =
  document.getElementById("form");

const headerStatus =
  document.getElementById("headerStatus");


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(()=>{

      toast.classList.remove("show");

    },3000);
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================================================
   DATE
========================================================= */

function dateFormat(value){

  if(!value)
    return "Date not set";

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  )
    return String(value);

  return date.toLocaleString(
    [],
    {
      day:"2-digit",
      month:"short",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


/* =========================================================
   OPEN / CLOSE SIDEBAR
========================================================= */

document
  .getElementById("menuBtn")
  .addEventListener(
    "click",
    ()=>{

      sidebar.classList.add("open");

      overlay.classList.add("show");

    }
  );


overlay.addEventListener(
  "click",
  ()=>{

    sidebar.classList.remove("open");

    overlay.classList.remove("show");

  }
);


/* =========================================================
   MODAL
========================================================= */

function openModal(){

  fillFormOptions();

  modal.classList.add("show");

}


function closeModal(){

  modal.classList.remove("show");

  form.reset();

}


document
  .getElementById("close")
  .addEventListener(
    "click",
    closeModal
  );


document
  .getElementById("cancel")
  .addEventListener(
    "click",
    closeModal
  );


modal.addEventListener(
  "click",
  event=>{

    if(event.target === modal){

      closeModal();

    }

  }
);


/* =========================================================
   NAVIGATION
========================================================= */

document
  .querySelectorAll(".nav-item[data-page]")
  .forEach(item=>{

    item.addEventListener(
      "click",
      ()=>{

        currentPage =
          item.dataset.page;

        setActive(currentPage);

        sidebar.classList.remove("open");

        overlay.classList.remove("show");

        render();

      }
    );

  });


function setActive(page){

  document
    .querySelectorAll(
      ".nav-item[data-page]"
    )
    .forEach(item=>{

      item.classList.toggle(
        "active",
        item.dataset.page === page
      );

    });

}


/* =========================================================
   TEAM NAME
========================================================= */

function teamName(id){

  const team =
    teamsCache.find(
      item =>
        String(item.id) === String(id)
    );

  if(!team)
    return "Team #" + id;

  return (
    team.name ||
    team.team_name ||
    team.title ||
    "Team #" + id
  );
}


/* =========================================================
   SERIES NAME
========================================================= */

function seriesName(id){

  if(!id)
    return "General";

  const series =
    seriesCache.find(
      item =>
        String(item.id) === String(id)
    );

  if(!series)
    return "Series #" + id;

  return (
    series.name ||
    series.series_name ||
    series.title ||
    "Series #" + id
  );
}


/* =========================================================
   LOAD TEAMS + SERIES
========================================================= */

async function loadReferenceData(){

  const [
    teamsResult,
    seriesResult
  ] = await Promise.all([

    sb
      .from("teams")
      .select("*"),

    sb
      .from("series")
      .select("*")

  ]);


  if(teamsResult.error){

    console.error(
      "Teams error:",
      teamsResult.error
    );

    teamsCache = [];

  }else{

    teamsCache =
      teamsResult.data || [];

  }


  if(seriesResult.error){

    console.error(
      "Series error:",
      seriesResult.error
    );

    seriesCache = [];

  }else{

    seriesCache =
      seriesResult.data || [];

  }


  fillFormOptions();

}


/* =========================================================
   FORM OPTIONS
========================================================= */

function fillFormOptions(){

  const team1 =
    document.getElementById("team1");

  const team2 =
    document.getElementById("team2");

  const series =
    document.getElementById("series");


  if(!team1 || !team2 || !series)
    return;


  team1.innerHTML =
    `<option value="">Select Team 1</option>`;


  team2.innerHTML =
    `<option value="">Select Team 2</option>`;


  series.innerHTML =
    `<option value="">General / No Series</option>`;


  teamsCache.forEach(team=>{

    const name =
      team.name ||
      team.team_name ||
      team.title ||
      ("Team #" + team.id);


    const option1 =
      document.createElement("option");

    option1.value = team.id;

    option1.textContent = name;

    team1.appendChild(option1);


    const option2 =
      document.createElement("option");

    option2.value = team.id;

    option2.textContent = name;

    team2.appendChild(option2);

  });


  seriesCache.forEach(item=>{

    const name =
      item.name ||
      item.series_name ||
      item.title ||
      ("Series #" + item.id);


    const option =
      document.createElement("option");

    option.value = item.id;

    option.textContent = name;

    series.appendChild(option);

  });

}


/* =========================================================
   LOAD MATCHES
========================================================= */

async function loadMatches(){

  const result =
    await sb
      .from("matches")
      .select("*")
      .order(
        "start_time",
        {
          ascending:false
        }
      );


  if(result.error){

    console.error(
      "Matches error:",
      result.error
    );

    setAPIStatus(false);

    app.innerHTML = `

      <div class="card">

        <h3>
          Supabase Error
        </h3>

        <p>
          ${esc(result.error.message)}
        </p>

        <p style="margin-top:10px">
          Check Supabase RLS policies and
          table permissions.
        </p>

      </div>

    `;

    showToast(
      "Supabase connection error"
    );

    return;

  }


  matches =
    result.data || [];


  setAPIStatus(true);

  render();

}


/* =========================================================
   API STATUS
========================================================= */

function setAPIStatus(active){

  if(active){

    headerStatus.textContent =
      "● API ACTIVE";

    headerStatus.style.color =
      "var(--green)";

  }else{

    headerStatus.textContent =
      "● API ERROR";

    headerStatus.style.color =
      "#ff7070";

  }

}


/* =========================================================
   DASHBOARD
========================================================= */

function dashboard(){

  const live =
    matches.filter(
      m => m.status === "live"
    ).length;


  const upcoming =
    matches.filter(
      m => m.status === "upcoming"
    ).length;


  const activeSeries =
    new Set(
      matches
        .map(
          m => m.series_id
        )
        .filter(Boolean)
    ).size;


  return `

    <div class="page-head">

      <div>

        <div class="title">
          Overview
        </div>

        <div class="desc">
          BAAZIGAR LIVE LINE control center
        </div>

      </div>

      <div class="updated">

        LAST UPDATED<br>

        ${new Date().toLocaleTimeString()}

      </div>

    </div>


    <div class="stats">

      <div class="stat">

        <div class="stat-top">
          TOTAL MATCHES
          <span class="stat-icon">⚔</span>
        </div>

        <div class="num">
          ${matches.length}
        </div>

      </div>


      <div class="stat">

        <div class="stat-top">
          LIVE MATCHES
          <span class="stat-icon">●</span>
        </div>

        <div class="num">
          ${live}
        </div>

      </div>


      <div class="stat">

        <div class="stat-top">
          UPCOMING
          <span class="stat-icon">▣</span>
        </div>

        <div class="num">
          ${upcoming}
        </div>

      </div>


      <div class="stat">

        <div class="stat-top">
          ACTIVE SERIES
          <span class="stat-icon">▤</span>
        </div>

        <div class="num">
          ${activeSeries}
        </div>

      </div>

    </div>


    <div class="section">

      <div class="section-head">

        <div class="section-title">
          Recent Matches
        </div>

        <button
          class="btn primary"
          id="dashboardNewMatch">

          + New Match

        </button>

      </div>

      ${matchList(5)}

    </div>

  `;

}


/* =========================================================
   MATCHES PAGE
========================================================= */

function matchesPage(){

  return `

    <div class="page-head">

      <div>

        <div class="title">
          Matches
        </div>

        <div class="desc">
          Create, manage and update live matches.
        </div>

      </div>

      <button
        class="btn primary"
        id="matchesNewMatch">

        + New Match

      </button>

    </div>


    <div class="section">

      ${matchList()}

    </div>

  `;

}


/* =========================================================
   MATCH LIST
========================================================= */

function matchList(limit){

  const list =
    limit
      ? matches.slice(0,limit)
      : matches;


  if(!list.length){

    return `

      <div class="empty">

        <div class="empty-icon">
          ⚔
        </div>

        <h3>
          No matches yet
        </h3>

        <p>
          Create your first match.
        </p>

      </div>

    `;

  }


  return `

    <div class="match-list">

      ${list
        .map(matchCard)
        .join("")}

    </div>

  `;

}


/* =========================================================
   MATCH CARD
========================================================= */

function matchCard(match){

  const status =
    match.status || "upcoming";


  const cls =
    status === "live"
      ? "live"
      : status === "ended"
      ? "ended"
      : "upcoming";


  const statusText =
    status === "live"
      ? "LIVE"
      : status === "ended"
      ? "ENDED"
      : "UPCOMING";


  const t1 =
    teamName(match.team1_id);


  const t2 =
    teamName(match.team2_id);


  const s1 =
    Number(match.team1_score || 0);


  const s2 =
    Number(match.team2_score || 0);


  return `

    <div class="match">

      <div class="match-top">

        <div>

          <div class="match-name">

            ${esc(t1)}
            vs
            ${esc(t2)}

          </div>

          <div class="meta">

            ${esc(
              seriesName(match.series_id)
            )}

            ·

            ${esc(
              dateFormat(match.start_time)
            )}

          </div>

        </div>


        <span class="badge ${cls}">

          ${statusText}

        </span>

      </div>


      <div class="score">

        <div class="team">
          ${esc(t1)}
        </div>


        <div class="score-num">

          ${s1}

          <span class="vs">
            VS
          </span>

          ${s2}

        </div>


        <div class="team">
          ${esc(t2)}
        </div>

      </div>


      <div class="actions">

        ${
          status !== "ended"
          ?

          `

          <button
            class="btn"
            onclick="changeStatus(
              '${esc(match.id)}',
              '${esc(status)}'
            )">

            ${
              status === "live"
              ? "End Match"
              : "Start Live"
            }

          </button>

          `
          : ""
        }


        ${
          status === "live"
          ?

          `

          <button
            class="btn"
            onclick="addScore(
              '${esc(match.id)}',
              1
            )">

            + ${esc(t1)}

          </button>


          <button
            class="btn"
            onclick="addScore(
              '${esc(match.id)}',
              2
            )">

            + ${esc(t2)}

          </button>

          `
          : ""
        }


        <button
          class="btn danger"
          onclick="deleteMatch(
            '${esc(match.id)}'
          )">

          Delete

        </button>

      </div>

    </div>

  `;

}


/* =========================================================
   CHANGE STATUS
========================================================= */

async function changeStatus(
  id,
  currentStatus
){

  const nextStatus =
    currentStatus === "upcoming"
      ? "live"
      : "ended";


  const result =
    await sb
      .from("matches")
      .update({
        status:nextStatus
      })
      .eq("id",id);


  if(result.error){

    console.error(result.error);

    showToast(
      "Status update failed: " +
      result.error.message
    );

    return;

  }


  showToast(
    nextStatus === "live"
      ? "Match is LIVE"
      : "Match ended"
  );


  await loadMatches();

}


/* =========================================================
   SCORE
========================================================= */

async function addScore(
  id,
  team
){

  const match =
    matches.find(
      item =>
        String(item.id) === String(id)
    );


  if(!match)
    return;


  if(match.status !== "live"){

    showToast(
      "Match is not LIVE"
    );

    return;

  }


  const updateData =
    team === 1

      ?

      {
        team1_score:
          Number(match.team1_score || 0) + 1
      }

      :

      {
        team2_score:
          Number(match.team2_score || 0) + 1
      };


  const result =
    await sb
      .from("matches")
      .update(updateData)
      .eq("id",id);


  if(result.error){

    console.error(result.error);

    showToast(
      "Score update failed: " +
      result.error.message
    );

    return;

  }


  await loadMatches();

}


/* =========================================================
   DELETE MATCH
========================================================= */

async function deleteMatch(id){

  if(
    !confirm(
      "Delete this match?"
    )
  )
    return;


  const result =
    await sb
      .from("matches")
      .delete()
      .eq("id",id);


  if(result.error){

    console.error(result.error);

    showToast(
      "Delete failed: " +
      result.error.message
    );

    return;

  }


  showToast(
    "Match deleted"
  );


  await loadMatches();

}

/* =========================================================
   CREATE MATCH
========================================================= */

form.addEventListener(
  "submit",
  async event=>{

    event.preventDefault();


    const team1Id =
      document
        .getElementById("team1")
        .value;


    const team2Id =
      document
        .getElementById("team2")
        .value;


    const seriesId =
      document
        .getElementById("series")
        .value;


    const status =
      document
        .getElementById("status")
        .value;


    const dateValue =
      document
        .getElementById("date")
        .value;


    if(!team1Id || !team2Id){

      showToast(
        "Please select both teams"
      );

      return;

    }


    if(team1Id === team2Id){

      showToast(
        "Team 1 and Team 2 cannot be same"
      );

      return;

    }


    if(!dateValue){

      showToast(
        "Please select start date"
      );

      return;

    }


    const payload = {

      team1_id:
        team1Id,

      team2_id:
        team2Id,

      series_id:
        seriesId || null,

      status:
        status,

      start_time:
        new Date(
          dateValue
        ).toISOString(),

      team1_score:
        0,

      team1_wickets:
        0,

      team1_overs:
        0,

      team2_score:
        0,

      team2_wickets:
        0,

      team2_overs:
        0

    };


    const result =
      await sb
        .from("matches")
        .insert(payload);


    if(result.error){

      console.error(
        "Create match error:",
        result.error
      );

      showToast(
        "Match create failed: " +
        result.error.message
      );

      return;

    }


    closeModal();


    currentPage =
      "matches";

    setActive(
      "matches"
    );


    showToast(
      "Match created successfully"
    );


    await loadMatches();

  }
);

/* =========================================================
   REALTIME
========================================================= */

function setupRealtime(){

  try{

    sb
      .channel("matches-live-channel")

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"matches"
        },
        ()=>{
          loadMatches();
        }
      )

      .subscribe();

  }catch(error){

    console.error(
      "Realtime error:",
      error
    );

  }

}


/* =========================================================
   START APPLICATION
========================================================= */

(async function startApp(){

  try{

    render();

    await loadReferenceData();

    await loadMatches();

    setupRealtime();

  }catch(error){

    console.error(
      "START ERROR:",
      error
    );

    setAPIStatus(false);

    app.innerHTML = `

      <div class="card">

        <h3>
          Application Error
        </h3>

        <p>
          ${esc(error.message)}
        </p>

      </div>

    `;

    showToast(
      "Application failed to start"
    );

  }

})();
</script>
