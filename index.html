<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BAAZIGAR LIVE — Admin Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">

<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        bg:"#121317",
        panel:"#1e1f24",
        panel2:"#292a2e",
        line:"#343539",
        text:"#e3e2e7",
        muted:"#c3caac",
        neon:"#b8f600",
        danger:"#ff4d4d"
      }
    }
  }
}
</script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#121317;
  color:#e3e2e7;
  font-family:Inter,sans-serif;
}
.material-symbols-outlined{
  font-size:22px;
  vertical-align:middle;
}
button,a{transition:.18s}
.card{
  background:#1e1f24;
  border:1px solid #343539;
  border-radius:8px;
}
.input{
  width:100%;
  background:#121317;
  border:1px solid #434933;
  color:#fff;
  padding:12px;
  border-radius:6px;
  outline:none;
}
.input:focus{
  border-color:#b8f600;
}
.btn{
  background:#b8f600;
  color:#141f00;
  font-weight:800;
  padding:11px 16px;
  border-radius:6px;
}
.btn:hover{background:#a1d800}
.btn-dark{
  background:#292a2e;
  border:1px solid #434933;
  color:#e3e2e7;
  padding:10px 15px;
  border-radius:6px;
}
.btn-danger{
  background:#421b1d;
  color:#ffb4ab;
  border:1px solid #71383a;
  padding:9px 13px;
  border-radius:6px;
}
.nav-active{
  background:rgba(184,246,0,.10);
  color:#b8f600;
  border-left:4px solid #b8f600;
}
.page{display:none}
.page.active{display:block}
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.overlay.show{display:flex}
.modal{
  width:100%;
  max-width:520px;
  background:#1e1f24;
  border:1px solid #434933;
  border-radius:10px;
  padding:24px;
}
@media(max-width:800px){
  aside{transform:translateX(-100%);transition:.2s}
  aside.open{transform:translateX(0)}
  main{margin-left:0!important}
  header{left:0!important}
  .mobile-menu{display:block!important}
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<aside id="sidebar"
class="fixed left-0 top-0 bottom-0 z-50 w-[260px] bg-[#0d0e12] border-r border-[#343539] flex flex-col">

<div class="p-6">
  <div class="text-xl font-black tracking-tight text-white">
    BAAZIGAR LIVE LINE
  </div>
  <div class="text-xs font-bold tracking-widest text-[#c3caac] mt-2">
    ADMIN CONTROL PANEL
  </div>
</div>

<div class="px-5 mb-5">
  <button onclick="openNewMatch()" class="btn w-full flex items-center justify-center gap-2">
    <span class="material-symbols-outlined">add</span>
    New Match
  </button>
</div>

<nav class="flex-1 overflow-y-auto">

<a onclick="showPage('dashboard')" data-page="dashboard"
class="nav flex items-center gap-3 px-6 py-3 cursor-pointer nav-active">
<span class="material-symbols-outlined">dashboard</span>
Dashboard
</a>

<a onclick="showPage('matches')" data-page="matches"
class="nav flex items-center gap-3 px-6 py-3 cursor-pointer text-[#c3caac] hover:bg-[#292a2e]">
<span class="material-symbols-outlined">sports_cricket</span>
Match Management
</a>

<a onclick="showPage('series')" data-page="series"
class="nav flex items-center gap-3 px-6 py-3 cursor-pointer text-[#c3caac] hover:bg-[#292a2e]">
<span class="material-symbols-outlined">event_note</span>
Series
</a>

<a onclick="showPage('teams')" data-page="teams"

<span class
