<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Match Management - BAAZIGAR LIVE</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            colors: {
                primary: '#b8f600',
                'primary-container': '#b8f600',
                'on-primary-container': '#172000',
                'primary-fixed': '#b8f600',
                'primary-fixed-dim': '#9bce00',
                background: '#10140b',
                'on-background': '#e2e4d8',
                surface: '#10140b',
                'surface-container-low': '#181c13',
                'surface-container': '#1c2017',
                'surface-container-high': '#262a21',
                'surface-container-highest': '#30342b',
                'on-surface': '#e2e4d8',
                'on-surface-variant': '#c2c8b5',
                'border-subtle': '#363a30'
            },
            fontFamily: {
                headline: ['Space Grotesk', 'sans-serif'],
                body: ['Inter', 'sans-serif'],
                label: ['Inter', 'sans-serif']
            }
        }
    }
}
</script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script defer="" src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
.font-headline-md {
    font-family: 'Space Grotesk', sans-serif;
}
.font-body-md {
    font-family: 'Inter', sans-serif;
}
.font-label-caps {
    font-family: 'Inter', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.08em;
}
</style>
</head>

<body class="bg-background text-on-background min-h-screen flex" x-data="matchManagement">

<!-- Sidebar -->
<aside class="w-64 bg-surface-container-low border-r border-border-subtle min-h-screen flex flex-col">
    <div class="p-6 border-b border-border-subtle">
        <div class="font-headline-md text-xl font-bold text-primary">BAAZIGAR LIVE</div>
        <div class="text-xs text-on-surface-variant mt-1">ADMIN PANEL</div>
    </div>

    <nav class="flex-1 p-4">
        <a class="flex items-center gap-3 px-4 py-3 rounded text-on-surface-variant hover:bg-surface-container hover:text-primary transition-colors" href="#">
            <span class="material-symbols-outlined">dashboard</span>
            Dashboard
        </a>
        <a class="flex items-center gap-3 px-4 py-3 rounded bg-surface-container text-primary transition-colors" href="#">
            <span class="material-symbols-outlined">sports_cricket</span>
            Match Management
        </a>
        <a class="flex items-center gap-3 px-4 py-3 rounded text-on-surface-variant hover:bg-surface-container hover:text-primary transition-colors" href="#">
            <span class="material-symbols-outlined">group</span>
            Teams
        </a>
        <a class="flex items-center gap-3 px-4 py-3 rounded text-on-surface-variant hover:bg-surface-container hover:text-primary transition-colors" href="#">
            <span class="material-symbols-outlined">emoji_events</span>
            Tournaments
        </a>
        <a class="flex items-center gap-3 px-4 py-3 rounded text-on-surface-variant hover:bg-surface-container hover:text-primary transition-colors" href="#">
            <span class="material-symbols-outlined">stadium</span>
            Venues
        </a>
    </nav>

    <div class="p-4 border-t border-border-subtle">
        <button class="flex items-center gap-3 px-4 py-3 w-full rounded text-on-surface-variant hover:bg-surface-container hover:text-primary transition-colors">
            <span class="material-symbols-outlined">settings</span>
            Settings
        </button>
        <button class="flex items-center gap-3 px-4 py-3 w-full rounded text-on-surface-variant hover:bg-surface-container hover:text-primary transition-colors">
            <span class="material-symbols-outlined">logout</span>
            Logout
        </button>
    </div>
</aside>

<!-- Main -->
<main class="flex-1 min-w-0">
    <header class="h-20 border-b border-border-subtle bg-surface flex items-center justify-between px-8">
        <div>
            <h1 class="font-headline-md text-2xl font-semibold text-on-surface">Match Management</h1>
            <p class="text-sm text-on-surface-variant mt-1">Create, edit and manage live matches.</p>
        </div>

        <button @click="openModal('add')" class="w-full max-w-xs bg-primary-container text-on-primary-container hover:bg-primary-fixed-dim font-headline-md py-3 px-4 rounded flex items-center justify-center gap-2 transition-colors duration-200 ease-in-out">
            <span class="material-symbols-outlined">add</span>
            Add New Match
        </button>
    </header>

    <section class="p-8">
        <div class="flex flex-col lg:flex-row gap-4 mb-6">
            <div class="flex-1 relative">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
                <input
                    class="w-full bg-surface-container-low border border-border-subtle rounded text-on-surface text-sm pl-10 pr-3 py-3 focus:border-primary-fixed focus:ring-0"
                    placeholder="Search matches..."
                    type="text"
                    x-model="searchQuery"
                />
            </div>

            <select
                class="bg-surface-container-low border border-border-subtle rounded text-on-surface text-sm px-3 py-3 focus:border-primary-fixed focus:ring-0"
                x-model="filters.status"
            >
                <option value="">All Status</option>
                <option value="LIVE">LIVE</option>
                <option value="UPCOMING">UPCOMING</option>
                <option value="DELAYED">DELAYED</option>
                <option value="COMPLETED">COMPLETED</option>
                <option value="ABANDONED">ABANDONED</option>
            </select>

            <select
                class="bg-surface-container-low border border-border-subtle rounded text-on-surface text-sm px-3 py-3 focus:border-primary-fixed focus:ring-0"
                x-model="filters.tournament"
            >
                <option value="">All Tournaments</option>
                <option value="T20 World Cup">T20 World Cup</option>
                <option value="Indian Premier League">Indian Premier League</option>
            </select>

            <input
                class="bg-surface-container-low border border-border-subtle rounded text-on-surface text-sm px-3 py-3 focus:border-primary-fixed focus:ring-0"
                type="date"
                x-model="filters.date"
            />
        </div>

        <div class="bg-surface-container-low border border-border-subtle rounded overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-surface-container">
                        <tr>
                            <th class="text-left px-5 py-4 font-label-caps text-xs text-on-surface-variant">Match</th>
                            <th class="text-left px-5 py-4 font-label-caps text-xs text-on-surface-variant">Tournament</th>
                            <th class="text-left px-5 py-4 font-label-caps text-xs text-on-surface-variant">Venue</th>
                            <th class="text-left px-5 py-4 font-label-caps text-xs text-on-surface-variant">Date & Time</th>
                            <th class="text-left px-5 py-4 font-label-caps text-xs text-on-surface-variant">Status</th>
                            <th class="text-right px-5 py-4 font-label-caps text-xs text-on-surface-variant">Actions</th>
                        </tr>
                    </thead>

                    <tbody>
                        <template x-for="match in paginatedMatches" :key="match.id">
                            <tr class="border-t border-border-subtle hover:bg-surface-container transition-colors">
                                <td class="px-5 py-5">
                                    <div class="flex items-center gap-3">
                                        <div class="flex items-center gap-2">
                                            <img class="w-8 h-8 rounded-full object-cover" :src="match.team1Img" alt=""/>
                                            <span class="font-semibold text-on-surface" x-text="match.team1"></span>
                                        </div>
                                        <span class="text-on-surface-variant text-xs">VS</span>
                                        <div class="flex items-center gap-2">
                                            <img class="w-8 h-8 rounded-full object-cover" :src="match.team2Img" alt=""/>
                                            <span class="font-semibold text-on-surface" x-text="match.team2"></span>
                                        </div>
                                    </div>
                                </td>

                                <td class="px-5 py-5 text-sm text-on-surface-variant" x-text="match.tournament"></td>
                                <td class="px-5 py-5 text-sm text-on-surface-variant" x-text="match.venue"></td>
                                <td class="px-5 py-5 text-sm text-on-surface-variant" x-text="match.dateTime"></td>

                                <td class="px-5 py-5">
                                    <span
                                        class="inline-flex px-2.5 py-1 rounded text-xs font-semibold"
                                        :class="{
                                            'bg-primary-container text-on-primary-container': match.status === 'LIVE',
                                            'bg-surface-container-high text-on-surface': match.status === 'UPCOMING',
                                            'bg-yellow-900/40 text-yellow-300': match.status === 'DELAYED',
                                            'bg-surface-container-highest text-on-surface-variant': match.status === 'COMPLETED',
                                            'bg-red-900/40 text-red-300': match.status === 'ABANDONED'
                                        }"
                                        x-text="match.status"
                                    ></span>
                                </td>

                                <td class="px-5 py-5">
                                    <div class="flex justify-end gap-2">
                                        <button @click.stop="openModal('edit', match)" class="p-1 hover:text-primary-fixed transition-colors" title="Edit">
                                            <span class="material-symbols-outlined">edit</span>
                                        </button>

                                        <button @click.stop="deleteMatch(match.id)" class="p-1 hover:text-red-400 transition-colors" title="Delete">
                                            <span class="material-symbols-outlined">delete</span>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </template>

                        <tr x-show="paginatedMatches.length === 0">
                            <td colspan="6" class="px-5 py-12 text-center text-on-surface-variant">
                                No matches found.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="border-t border-border-subtle px-5 py-4 flex items-center justify-between">
                <div class="text-sm text-on-surface-variant">
                    Showing
                    <span class="text-on-surface font-medium" x-text="paginationStart"></span>
                    -
                    <span class="text-on-surface font-medium" x-text="paginationEnd"></span>
                    of
                    <span class="text-on-surface font-medium" x-text="filteredMatches.length"></span>
                </div>

                <div class="flex items-center gap-2">
                    <button
                        @click="currentPage = Math.max(1, currentPage - 1)"
                        :disabled="currentPage === 1"
                        class="px-3 py-2 rounded bg-surface-container hover:bg-surface-container-high disabled:opacity-40 disabled:cursor-not-allowed"
                    >
                        <span class="material-symbols-outlined">chevron_left</span>
                    </button>

                    <template x-for="page in totalPages" :key="page">
                        <button
                            @click="currentPage = page"
                            class="min-w-9 px-3 py-2 rounded"
                            :class="currentPage === page ? 'bg-primary-container text-on-primary-container' : 'bg-surface-container hover:bg-surface-container-high'"
                            x-text="page"
                        ></button>
                    </template>

                    <button
                        @click="currentPage = Math.min(totalPages, currentPage + 1)"
                        :disabled="currentPage === totalPages || totalPages === 0"
                        class="px-3 py-2 rounded bg-surface-container hover:bg-surface-container-high disabled:opacity-40 disabled:cursor-not-allowed"
                    >
                        <span class="material-symbols-outlined">chevron_right</span>
                    </button>
                </div>
            </div>
        </div>
    </section>
</main>

<!-- Modal -->
<div
    x-show="isModalOpen"
    x-cloak
    class="fixed inset-0 z-50 flex items-center justify-center p-4"
>
    <div
        @click="closeModal()"
        class="absolute inset-0 bg-black/70"
    ></div>

    <div
        @click.stop
        class="relative w-full max-w-2xl bg-surface-container border border-border-subtle rounded-lg shadow-2xl"
    >
        <div class="flex items-center justify-between p-6 border-b border-border-subtle">
            <h3 class="font-headline-md text-headline-md text-primary" x-text="modalMode === 'add' ? 'Add New Match' : 'Edit Match'"></h3>

            <button @click="closeModal()" class="text-on-surface-variant hover:text-primary">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <div class="p-6 overflow-y-auto">
            <form @submit.prevent="saveMatch" class="flex flex-col gap-4">

                <div class="flex gap-4">
                    <div class="flex-1 flex flex-col gap-1">
                        <label class="font-label-caps text-label-caps text-on-surface-variant">Team 1</label>

                        <input
                            class="bg-surface-container-low border border-border-subtle rounded text-primary text-sm px-3 py-2 focus:border-primary-fixed focus:ring-0"
                            required
                            type="text"
                            x-model="editingMatch.team1"
                            autocomplete="off"
                            autocorrect="off"
                            autocapitalize="words"
                            spellcheck="false"
                        />
                    </div>

                    <div class="flex-1 flex flex-col gap-1">
                        <label class="font-label-caps text-label-caps text-on-surface-variant">Team 2</label>

                        <input
                            class="bg-surface-container-low border border-border-subtle rounded text-primary text-sm px-3 py-2 focus:border-primary-fixed focus:ring-0"
                            required
                            type="text"
                            x-model="editingMatch.team2"
                            autocomplete="off"
                            autocorrect="off"
                            autocapitalize="words"
                            spellcheck="false"
                        />
                    </div>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="font-label-caps text-label-caps text-on-surface-variant">Tournament</label>

                    <input
                        class="bg-surface-container-low border border-border-subtle rounded text-primary text-sm px-3 py-2 focus:border-primary-fixed focus:ring-0"
                        required
                        type="text"
                        x-model="editingMatch.tournament"
                    />
                </div>

                <div class="flex flex-col gap-1">
                    <label class="font-label-caps text-label-caps text-on-surface-variant">Venue</label>

                    <input
                        class="bg-surface-container-low border border-border-subtle rounded text-primary text-sm px-3 py-2 focus:border-primary-fixed focus:ring-0"
                        required
                        type="text"
                        x-model="editingMatch.venue"
                    />
                </div>

                <div class="flex gap-4">
                    <div class="flex-1 flex flex-col gap-1">
                        <label class="font-label-caps text-label-caps text-on-surface-variant">
                            Date &amp; Time (e.g. Oct 24, 14:00 UTC)
                        </label>

                        <input
                            class="bg-surface-container-low border border-border-subtle rounded text-primary text-sm px-3 py-2 focus:border-primary-fixed focus:ring-0"
                            required
                            type="text"
                            x-model="editingMatch.dateTime"
                        />
                    </div>

                    <div class="w-1/3 flex flex-col gap-1">
                        <label class="font-label-caps text-label-caps text-on-surface-variant">Status</label>

                        <select
                            class="bg-surface-container-low border border-border-subtle rounded text-primary text-sm px-3 py-2 focus:border-primary-fixed focus:ring-0"
                            required
                            x-model="editingMatch.status"
                        >
                            <option value="LIVE">LIVE</option>
                            <option value="UPCOMING">UPCOMING</option>
                            <option value="DELAYED">DELAYED</option>
                            <option value="COMPLETED">COMPLETED</option>
                            <option value="ABANDONED">ABANDONED</option>
                        </select>
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-border-subtle">
                    <button
                        type="button"
                        @click="closeModal()"
                        class="px-5 py-2 rounded bg-surface-container-high text-on-surface hover:bg-surface-container-highest"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="px-5 py-2 rounded bg-primary-container text-on-primary-container font-semibold hover:bg-primary-fixed-dim"
                    >
                        Save Match
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('matchManagement', () => ({
        matches: [
            {
                id: 1,
                team1: 'IND',
                team2: 'AUS',
                team1Img: 'https://via.placeholder.com/24',
                team2Img: 'https://via.placeholder.com/24',
                tournament: 'T20 World Cup',
                venue: 'Melbourne Cricket Ground',
                dateTime: 'Oct 24, 14:00 UTC',
                status: 'LIVE',
                rawDate: '2023-10-24'
            },
            {
                id: 2,
                team1: 'ENG',
                team2: 'RSA',
                team1Img: 'https://via.placeholder.com/24',
                team2Img: 'https://via.placeholder.com/24',
                tournament: 'T20 World Cup',
                venue: 'Sydney Cricket Ground',
                dateTime: 'Oct 25, 09:30 UTC',
                status: 'UPCOMING',
                rawDate: '2023-10-25'
            },
            {
                id: 3,
                team1: 'MI',
                team2: 'CSK',
                team1Img: 'https://via.placeholder.com/24',
                team2Img: 'https://via.placeholder.com/24',
                tournament: 'Indian Premier League',
                venue: 'Wankhede Stadium',
                dateTime: 'Oct 25, 14:00 UTC',
                status: 'DELAYED',
                rawDate: '2023-10-25'
            },
            {
                id: 4,
                team1: 'NZ',
                team2: 'PAK',
                team1Img: 'https://via.placeholder.com/24',
                team2Img: 'https://via.placeholder.com/24',
                tournament: 'T20 World Cup',
                venue: 'Brisbane Cricket Ground',
                dateTime: 'Oct 23, 10:00 UTC',
                status: 'COMPLETED',
                rawDate: '2023-10-23'
            },
            {
                id: 5,
                team1: 'BAN',
                team2: 'AFG',
                team1Img: 'https://via.placeholder.com/24',
                team2Img: 'https://via.placeholder.com/24',
                tournament: 'T20 World Cup',
                venue: 'Adelaide Oval',
                dateTime: 'Oct 26, 05:00 UTC',
                status: 'UPCOMING',
                rawDate: '2023-10-26'
            }
        ],

        searchQuery: '',

        filters: {
            status: '',
            tournament: '',
            date: ''
        },

        currentPage: 1,
        itemsPerPage: 4,

        isModalOpen: false,
        modalMode: 'add',

        editingMatch: {
            id: null,
            team1: '',
            team2: '',
            tournament: '',
            venue: '',
            dateTime: '',
            status: 'UPCOMING'
        },

        get filteredMatches() {
            return this.matches.filter(match => {
                const matchesSearch =
                    this.searchQuery === '' ||
                    `${match.team1} ${match.team2} ${match.tournament}`
                        .toLowerCase()
                        .includes(this.searchQuery.toLowerCase());

                const matchesStatus =
                    this.filters.status === '' ||
                    match.status === this.filters.status;

                const matchesTournament =
                    this.filters.tournament === '' ||
                    match.tournament === this.filters.tournament;

                const matchesDate =
                    this.filters.date === '' ||
                    (match.rawDate && match.rawDate === this.filters.date);

                return (
                    matchesSearch &&
                    matchesStatus &&
                    matchesTournament &&
                    matchesDate
                );
            });
        },

        get totalPages() {
            return Math.ceil(
                this.filteredMatches.length / this.itemsPerPage
            );
        },

        get paginatedMatches() {
            const start =
                (this.currentPage - 1) * this.itemsPerPage;

            const end = start + this.itemsPerPage;

            return this.filteredMatches.slice(start, end);
        },

        get paginationStart() {
            return this.filteredMatches.length === 0
                ? 0
                : ((this.currentPage - 1) * this.itemsPerPage) + 1;
        },

        get paginationEnd() {
            return Math.min(
                this.currentPage * this.itemsPerPage,
                this.filteredMatches.length
            );
        },

        deleteMatch(id) {
            if (confirm('Are you sure you want to delete this match?')) {
                this.matches = this.matches.filter(
                    m => m.id !== id
                );

                if (
                    this.currentPage > this.totalPages &&
                    this.totalPages > 0
                ) {
                    this.currentPage = this.totalPages;
                }
            }
        },

        openModal(mode, match = null) {
            this.modalMode = mode;

            if (mode === 'edit' && match) {
                this.editingMatch = {
                    ...match
                };
            } else {
                this.editingMatch = {
                    id: Date.now(),
                    team1: '',
                    team2: '',
                    tournament: '',
                    venue: '',
                    dateTime: '',
                    status: 'UPCOMING',
                    team1Img: 'https://via.placeholder.com/24',
                    team2Img: 'https://via.placeholder.com/24'
                };
            }

            this.isModalOpen = true;
        },

        closeModal() {
            this.isModalOpen = false;
        },

        saveMatch() {
            if (
                !this.editingMatch.team1 ||
                !this.editingMatch.team2
            ) {
                alert('Please enter both Team 1 and Team 2.');
                return;
            }

            if (this.modalMode === 'add') {
                this.matches.unshift({
                    ...this.editingMatch
                });
            } else {
                const index = this.matches.findIndex(
                    m => m.id === this.editingMatch.id
                );

                if (index !== -1) {
                    this.matches[index] = {
                        ...this.editingMatch
                    };
                }
            }

            this.closeModal();
        },

        init() {
            this.$watch(
                'filters',
                () => {
                    this.currentPage = 1;
                },
                {
                    deep: true
                }
            );

            this.$watch(
                'searchQuery',
                () => {
                    this.currentPage = 1;
                }
            );
        }
    }));
});
</script>

</body>
</html>
