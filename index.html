<!DOCTYPE html>

<html lang="en" class="dark">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>BAAZIGAR LIVE LINE — Admin</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  background:#0d0f12;

  color:#e8eadf;

  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif

}

button,input,select{font:inherit}

button{cursor:pointer}

.neon{color:#b7ff00}

.bg-neon{background:#b7ff00;color:#080a08}

.panel{

  background:#191c21;

  border:1px solid #343840;

  border-radius:18px;

}

.nav-item{

  width:100%;

  display:flex;

  align-items:center;

  gap:16px;

  padding:18px 20px;

  color:#bfc3b5;

  background:transparent;

  border:0;

  text-align:left;

}

.nav-item:hover,.nav-item.active{

  background:#182207;

  color:#b7ff00;

  border-left:4px solid #b7ff00;

}

.modal-bg{

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.75);

  z-index:100;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;

}

.modal{

  width:100%;

  max-width:650px;

  max-height:90vh;

  overflow:auto;

  background:#191c21;

  border:1px solid #3b4048;

  border-radius:20px;

  padding:24px;

}

.field{

  width:100%;

  background:#0f1115;

  border:1px solid #3c4149;

  color:white;

  padding:13px 14px;

  border-radius:10px;

  outline:none;

}

.field:focus{border-color:#b7ff00}

.score-btn{

  min-height:65px;

  border:1px solid #3b4048;

  background:#22262d;

  color:white;

  border-radius:14px;

  font-size:22px;

  font-weight:700;

}

.score-btn:hover{background:#30353e}

.danger{color:#ff8e8e}

@media(max-width:800px){

  #sidebar{transform:translateX(-100%);transition:.25s}

  #sidebar.open{transform:translateX(0)}

  #overlay.show{display:block}

}

</style>

</head>

<body>

<!-- MOBILE OVERLAY -->

<div id="overlay" onclick="closeSidebar()"

style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40"></div>

<!-- SIDEBAR -->

<aside id="sidebar"

style="position:fixed;left:0;top:0;bottom:0;width:290px;background:#090b0d;border-right:1px solid #292d33;z-index:50;overflow-y:auto">

  <div style="padding:28px 24px 18px">

    <div style="font-size:28px;font-weight:900">

      BAAZIGAR <span class="neon">LIVE LINE</span>

    </div>

    <div style="margin-top:18px;letter-spacing:5px;color:#aeb3a5">

      ADMIN CONTROL PANEL

    </div>

  </div>

  <div style="padding:18px">

    <button class="bg-neon"

      onclick="openNewMatch()"

      style="width:100%;padding:18px;border:0;border-radius:16px;font-size:20px;font-weight:800">

      ＋ New Match

    </button>

  </div>

  <nav>

    <button class="nav-item active" onclick="showPage('dashboard',this)">▦ <span>Dashboard</span></button>

    <button class="nav-item" onclick="showPage('matches',this)">⚒ <span>Match Management</span></button>

    <button class="nav-item" onclick="showPage('series',this)">▣ <span>Series</span></button>

    <button class="nav-item" onclick="showPage('teams',this)">♟ <span>Teams</span></button>

    <button class="nav-item" onclick="showPage('players',this)">♙ <span>Players</span></button>

    <button class="nav-item" onclick="showPage('api',this)">◆ <span>API Settings</span></button>

    <button class="nav-item" onclick="showPage('users',this)">♙ <span>User Management</span></button>

  </nav>

  <div style="position:absolute;bottom:0;width:100%;border-top:1px solid #292d33">

    <button class="nav-item" onclick="showPage('settings',this)">⚙ <span>Settings</span></button>

    <button class="nav-item danger" onclick="logout()">⇥ <span>Logout</span></button>

  </div>

</aside>

<!-- MAIN -->

<main style="margin-left:290px;min-height:100vh">

<header style="height:90px;border-bottom:1px solid #292d33;display:flex;align-items:center;justify-content:space-between;padding:0 28px">

  <button onclick="openSidebar()" style="background:none;border:0;color:white;font-size:28px;display:none" id="menuBtn">☰</button>

  <div>

    <b id="pageTitle" style="font-size:25px">Overview</b>

  </div>

  <div style="display:flex;align-items:center;gap:15px">

    <div style="border:1px solid #597d00;color:#b7ff00;padding:10px 15px;border-radius:10px">

      ● API STATUS: <b>ACTIVE</b>

    </div>

    <div class="bg-neon"

      style="width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px">

      A

    </div>

  </div>

</header>

<div id="app" style="padding:28px;max-width:1400px;margin:auto"></div>

</main>

<!-- MODAL -->

<div id="modalRoot"></div>

<script>

/* =========================================================

   BAAZIGAR LIVE LINE

   Complete frontend admin + cricket scoring system

========================================================= */

const KEY="baazigar_live_line_data";

let data=JSON.parse(localStorage.getItem(KEY)||"null")||{

  matches:[],

  series:[],

  teams:[],

  players:[],

  users:[

    {id:1,name:"Admin",email:"admin@baazigar.local",role:"Administrator"}

  ],

  settings:{

    siteName:"BAAZIGAR LIVE LINE",

    apiUrl:"",

    apiKey:""

  }

};

function save(){

  localStorage.setItem(KEY,JSON.stringify(data));

}

let currentPage="dashboard";

let currentMatch=null;

function esc(v){

  return String(v??"").replace(/[&<>"']/g,m=>({

    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"

  }[m]));

}

function showPage(page,el){

  currentPage=page;

  document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));

  if(el)el.classList.add("active");

  const titles={

    dashboard:"Overview",

    matches:"Match Management",

    series:"Series",

    teams:"Teams",

    players:"Players",

    api:"API Settings",

    users:"User Management",

    settings:"Settings"

  };

  document.getElementById("pageTitle").textContent=titles[page]||"Overview";

  if(innerWidth<=800)closeSidebar();

  render();

}

function render(){

  const app=document.getElementById("app");

  if(currentPage==="dashboard")app.innerHTML=dashboardHTML();

  if(currentPage==="matches")app.innerHTML=matchesHTML();

  if(currentPage==="series")app.innerHTML=seriesHTML();

  if(currentPage==="teams")app.innerHTML=teamsHTML();

  if(currentPage==="players")app.innerHTML=playersHTML();

  if(currentPage==="api")app.innerHTML=apiHTML();

  if(currentPage==="users")app.innerHTML=usersHTML();

  if(currentPage==="settings")app.innerHTML=settingsHTML();

}

/* ================= DASHBOARD ================= */

function dashboardHTML(){

  const live=data.matches.filter(m=>m.status==="LIVE").length;

  const upcoming=data.matches.filter(m=>m.status==="UPCOMING").length;

  const finished=data.matches.filter(m=>m.status==="FINISHED").length;

  return `

  <section>

    <h1 style="font-size:48px;margin:0;font-weight:900">Overview</h1>

    <p style="font-size:20px;color:#b9bdad">BAAZIGAR LIVE control center</p>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:30px">

      ${stat("TOTAL USERS",data.users.length,"♟")}

      ${stat("LIVE MATCHES",live,"⚒")}

      ${stat("UPCOMING MATCHES",upcoming,"▣")}

      ${stat("FINISHED MATCHES",finished,"✓")}

      ${stat("ACTIVE SERIES",data.series.length,"▤")}

    </div>

    <div class="panel" style="padding:22px;margin-top:25px">

      <div style="display:flex;justify-content:space-between;align-items:center">

        <h2 style="margin:0">Recent Matches</h2>

        <button onclick="showPage('matches')" style="background:none;border:1px solid #444;color:white;padding:9px 13px;border-radius:9px">

          View all

        </button>

      </div>

      <div style="margin-top:15px">

        ${

          data.matches.length

          ? data.matches.slice().reverse().slice(0,5).map(matchRow).join("")

          : `<p style="color:#92978c">No matches created yet.</p>`

        }

      </div>

    </div>

  </section>`;

}

function stat(name,value,icon){

 return `

 <div class="panel" style="padding:26px;min-height:160px">

   <div style="display:flex;justify-content:space-between;color:#c5c9b8;font-weight:700">

     <span>${name}</span><span class="neon" style="font-size:28px">${icon}</span>

   </div>

   <div style="font-size:55px;font-weight:900;margin-top:25px">${value}</div>

 </div>`;

}

/* ================= MATCHES ================= */

function matchesHTML(){

 return `

 <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">

   <div>

     <h1 style="font-size:40px;margin:0">Match Management</h1>

     <p style="color:#aeb3a5">Create, manage and score matches.</p>

   </div>

   <button class="bg-neon" onclick="openNewMatch()"

     style="border:0;padding:14px 20px;border-radius:12px;font-weight:800">

     ＋ New Match

   </button>

 </div>

 <div style="display:grid;gap:16px;margin-top:25px">

 ${

   data.matches.length

   ? data.matches.slice().reverse().map(matchCard).join("")

   : `<div class="panel" style="padding:35px;text-align:center;color:#92978c">

       No matches yet. Create your first match.

      </div>`

 }

 </div>`;

}

function matchRow(m){

 return `

 <div onclick="openMatch(${m.id})"

 style="padding:15px;border-top:1px solid #30343a;cursor:pointer">

   <b>${esc(m.teamA)} vs ${esc(m.teamB)}</b>

   <span style="float:right;color:${m.status==="LIVE"?"#b7ff00":"#aaa"}">${m.status}</span>

 </div>`;

}

function matchCard(m){

 const s=m.score||emptyScore();

 return `

 <div class="panel" style="padding:20px">

   <div style="display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap">

     <div>

       <div style="font-size:23px;font-weight:800">

         ${esc(m.teamA)} <span style="color:#888">vs</span> ${esc(m.teamB)}

       </div>

       <div style="color:#a8ad9f;margin-top:5px">

         ${esc(m.format)} • ${esc(m.venue||"Venue not set")}

       </div>

     </div>

     <div>

       <span style="

         padding:7px 12px;border-radius:20px;

         background:${m.status==="LIVE"?"#233400":"#292d33"};

         color:${m.status==="LIVE"?"#b7ff00":"#ddd"}">

         ${m.status}

       </span>

     </div>

   </div>

   <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px">

     <div style="background:#101216;padding:18px;border-radius:12px">

       <small>${esc(m.teamA)}</small>

       <div style="font-size:30px;font-weight:900">${s.innings1.runs}/${s.innings1.wickets}</div>

       <small>${s.innings1.overs} overs</small>

     </div>

     <div style="background:#101216;padding:18px;border-radius:12px">

       <small>${esc(m.teamB)}</small>

       <div style="font-size:30px;font-weight:900">${s.innings2.runs}/${s.innings2.wickets}</div>

       <small>${s.innings2.overs} overs</small>

     </div>

   </div>

   <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">

     ${

       m.status!=="FINISHED"

       ? `<button class="bg-neon" onclick="openMatch(${m.id})"

          style="border:0;padding:11px 18px;border-radius:10px;font-weight:800">

          ${m.status==="LIVE"?"Open Scoring":"Start Match"}

        </button>`

       : `<button onclick="openMatch(${m.id})"

          style="background:#282c32;color:white;border:0;padding:11px 18px;border-radius:10px">

          View Score

        </button>`

     }

     <button onclick="editMatch(${m.id})"

       style="background:#282c32;color:white;border:0;padding:11px 18px;border-radius:10px">

       Edit

     </button>

     <button onclick="deleteMatch(${m.id})"

       style="background:#351d20;color:#ff9b9b;border:0;padding:11px 18px;border-radius:10px">

       Delete

     </button>

   </div>

 </div>`;

}

/* ================= NEW MATCH ================= */

function openNewMatch(){

 document.getElementById("modalRoot").innerHTML=`

 <div class="modal-bg" onclick="if(event.target===this)closeModal()">

   <div class="modal">

     <div style="display:flex;justify-content:space-between">

       <h2 style="margin:0">Create New Match</h2>

       <button onclick="closeModal()" style="background:none;border:0;color:#aaa;font-size:25px">×</button>

     </div>

     <div style="display:grid;gap:14px;margin-top:22px">

       <label>Team A

         <input id="newTeamA" class="field" placeholder="India">

       </label>

       <label>Team B

         <input id="newTeamB" class="field" placeholder="Australia">

       </label>

       <label>Format

         <select id="newFormat" class="field">

           <option>T20</option>

           <option>ODI</option>

           <option>Test</option>

         </select>

       </label>

       <label>Venue

         <input id="newVenue" class="field" placeholder="Stadium">

       </label>

       <label>Date

         <input id="newDate" type="datetime-local" class="field">

       </label>

       <button class="bg-neon" onclick="createMatch()"

         style="border:0;padding:15px;border-radius:12px;font-weight:900">

         CREATE MATCH

       </button>

     </div>

   </div>

 </div>`;

}

function createMatch(){

 const a=document.getElementById("newTeamA").value.trim();

 const b=document.getElementById("newTeamB").value.trim();

 if(!a||!b){

   alert("Dono teams ke naam bharna zaroori hai.");

   return;

 }

 const m={

   id:Date.now(),

   teamA:a,

   teamB:b,

   format:document.getElementById("newFormat").value,

   venue:document.getElementById("newVenue").value.trim(),

   date:document.getElementById("newDate").value,

   status:"UPCOMING",

   score:emptyScore(),

   createdAt:new Date().toISOString()

 };

 data.matches.push(m);

 save();

 closeModal();

 currentPage="matches";

 document.getElementById("pageTitle").textContent="Match Management";

 render();

}

function editMatch(id){

 const m=data.matches.find(x=>x.id===id);

 if(!m)return;

 document.getElementById("modalRoot").innerHTML=`

 <div class="modal-bg">

  <div class="modal">

   <h2>Edit Match</h2>

   <div style="display:grid;gap:14px;margin-top:20px">

    <input id="editA" class="field" value="${esc(m.teamA)}">

    <input id="editB" class="field" value="${esc(m.teamB)}">

    <select id="editStatus" class="field">

      <option ${m.status==="UPCOMING"?"selected":""}>UPCOMING</option>

      <option ${m.status==="LIVE"?"selected":""}>LIVE</option>

      <option ${m.status==="FINISHED"?"selected":""}>FINISHED</option>

    </select>

    <input id="editVenue" class="field" value="${esc(m.venue||"")}" placeholder="Venue">

    <div style="display:flex;gap:10px">

      <button class="bg-neon" onclick="saveMatchEdit(${id})"

       style="border:0;padding:13px 18px;border-radius:10px;font-weight:800">

       SAVE

      </button>

      <button onclick="closeModal()"

       style="background:#333;color:white;border:0;padding:13px 18px;border-radius:10px">

       CANCEL

      </button>

    </div>

   </div>

  </div>

 </div>`;

}

function saveMatchEdit(id){

 const m=data.matches.find(x=>x.id===id);

 if(!m)return;

 m.teamA=document.getElementById("editA").value.trim();

 m.teamB=document.getElementById("editB").value.trim();

 m.status=document.getElementById("editStatus").value;

 m.venue=document.getElementById("editVenue").value.trim();

 save();

 closeModal();

 render();

}

function deleteMatch(id){

 if(!confirm("Is match ko delete karna hai?"))return;

 data.matches=data.matches.filter(x=>x.id!==id);

 save();

 render();

}

/* ================= SCORING ================= */

function emptyInnings(){

 return {

   runs:0,

   wickets:0,

   balls:0,

   overs:"0.0",

   batsman1:"Batter 1",

   batsman2:"Batter 2",

   bowler:"Bowler",

   striker:1,

   target:null,

   history:[]

 };

}

function emptyScore(){

 return {

   innings1:emptyInnings(),

   innings2:emptyInnings(),

   activeInnings:1

 };

}

function openMatch(id){

 const m=data.matches.find(x=>x.id===id);

 if(!m)return;

 currentMatch=id;

 if(m.status==="UPCOMING"){

   m.status="LIVE";

   save();

 }

 renderScoring(m);

}

function renderScoring(m){

 const s=m.score||emptyScore();

 const inn=s.activeInnings===1?s.innings1:s.innings2;

 document.getElementById("pageTitle").textContent="Live Scoring";

 document.getElementById("app").innerHTML=`

 <div>

   <button onclick="showPage('matches')"

    style="background:none;color:#aaa;border:0;padding:0 0 20px">

    ← Back to Matches

   </button>

   <div style="display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap">

    <div>

      <h1 style="font-size:38px;margin:0">

        ${esc(m.teamA)} <span style="color:#777">vs</span> ${esc(m.teamB)}

      </h1>

      <p style="color:#aaa">${esc(m.format)} • ${esc(m.venue||"")}</p>

    </div>

    <div style="background:#1e2c05;color:#b7ff00;padding:12px 18px;border-radius:12px;font-weight:800">

      ● LIVE

    </div>

   </div>

   <div class="panel" style="padding:25px;margin-top:22px">

     <div style="text-align:center;color:#aaa">

       INNINGS ${s.activeInnings}

     </div>

     <div style="text-align:center;font-size:60px;font-weight:900;margin-top:5px">

       ${inn.runs}/${inn.wickets}

     </div>

     <div style="text-align:center;font-size:20px;color:#b7ff00">

       Overs ${inn.overs}

     </div>

     <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:25px">

       <div style="background:#101216;padding:18px;border-radius:12px">

         <div style="color:#aaa">STRIKER</div>

         <b style="font-size:21px">${esc(inn.batsman1)}</b>

       </div>

       <div style="background:#101216;padding:18px;border-radius:12px">

         <div style="color:#aaa">NON-STRIKER</div>

         <b style="font-size:21px">${esc(inn.batsman2)}</b>

       </div>

     </div>

     <div style="margin-top:15px;background:#101216;padding:18px;border-radius:12px">

       <span style="color:#aaa">BOWLER</span><br>

       <b style="font-size:20px">${esc(inn.bowler)}</b>

     </div>

   </div>

   <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px">

     ${scoreButton(0)}

     ${scoreButton(1)}

     ${scoreButton(2)}

     ${scoreButton(3)}

     ${scoreButton(4)}

     ${scoreButton(6)}

   </div>

   <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px">

     <button class="score-btn" onclick="addExtra('WD')">WIDE</button>

     <button class="score-btn" onclick="addExtra('NB')">NO BALL</button>

     <button class="score-btn" onclick="addExtra('BYE')">BYE</button>

     <button class="score-btn" onclick="addExtra('LB')">LEG BYE</button>

     <button class="score-btn" onclick="addWicket()">WICKET</button>

     <button class="score-btn" onclick="undoBall()">UNDO</button>

   </div>

   <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">

     <button onclick="changePlayers()"

       style="background:#282c32;color:white;border:0;padding:13px 18px;border-radius:10px">

       Change Players

     </button>

     <button onclick="nextInnings()"

       style="background:#282c32;color:white;border:0;padding:13px 18px;border-radius:10px">

       ${s.activeInnings===1?"Start 2nd Innings":"Finish Match"}

     </button>

   </div>

   <div class="panel" style="padding:20px;margin-top:20px">

     <h3>Ball History</h3>

     <div style="display:flex;gap:8px;flex-wrap:wrap">

       ${

         inn.history.length

         ? inn.history.slice().reverse().map((x,i)=>

           `<span style="background:#292d33;padding:7px 11px;border-radius:8px">${esc(x)}</span>`

         ).join("")

         : `<span style="color:#888">No balls recorded.</span>`

       }

     </div>

   </div>

 </div>`;

}

function scoreButton(n){

 return `<button class="score-btn" onclick="addRuns(${n})">${n}</button>`;

}

function getCurrent(){

 const m=data.matches.find(x=>x.id===currentMatch);

 if(!m)return null;

 if(!m.score)m.score=emptyScore();

 return {

   m,

   s:m.score,

   inn:m.score.activeInnings===1?m.score.innings1:m.score.innings2

 };

}

function recordBall(label,runs=0,legal=true){

 const c=getCurrent();

 if(!c)return;

 c.inn.runs+=runs;

 if(legal)c.inn.balls++;

 c.inn.overs=Math.floor(c.inn.balls/6)+"."+(c.inn.balls%6);

 c.inn.history.push(label);

 if(runs%2===1)c.inn.striker=c.inn.striker===1?2:1;

 if(c.inn.balls%6===0){

   const temp=c.inn.batsman1;

   c.inn.batsman1=c.inn.batsman2;

   c.inn.batsman2=temp;

 }

 save();

 renderScoring(c.m);

}

function addRuns(n){

 recordBall(String(n),n,true);

}

function addExtra(type){

 if(type==="WD"){

   recordBall("WD",1,false);

 }else if(type==="NB"){

   recordBall("NB",1,false);

 }else{

   recordBall(type,1,true);

 }

}

function addWicket(){

 const c=getCurrent();

 if(!c)return;

 c.inn.wickets++;

 c.inn.balls++;

 c.inn.overs=Math.floor(c.inn.balls/6)+"."+(c.inn.balls%6);

 c.inn.history.push("W");

 save();

 renderScoring(c.m);

}

function undoBall(){

 const c=getCurrent();

 if(!c||!c.inn.history.length){

   alert("Undo karne ke liye ball nahi hai.");

   return;

 }

 const last=c.inn.history.pop();

 if(last==="W"){

   c.inn.wickets=Math.max(0,c.inn.wickets-1);

   c.inn.balls=Math.max(0,c.inn.balls-1);

 }else if(last==="WD"||last==="NB"){

   c.inn.runs=Math.max(0,c.inn.runs-1);

 }else{

   const n=last==="BYE"||last==="LB"?1:Number(last)||0;

   c.inn.runs=Math.max(0,c.inn.runs-n);

   c.inn.balls=Math.max(0,c.inn.balls-1);

 }

 c.inn.overs=Math.floor(c.inn.balls/6)+"."+(c.inn.balls%6);

 save();

 renderScoring(c.m);

}

 document.getElementById("modalRoot").innerHTML=`

 </div>`;

}

 const c=getCurrent();

 if(!c)return;

 c.inn.batsman1=document.getElementById("p1").value||"Batter 1";

 c.inn.batsman2=document.getElementById("p2").value||"Batter 2";

 c.inn.bowler=document.getElementById("bowler").value||"Bowler";

}

function nextInnings(){

 const c=getCurrent();

 if(!c)return;

 if(c.s.activeInnings===1){

   c.s.activeInnings=2;

   save();

   renderScoring(c.m);

 }else{

   c.m.status="FINISHED";

   save();

   alert("Match finished.");

   showPage("matches");

 }

}
